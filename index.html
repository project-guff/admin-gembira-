<title>Kasir Baso &amp; Mie Ayam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   KASIR BASO & MIE AYAM — stylesheet
   Palet terinspirasi warung baso: merah sambal, hijau daun bawang, char kopi,
   kertas nota krem. Satu keluarga tipe (Plus Jakarta Sans) untuk semua teks.
   ========================================================================== */

:root {
  --bg: #FAF6EE;
  --surface: #FFFFFF;
  --surface-2: #F3EADA;
  --surface-3: #EDE1C9;
  --ink: #2A1E14;
  --ink-soft: #7A6A57;
  --ink-faint: #A6947D;
  --primary: #C43D1C;
  --primary-dark: #9A2F15;
  --primary-tint: #FBE6DD;
  --accent: #2E7A57;
  --accent-tint: #E1F0E6;
  --gold: #D79A26;
  --gold-tint: #FBF0D8;
  --danger: #B3261E;
  --danger-tint: #FBE4E1;
  --border: #E7D9BE;
  --border-soft: #F0E6D2;
  --shadow-1: 0 1px 2px rgba(42,30,20,.06), 0 1px 1px rgba(42,30,20,.04);
  --shadow-2: 0 8px 24px rgba(42,30,20,.14);
  --radius-s: 10px;
  --radius-m: 14px;
  --radius-l: 20px;
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --topbar-h: 60px;
  --bottomnav-h: 64px;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
html { scroll-padding-top: var(--safe-top); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body.no-scroll { overflow: hidden; }
button, input, select, textarea { font-family: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: -0.01em; }
p { margin: 0; }
img { max-width: 100%; }
:focus-visible { outline: 2.5px solid var(--primary); outline-offset: 2px; border-radius: 4px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* ---------- Login ---------- */
.login-screen {
  min-height: calc(100vh - var(--safe-top) - var(--safe-bottom));
  display: flex; align-items: center; justify-content: center; padding: 24px;
  background:
    radial-gradient(60% 50% at 15% 8%, var(--primary-tint) 0%, transparent 60%),
    radial-gradient(50% 45% at 90% 90%, var(--accent-tint) 0%, transparent 60%),
    var(--bg);
}
.login-card {
  width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border-soft);
  border-radius: var(--radius-l); padding: 32px 26px; box-shadow: var(--shadow-2);
}
.login-card__brand {
  font-size: 22px; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 22px; color: var(--ink);
  display: flex; align-items: center; gap: 8px;
}
.login-card__brand .ui-ico { width: 22px; height: 22px; }
.page__head h1 .page-ico { margin-right: 4px; }
.login-hint { margin-top: 14px; font-size: 12.5px; color: var(--ink-faint); text-align: center; }

/* ---------- Login: pemilihan akun ---------- */
.login-shell { width: 100%; max-width: 640px; }
.login-shell__brand {
  font-size: 22px; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 6px; color: var(--ink);
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.login-shell__brand .ui-ico { width: 22px; height: 22px; }
.login-shell__sub { text-align: center; color: var(--ink-soft); font-size: 14px; font-weight: 600; margin: 0 0 26px; }
.acct-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(136px, 1fr)); gap: 14px; }
.acct-card {
  display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
  background: var(--surface); border: 1.5px solid var(--border-soft); border-radius: var(--radius-l);
  padding: 22px 12px 18px; transition: transform .12s ease, box-shadow .15s ease, border-color .15s ease;
}
.acct-card:hover { border-color: var(--border); box-shadow: var(--shadow-1); transform: translateY(-2px); }
.acct-card:active { transform: translateY(0) scale(.97); }
.acct-card__avatar {
  width: 56px; height: 56px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 19px; font-weight: 800; background: var(--av-bg); color: var(--av-fg);
}
.acct-card__avatar--lg { width: 64px; height: 64px; font-size: 22px; }
.acct-card__name { font-size: 14.5px; font-weight: 700; color: var(--ink); line-height: 1.25; }
.acct-card__role {
  font-size: 11px; font-weight: 700; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .03em;
}
.acct-card__role--admin { color: var(--gold); }
.login-back {
  display: inline-flex; align-items: center; gap: 6px; background: transparent; border: none; padding: 0;
  color: var(--ink-soft); font-size: 13.5px; font-weight: 700; margin-bottom: 18px;
}
.login-back .ui-ico { width: 14px; height: 14px; }
.login-back:hover { color: var(--ink); }
.login-card__user { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
.login-card__user-name { font-size: 17px; font-weight: 800; color: var(--ink); }
.login-card__user-role { font-size: 12px; font-weight: 700; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .03em; }
.login-fade { animation: loginFade .18s ease; }
@keyframes loginFade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.login-dua {
  margin: 22px auto 0; max-width: 420px; text-align: center; padding: 14px 18px;
  background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius-m);
}
.login-dua__arabic { direction: rtl; font-size: 19px; font-weight: 700; color: var(--ink); line-height: 1.8; }
.login-dua__note { margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--ink-faint); }
@media (max-width: 480px) {
  .acct-grid { grid-template-columns: repeat(auto-fill, minmax(102px, 1fr)); gap: 10px; }
  .acct-card { padding: 16px 8px 14px; }
  .acct-card__avatar { width: 46px; height: 46px; font-size: 15px; }
}

/* ---------- Form elements ---------- */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field > span { font-size: 13px; font-weight: 600; color: var(--ink-soft); }
.field--indent { padding-left: 4px; border-left: 2px solid var(--border); margin-left: 2px; }
.input {
  width: 100%; border: 1.5px solid var(--border); background: var(--surface); color: var(--ink);
  border-radius: var(--radius-s); padding: 11px 13px; font-size: 15px; font-weight: 500;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-tint); outline: none; }
.input--lg { padding: 14px 15px; font-size: 16px; }
.input--sm { padding: 7px 9px; font-size: 13px; }
textarea.input { resize: vertical; min-height: 44px; }
select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%), linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%); background-position: calc(100% - 18px) center, calc(100% - 13px) center; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
.input-prefix { display: flex; align-items: stretch; border: 1.5px solid var(--border); border-radius: var(--radius-s); overflow: hidden; background: var(--surface); }
.input-prefix > span { display: flex; align-items: center; padding: 0 10px; background: var(--surface-2); color: var(--ink-soft); font-weight: 700; font-size: 14px; }
.input-prefix > input { border: none; border-radius: 0; flex: 1; min-width: 0; }
.input-prefix:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-tint); }
.input-prefix--summary { flex: 1; }
.field-err { color: var(--danger); font-size: 13px; font-weight: 600; margin: -6px 0 12px; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 2px; font-size: 14.5px; font-weight: 600; border-bottom: 1px solid var(--border-soft); gap: 12px; }
.toggle-row input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--primary); flex-shrink: 0; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: none; border-radius: var(--radius-s); padding: 11px 18px; font-size: 14.5px; font-weight: 700;
  transition: transform .08s ease, box-shadow .15s ease, background-color .15s ease, opacity .15s;
  white-space: nowrap;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
.btn--primary { background: var(--primary); color: #fff; box-shadow: var(--shadow-1); }
.btn--primary:hover:not(:disabled) { background: var(--primary-dark); }
.btn--ghost { background: var(--surface-2); color: var(--ink); }
.btn--ghost:hover:not(:disabled) { background: var(--surface-3); }
.btn--danger { background: var(--danger); color: #fff; }
.btn--danger-text { color: var(--danger); background: transparent; }
.btn--block { width: 100%; }
.btn--lg { padding: 15px 20px; font-size: 16px; border-radius: var(--radius-m); }
.btn--sm { padding: 7px 12px; font-size: 13px; border-radius: 8px; }
.btn--pay { font-size: 17px; padding: 16px; border-radius: var(--radius-m); letter-spacing: .01em; }
.spinner { width: 15px; height: 15px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.4); border-top-color: #fff; animation: spin .7s linear infinite; }
.btn--ghost .spinner { border-color: rgba(42,30,20,.25); border-top-color: var(--ink); }
@keyframes spin { to { transform: rotate(360deg); } }

.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; vertical-align: middle; }
.tag--soft { background: var(--accent-tint); color: var(--accent); }
.tag--muted { background: var(--surface-3); color: var(--ink-faint); }
.tag--danger { background: var(--danger-tint); color: var(--danger); }
.tag--warning { background: #FFF3CD; color: #92660B; }
.tag--success { background: #DCF3E6; color: var(--accent); }

.chip { border: 1.5px solid var(--border); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: 13px; font-weight: 700; color: var(--ink); }
.chip:active { transform: scale(.96); }

.order-status-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: -4px 0 16px; }
.order-status-tabs .chip { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.order-status-tabs .chip span { min-width: 20px; text-align: center; padding: 1px 6px; border-radius: 999px; background: var(--surface-2); font-size: 11px; }
.order-status-tabs .chip.is-active { background: var(--primary-tint); border-color: var(--primary); color: var(--primary-dark); }
.order-status-tabs .chip.is-active span { background: #fff; }
@media (max-width: 600px) {
  .order-status-tabs { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; scrollbar-width: thin; }
  .order-status-tabs .chip { flex-shrink: 0; }
}

/* ---------- Shell / layout ---------- */
.shell { min-height: calc(100vh - var(--safe-top) - var(--safe-bottom)); display: flex; flex-direction: column; }
.topbar {
  height: var(--topbar-h); flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 14px;
  background: var(--ink); color: #fff; position: sticky; top: var(--safe-top); z-index: 40;
}
.topbar__menu { background: transparent; border: none; color: #fff; font-size: 20px; padding: 6px 8px; border-radius: 8px; display: none; }
.topbar__collapse { background: transparent; border: none; color: #fff; font-size: 16px; padding: 6px 9px; border-radius: 8px; }
.topbar__collapse:hover { background: rgba(255,255,255,.14); }
.topbar__brand { font-weight: 800; font-size: 16px; letter-spacing: -0.01em; white-space: nowrap; display:flex; align-items:center; gap:7px; }
.topbar__brand .ui-ico { width:18px; height:18px; }
.topbar__mode { margin-left: auto; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.12); color: #EADFCB; }
.topbar__mode--cloud { background: rgba(46,122,87,.35); color: #BFE9D2; }
.topbar__user { font-size: 13px; font-weight: 600; color: #EADFCB; }
.topbar__logout { background: rgba(255,255,255,.1); border: none; color: #fff; padding: 7px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; }
.topbar__logout:hover { background: rgba(255,255,255,.18); }

.sidenav {
  width: 220px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border-soft);
  padding: 16px 10px; position: fixed; top: calc(var(--topbar-h) + var(--safe-top)); bottom: 0; left: 0; z-index: 39;
  display: flex; flex-direction: column; gap: 2px; overflow-y: auto;
  transform: translateX(0); transition: transform .2s ease, width .18s ease;
}
.sidenav__item {
  display: flex; align-items: center; gap: 11px; background: transparent; border: none; text-align: left;
  padding: 7px 10px; border-radius: var(--radius-m); font-size: 14.5px; font-weight: 600; color: var(--ink-soft);
  white-space: nowrap; overflow: hidden;
}
.sidenav__item:hover { background: var(--surface-2); color: var(--ink); }
.sidenav__item.is-active { background: var(--primary-tint); color: var(--primary-dark); }
.sidenav__icon { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0; background: var(--surface-2); color: var(--ink-soft); transition: background .15s ease, color .15s ease; }
.sidenav__item:hover .sidenav__icon { color: var(--ink); }
.sidenav__item.is-active .sidenav__icon { background: var(--primary); color: #fff; }
 .nav-ico { width: 20px; height: 20px; display: block; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.ui-ico { width: 18px; height: 18px; display: inline-block; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.22em; }
.ui-ico--lg { width: 20px; height: 20px; }
.cat-ico { width: 19px; height: 19px; }
.button-ico { width: 17px; height: 17px; }
.page-ico { width: 21px; height: 21px; vertical-align: -0.2em; margin-right: 3px; }
.status-ico { width: 15px; height: 15px; vertical-align: -0.18em; margin-right: 3px; }

.sidenav-scrim { display: none; }
.sidenav__group { padding: 14px 10px 6px; font-size: 12px; font-weight: 700; color: var(--ink-faint); white-space: nowrap; overflow: hidden; }
.sidenav__group:first-child { padding-top: 2px; }
.sidenav.is-collapsed .sidenav__group { height: 1px; padding: 0; margin: 10px; background: var(--border); font-size: 0; }
.sidenav.is-collapsed .sidenav__group:first-child { display: none; }

/* Sidebar diciutkan (desktop): hanya ikon yang tampil, teks kategori disembunyikan. */
.sidenav.is-collapsed { width: 60px; padding: 16px 8px; }
.sidenav.is-collapsed .sidenav__item { justify-content: center; padding: 7px 0; }
.sidenav.is-collapsed .sidenav__label { display: none; }
.content.is-collapsed { margin-left: 60px; }

.content { flex: 1; margin-left: 220px; padding-bottom: calc(var(--bottomnav-h) + 24px); min-height: 0; transition: margin-left .18s ease; }
.bottomnav { display: none; }

@media (max-width: 900px) {
  .topbar__menu { display: block; }
  .topbar__collapse { display: none; }
  .topbar__brand { font-size: 14.5px; }
  .sidenav {
    transform: translateX(-100%); box-shadow: var(--shadow-2); top: 0; padding-top: calc(16px + var(--safe-top) + var(--topbar-h));
  }
  .sidenav.is-open { transform: translateX(0); }
  .sidenav.is-collapsed { width: 220px; }
  .sidenav.is-collapsed .sidenav__item { justify-content: flex-start; padding: 7px 10px; }
  .sidenav.is-collapsed .sidenav__label { display: inline; }
  .sidenav.is-collapsed .sidenav__group { height: auto; padding: 14px 10px 6px; margin: 0; background: none; font-size: 12px; }
  .sidenav.is-collapsed .sidenav__group:first-child { display: block; padding-top: 2px; }
  .content.is-collapsed { margin-left: 0; }
  .sidenav-scrim { display: none; position: fixed; inset: 0; background: rgba(20,14,8,.4); z-index: 38; }
  .sidenav-scrim.is-show { display: block; }
  .content { margin-left: 0; padding-bottom: calc(var(--bottomnav-h) + var(--safe-bottom) + 90px); }
  .bottomnav {
    display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--surface);
    border-top: 1px solid var(--border-soft); padding: 6px 4px calc(6px + var(--safe-bottom));
    box-shadow: 0 -4px 14px rgba(42,30,20,.06);
  }
  .bottomnav__item { flex: 1; background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; font-size: 10.5px; font-weight: 700; color: var(--ink-faint); border-radius: 10px; }
  .bottomnav__item span:first-child { display: grid; place-items: center; height: 24px; }
  .bottomnav__item .nav-ico { width: 22px; height: 22px; }
  .bottomnav__item.is-active { color: var(--primary); background: var(--primary-tint); }
}

/* ---------- Generic page ---------- */
.page { padding: 20px 22px 40px; max-width: 1100px; }
.page--narrow { max-width: 620px; }
.page__head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
.page__head h1 { font-size: 21px; }
.page__sub { color: var(--ink-faint); font-size: 13.5px; font-weight: 600; }
.page-loading, .empty-state { padding: 60px 20px; text-align: center; color: var(--ink-faint); font-size: 14.5px; font-weight: 600; }
@media (max-width: 600px) { .page { padding: 16px 14px 32px; } }

/* ---------- Kasir layout ---------- */
.kasir { display: flex; align-items: flex-start; gap: 0; }
.kasir__main { flex: 1; min-width: 0; padding: 16px 18px 40px; }
.kasir__cart { width: 360px; flex-shrink: 0; position: sticky; top: calc(var(--topbar-h) + var(--safe-top)); height: calc(100vh - var(--topbar-h) - var(--safe-top)); border-left: 1px solid var(--border-soft); background: var(--surface); }
.kasir__cart--desktop { display: none; }
@media (min-width: 901px) { .kasir__cart--desktop { display: block; } }
@media (max-width: 600px) { .kasir__main { padding: 12px 12px 100px; } }

/* Sidebar kategori di halaman Kasir: selalu tampil (bukan overlay) di semua ukuran layar,
   sehingga tidak pernah "tertutup sendiri" saat kategori dipilih. */
.kasir__catnav {
  flex-shrink: 0; width: 188px; position: sticky; top: calc(var(--topbar-h) + var(--safe-top));
  height: calc(100vh - var(--topbar-h) - var(--safe-top)); overflow-y: auto; -webkit-overflow-scrolling: touch;
  border-right: 1px solid var(--border-soft); background: var(--surface); padding: 12px 8px; box-sizing: border-box;
  scrollbar-width: thin; z-index: 1;
}
@media (max-width: 900px) {
  .kasir__catnav { width: 92px; padding: 10px 6px; }
}
@media (max-width: 600px) {
  .kasir__catnav { width: 78px; padding: 8px 5px; }
}

.order-type { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.order-type__btn {
  display: flex; align-items: center; justify-content: center; padding: 11px 18px; border-radius: var(--radius-m);
  border: 1.5px solid var(--border); background: var(--surface); color: var(--ink-soft);
  font-size: 20px; font-weight: bold; text-align: center;
}
.order-type__btn.is-active { background: var(--ink); border-color: var(--ink); color: #fff; }
.order-table { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.order-table label { font-size: 13px; font-weight: 700; color: var(--ink-soft); }
.order-table select { width: 150px; }
@media (max-width: 560px) { .order-table { margin-left: 0; width: 100%; } .order-table select { flex: 1; width: auto; } }
.order-type__label { font-size: 13px; font-weight: 700; color: var(--ink-soft); margin-right: 2px; }
.order-type .order-type__btn { font-size: 14px; padding: 9px 14px; }

/* ---------- Kelompok Take Away / Dine In di keranjang ---------- */
.cart-group { margin-bottom: 6px; }
.cart-group__label {
  font-size: 12px; font-weight: 800; letter-spacing: .03em; color: var(--primary-dark);
  background: var(--primary-tint); padding: 5px 10px; border-radius: 8px; margin: 6px 0 4px;
}
.cart-item__type-toggle { display: flex; gap: 6px; margin-top: 6px; }
.chip--sm { padding: 4px 9px; font-size: 11.5px; }
.cart-item__type-btn { color: var(--ink-soft); }
.cart-item__type-btn.is-selected { background: var(--ink); border-color: var(--ink); color: #fff; }

.cat-bar { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 12px; margin-bottom: 4px; scrollbar-width: thin; }
.cat-chip {
  flex-shrink: 0; display: flex; align-items: center; gap: 7px; padding: 9px 15px; border-radius: 999px;
  border: 1.5px solid var(--border); background: var(--surface); font-weight: 700; font-size: 13.5px; color: var(--ink-soft);
}
.cat-chip.is-active { background: var(--primary); border-color: var(--primary); color: #fff; }

/* Kategori kasir sebagai sidebar vertikal (lihat .kasir__catnav). Tombol dibuat besar
   agar mudah ditekan (area sentuh cukup) dan status aktif terlihat jelas. */
.cat-nav { display: flex; flex-direction: column; gap: 6px; }
.cat-nav .cat-chip {
  width: 100%; text-align: left; border-radius: var(--radius-m); min-height: 48px;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent; cursor: pointer;
}
.cat-nav .cat-chip__ico { width: 20px; height: 20px; display:grid; place-items:center; flex-shrink:0; }
.cat-nav .cat-chip__ico .ui-ico { width: 19px; height: 19px; }
.cat-nav .cat-chip__label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-nav .cat-chip:active { background: var(--primary-tint); }
.cat-nav .cat-chip.is-active:active { background: var(--primary); }
@media (max-width: 900px) {
  .cat-nav .cat-chip { flex-direction: column; gap: 3px; padding: 8px 3px; text-align: center; min-height: 58px; }
  .cat-nav .cat-chip__label { white-space: normal; font-size: 10.5px; line-height: 1.15; word-break: break-word; }
  .cat-nav .cat-chip__ico { font-size: 18px; }
}

.prod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 12px; }
.prod-card {
  text-align: left; background: var(--surface); border: 1.5px solid var(--border-soft); border-radius: var(--radius-m);
  padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 5px; min-height: 92px;
  border-bottom: 3px solid var(--gold); box-shadow: var(--shadow-1); transition: transform .08s ease, box-shadow .12s ease;
}
.prod-card:hover { box-shadow: var(--shadow-2); }
.prod-card:active { transform: scale(.98); }
.prod-card__name { font-weight: 700; font-size: 14.5px; line-height: 1.25; }
.prod-card__desc { font-size: 12px; color: var(--ink-faint); line-height: 1.3; }
.prod-card__price { margin-top: auto; font-weight: 800; color: var(--primary-dark); font-size: 14.5px; padding-top: 4px; }

.custom-form { max-width: 380px; background: var(--surface); border: 1.5px solid var(--border-soft); border-radius: var(--radius-l); padding: 20px; }
.custom-form__title { font-weight: 800; font-size: 15px; margin-bottom: 14px; }
.qty-stepper { display: inline-flex; align-items: center; gap: 0; border: 1.5px solid var(--border); border-radius: 999px; overflow: hidden; }
.qty-stepper--form { width: 100%; justify-content: space-between; }
.qty-btn { width: 38px; height: 38px; background: var(--surface-2); border: none; font-size: 19px; font-weight: 700; color: var(--ink); display: flex; align-items: center; justify-content: center; }
.qty-btn:active { background: var(--surface-3); }
.qty-input, .qty-val { min-width: 34px; text-align: center; font-weight: 800; font-size: 15px; border: none; background: transparent; }
.qty-val--lg { font-size: 19px; min-width: 44px; }

/* ---------- Modal / overlay ---------- */
.overlay { position: fixed; inset: 0; background: rgba(24,17,11,.48); display: flex; align-items: flex-end; justify-content: center; z-index: 100; opacity: 0; transition: opacity .18s ease; padding: 0; }
.overlay.is-show { opacity: 1; }
@media (min-width: 640px) { .overlay { align-items: center; padding: 20px; } }
.modal {
  background: var(--surface); width: 100%; max-height: 92vh; overflow-y: auto;
  border-radius: var(--radius-l) var(--radius-l) 0 0; transform: translateY(16px); transition: transform .2s ease;
  padding-bottom: var(--safe-bottom);
}
.overlay.is-show .modal { transform: translateY(0); }
@media (min-width: 640px) {
  .modal { border-radius: var(--radius-l); transform: translateY(8px) scale(.98); }
  .overlay.is-show .modal { transform: translateY(0) scale(1); }
  .modal--sm { max-width: 400px; }
  .modal--md { max-width: 480px; }
  .modal--lg { max-width: 680px; }
}
.modal__head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 8px; gap: 12px; }
.modal__title { font-size: 17px; }
.modal__x { background: var(--surface-2); border: none; width: 32px; height: 32px; border-radius: 999px; font-size: 15px; color: var(--ink-soft); flex-shrink: 0; }
.modal__body { padding: 10px 20px 6px; }
.modal__foot { padding: 14px 20px calc(16px + var(--safe-bottom)); display: flex; gap: 10px; border-top: 1px solid var(--border-soft); margin-top: 8px; }
.modal__foot .btn--block { flex: 1; }
.confirm-msg { font-size: 14.5px; color: var(--ink-soft); line-height: 1.5; padding: 4px 0 10px; }

.product-modal__desc { font-size: 13.5px; color: var(--ink-soft); margin-bottom: 6px; }
.product-modal__price { font-weight: 800; font-size: 19px; color: var(--primary-dark); margin-bottom: 16px; }
.field-group { margin-bottom: 16px; }
.field-group__label { font-size: 13px; font-weight: 700; color: var(--ink-soft); margin-bottom: 8px; }
.field-group__label--sub { margin-top: 10px; }
.field-group__hint { font-size: 12px; font-weight: 400; color: var(--ink-soft); opacity: .75; }
.choice-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.choice-grid--2 { grid-template-columns: repeat(2, 1fr); }
.choice-grid--wrap { display: flex; flex-wrap: wrap; gap: 8px; }
.choice-card {
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 6px;
  border: 1.5px solid var(--border); border-radius: var(--radius-s); background: var(--surface); font-weight: 700; font-size: 12.5px; color: var(--ink-soft);
}
.choice-card__icon { display: flex; align-items: center; justify-content: center; }
.choice-card__icon .ui-ico { width: 20px; height: 20px; }

/** Isi menu awal lewat adapter aktif. Aman dijalankan ulang: tidak menduplikasi nama yang sudah ada.
 *  Mengembalikan laporan rinci: { categoriesAdded, menuAdded, menuSkipped, failed: [{name, reason}] }. */
async function seedMenu(adapter) {
  const report = { categoriesAdded: 0, menuAdded: 0, menuSkipped: 0, failed: [] };
  const cats = await adapter.listCategories();
  let order = cats.reduce((m, c) => Math.max(m, c.sort_order || 0), 0);
  for (const sc of SEED_MENU) {
    let cat = cats.find(c => c.name.toLowerCase() === sc.name.toLowerCase());
    if (!cat) {
      try {
        cat = await adapter.saveCategory({ name: sc.name, icon: sc.icon, custom_mode: sc.custom_mode, active: true, sort_order: ++order });
        cats.push(cat); report.categoriesAdded++;
      } catch (e) {
        for (const p of sc.products) report.failed.push({ name: `${sc.name} / ${p.name}`, reason: e.message || "Gagal membuat kategori" });
        continue;
      }
    }
    const existing = (await adapter.listProducts()).filter(p => p.category_id === cat.id).map(p => p.name.toLowerCase());
    const toAdd = sc.products.filter(p => !existing.includes(p.name.toLowerCase()));
    report.menuSkipped += sc.products.length - toAdd.length;
    if (!toAdd.length) continue;
    const rows = toAdd.map((p, i) => ({ ...p, category_id: cat.id, active: true, sort_order: existing.length + i + 1 }));
    try {
      await adapter.bulkInsertProducts(rows);
      report.menuAdded += rows.length;
    } catch (e) {
      // Coba satu per satu supaya kegagalan satu menu tidak menggagalkan seluruh kategori.
      for (const row of rows) {
        try { await adapter.saveProduct(row); report.menuAdded++; }
        catch (e2) { report.failed.push({ name: row.name, reason: e2.message || "Gagal disimpan" }); }
      }
    }
  }
  return report;
}

/** Format laporan seedMenu() menjadi teks ringkas untuk Toast/alert. */
function formatSeedReport(report) {
  const lines = [];
  lines.push(`Berhasil: ${report.categoriesAdded} kategori, ${report.menuAdded} menu`);
  if (report.menuSkipped) lines.push(`Dilewati (sudah ada): ${report.menuSkipped} menu`);
  if (report.failed.length) {
    lines.push(`Gagal: ${report.failed.length} menu`);
    for (const f of report.failed.slice(0, 10)) lines.push(`  • ${f.name}: ${f.reason}`);
    if (report.failed.length > 10) lines.push(`  … dan ${report.failed.length - 10} lainnya`);
  }
  return lines.join("\n");
}

/** Perbaikan struktur menu: pastikan "1 Sekrup Tetelan" ada di kategori "Tambahan"
 *  (dibuat otomatis kalau belum ada), dan kategori "Baso Satuan" & "Es Krim"
 *  sama-sama pakai mode custom nama + harga. Aman dijalankan berkali-kali. */
async function repairMenu(adapter) {
  const norm = s => (s || "").toLowerCase().trim();
  let cats = await adapter.listCategories();
  let order = cats.reduce((m, c) => Math.max(m, c.sort_order || 0), 0);

  // 1) Pastikan kategori "Tambahan" ada
  let tambahan = cats.find(c => norm(c.name) === "tambahan");
  if (!tambahan) {
    tambahan = await adapter.saveCategory({ name: "Tambahan", icon: "➕", custom_mode: "none", active: true, sort_order: ++order });
    cats.push(tambahan);
  }

  // 2) Pastikan "1 Sekrup Tetelan" cuma ada di kategori "Tambahan"
  const products = await adapter.listProducts();
  const tetelanItems = products.filter(p => norm(p.name).includes("sekrup tetelan"));
  if (tetelanItems.length) {
    for (const it of tetelanItems) {
      if (it.category_id !== tambahan.id) await adapter.saveProduct({ id: it.id, category_id: tambahan.id });
    }
  } else {
    await adapter.saveProduct({
      category_id: tambahan.id, name: "1 Sekrup Tetelan", price: 7000, description: "",
      requires_condiment: false, condiment_options: null, allow_ice_option: false,
      active: true, sort_order: products.filter(p => p.category_id === tambahan.id).length + 1
    });
  }

  // 3) Samakan mode custom "Baso Satuan" & "Es Krim": nama + harga bisa diatur kasir
  for (const nm of ["baso satuan", "es krim"]) {
    const cat = cats.find(c => norm(c.name) === nm);
    if (cat && cat.custom_mode !== "name_price") {
      await adapter.saveCategory({ id: cat.id, custom_mode: "name_price" });
    }
  }

  // 4) Pastikan semua menu di kategori "Mie Yamin" punya pilihan Asin/Manis
  const yaminCat = cats.find(c => norm(c.name) === "mie yamin");
  if (yaminCat) {
    for (const p of products.filter(p => p.category_id === yaminCat.id && !p.allow_taste_option)) {
      await adapter.saveProduct({ id: p.id, allow_taste_option: true });
    }
  }
}

/* ---------- Perangkat (pengaturan per perangkat) ---------- */
const Device = {
  key: "kasir.device.v1",
  data: { paper: 58, autoprint: false, autoprint_dapur: false, use_bt_printer: false, bt_device_name: "", auto_cut: true, supa_url: "", supa_key: "" },
  load() { try { Object.assign(this.data, JSON.parse(localStorage.getItem(this.key) || "{}")); } catch (e) { /* abaikan */ } },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { /* abaikan */ } },
  get(k) { return this.data[k]; },
  set(patch) { Object.assign(this.data, patch); this.save(); },
  /** lebar karakter struk */
  get width() { return Number(this.data.paper) === 80 ? 42 : 32; }
};

/** ---------- Printer Bluetooth (ESC/POS via Web Bluetooth) ----------
 * Catatan penting: Web Bluetooth hanya mendukung profil BLE (GATT), bukan Bluetooth
 * klasik (SPP) yang dipakai sebagian printer thermal murah. Printer thermal ber-BLE
 * umumnya memakai UUID generik di bawah ini. Jika printer tidak muncul / gagal
 * terhubung, printer tsb kemungkinan hanya mendukung SPP klasik dan tidak bisa
 * dipakai lewat browser — gunakan opsi "Cetak via Dialog Cetak" (window.print) yang
 * tetap tersedia di menu Bill Dapur / Bill Pembayaran sebagai jalan alternatif.
 * Juga hanya berjalan di browser yang mendukung Web Bluetooth (Chrome/Edge Android
 * & desktop); tidak didukung di Safari/iOS. */
const BtPrinter = {
  device: null, server: null, characteristic: null,
  SERVICE_CANDIDATES: [
    { service: "000018f0-0000-1000-8000-00805f9b34fb", characteristic: "00002af1-0000-1000-8000-00805f9b34fb" }, // umum di banyak printer thermal BLE
    { service: "0000ff00-0000-1000-8000-00805f9b34fb", characteristic: "0000ff02-0000-1000-8000-00805f9b34fb" }  // varian lain yang cukup umum
  ],
  /* Perintah ESC/POS baku: ESC @ = reset/init printer; GS V 66 n = "Feed paper & partial cut"
     (fungsi B) — perintah cut paling banyak didukung printer thermal 58/80mm ber-ESC/POS
     (termasuk klon), lebih kompatibel daripada GS V 0 (full cut) di banyak printer murah. */
  ESC_INIT: new Uint8Array([0x1B, 0x40]),
  CUT: new Uint8Array([0x1D, 0x56, 0x42, 0x00]),
  isSupported() { return !!(navigator.bluetooth && navigator.bluetooth.requestDevice); },
  isConnected() { return !!(this.characteristic && this.device && this.device.gatt && this.device.gatt.connected); },
  async connect() {
    if (!this.isSupported()) throw new Error("Browser ini tidak mendukung Web Bluetooth. Coba Chrome di Android/desktop.");
    const allUuids = this.SERVICE_CANDIDATES.flatMap(c => [c.service, c.characteristic]);
    this.device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: allUuids });
    this.server = await this.device.gatt.connect();
    let found = null;
    for (const cand of this.SERVICE_CANDIDATES) {
      try {
        const service = await this.server.getPrimaryService(cand.service);
        const characteristic = await service.getCharacteristic(cand.characteristic);
        found = characteristic; break;
      } catch (e) { /* coba kandidat berikutnya */ }
    }
    if (!found) {
      try {
        const services = await this.server.getPrimaryServices();
        for (const service of services) {
          try {
            const chars = await service.getCharacteristics();
            found = chars.find(c => c.properties.write || c.properties.writeWithoutResponse) || null;
            if (found) break;
          } catch (e) { /* lanjut */ }
        }
      } catch (e) { /* GATT tidak mengizinkan enumerasi layanan di sebagian browser */ }
    }
    if (!found) { this.disconnect(); throw new Error("Layanan cetak tidak ditemukan di perangkat ini. Printer mungkin tidak mendukung BLE."); }
    this.characteristic = found;
    this.device.addEventListener("gattserverdisconnected", () => { this.characteristic = null; });
    Device.set({ bt_device_name: this.device.name || "Printer Bluetooth" });
    return this.device.name || "Printer Bluetooth";
  },
  disconnect() {
    try { this.device?.gatt?.disconnect(); } catch (e) { /* abaikan */ }
    this.device = null; this.server = null; this.characteristic = null;
  },
  /** Kirim teks ke printer sebagai perintah ESC/POS: init + teks + feed + (opsional) potong
      kertas otomatis, dipotong per-chunk karena batas MTU BLE. Urutan WAJIB: data bill selesai
      terkirim dulu → feed → baru perintah cut, supaya kertas tidak pernah terpotong di tengah
      bill. Cut dikirim hanya jika pengaturan "Potong Otomatis (Auto Cut)" aktif (Device.auto_cut,
      default true) — dimatikan otomatis dianggap printer tidak mendukung/dimatikan oleh kasir.
      Karena BLE generik tidak melaporkan balik apakah printer benar-benar memotong kertas,
      kegagalan mengirim byte cut dilempar sebagai error terpisah (lihat opts.onCutError) alih-alih
      membuat seluruh proses cetak dianggap gagal — bill yang sudah terkirim tetap tercetak. */
  async printText(text, opts = {}) {
    if (!this.isConnected()) throw new Error("Printer Bluetooth belum terhubung.");
    const encoder = new TextEncoder();
    const FEED = new Uint8Array([0x0A, 0x0A, 0x0A, 0x0A]); // beberapa baris kosong agar bill keluar dari area cutter
    const body = encoder.encode(text.replace(/\n/g, "\r\n") + "\r\n");
    const dataLen = this.ESC_INIT.length + body.length + FEED.length;
    const dataPayload = new Uint8Array(dataLen);
    dataPayload.set(this.ESC_INIT, 0);
    dataPayload.set(body, this.ESC_INIT.length);
    dataPayload.set(FEED, this.ESC_INIT.length + body.length);
    await this._sendFeedAndCut(dataPayload, opts);
  },
  /** Kirim byte mentah ke printer per-chunk (aman untuk batas MTU BLE default). */
  async _sendBytes(payload) {
    const chunkSize = 20;
    for (let i = 0; i < payload.length; i += chunkSize) {
      const chunk = payload.slice(i, i + chunkSize);
      if (this.characteristic.properties.writeWithoutResponse) await this.characteristic.writeValueWithoutResponse(chunk);
      else await this.characteristic.writeValue(chunk);
      await sleep(20);
    }
  },
  /** Kirim byte cut sebagai langkah TERAKHIR setelah seluruh payload (data+feed) selesai terkirim.
      Dipakai bersama oleh printText & printSegments supaya perilaku cut/cutFailed konsisten. */
  async _sendFeedAndCut(payload, opts) {
    await this._sendBytes(payload); // 1) seluruh isi bill (data + feed) WAJIB selesai terkirim
    const wantCut = opts.cut !== false && Device.get("auto_cut") !== false;
    if (wantCut) {
      try { await this._sendBytes(this.CUT); } // 2) baru kirim perintah potong, sebagai langkah terakhir
      catch (e) { const err = new Error("Bill sudah tercetak, tetapi perintah potong otomatis gagal terkirim."); err.cutFailed = true; throw err; }
    }
  },
  /** Perintah ESC/POS untuk perataan teks (ESC a n) & tebal (ESC E n) & ukuran karakter (GS ! n).
      GS_SIZE_DOUBLE = tinggi & lebar karakter 2x (dipakai untuk baris Dine In/Take Away & Nama
      Pelanggan pada Bill Kitchen agar menonjol, setara ±20px pada versi cetak HTML). */
  ALIGN: { left: 0x00, center: 0x01, right: 0x02 },
  GS_SIZE_NORMAL: new Uint8Array([0x1D, 0x21, 0x00]),
  GS_SIZE_DOUBLE: new Uint8Array([0x1D, 0x21, 0x11]),
  ESC_BOLD_ON: new Uint8Array([0x1B, 0x45, 0x01]),
  ESC_BOLD_OFF: new Uint8Array([0x1B, 0x45, 0x00]),
  /** Cetak beberapa "segmen" teks dengan format berbeda-beda (rata kiri/tengah, tebal, ukuran
      normal/2x) dalam satu bill — dipakai khusus Bill Kitchen agar baris Dine In/Take Away & Nama
      Pelanggan bisa dibuat menonjol (tebal, 2x ukuran, rata tengah) sementara sisa isi bill tetap
      memakai format standar seperti sebelumnya. Setiap segmen otomatis dikembalikan ke format
      normal (kiri, tidak tebal, ukuran normal) sesudahnya supaya tidak "bocor" ke segmen berikut.
      Urutan & aturan cut identik dengan printText (data selesai → feed → cut, lihat _sendFeedAndCut). */
  async printSegments(segments, opts = {}) {
    if (!this.isConnected()) throw new Error("Printer Bluetooth belum terhubung.");
    const encoder = new TextEncoder();
    const FEED = new Uint8Array([0x0A, 0x0A, 0x0A, 0x0A]); // beberapa baris kosong agar bill keluar dari area cutter
    const parts = [this.ESC_INIT];
    for (const seg of segments) {
      const align = this.ALIGN[seg.align] ?? this.ALIGN.left;
      if (align !== this.ALIGN.left) parts.push(new Uint8Array([0x1B, 0x61, align]));
      if (seg.bold) parts.push(this.ESC_BOLD_ON);
      if (seg.size === "double") parts.push(this.GS_SIZE_DOUBLE);
      parts.push(encoder.encode(String(seg.text || "").replace(/\n/g, "\r\n") + "\r\n"));
      if (seg.size === "double") parts.push(this.GS_SIZE_NORMAL);
      if (seg.bold) parts.push(this.ESC_BOLD_OFF);
      if (align !== this.ALIGN.left) parts.push(new Uint8Array([0x1B, 0x61, this.ALIGN.left]));
    }
    parts.push(FEED);
    const dataLen = parts.reduce((n, p) => n + p.length, 0);
    const dataPayload = new Uint8Array(dataLen);
    let off = 0; for (const p of parts) { dataPayload.set(p, off); off += p.length; }
    await this._sendFeedAndCut(dataPayload, opts);
  }
};

/** Pengecekan koneksi printer sebelum aktivitas yang membutuhkan cetak (Bill Kitchen & Bill
    Pembayaran di alur Bayar/Lunas Transaksi Tersimpan). Hanya berlaku ketika toko benar-benar
    memakai printer Bluetooth yang dikelola aplikasi (pengaturan "Gunakan Printer Bluetooth" aktif)
    — kalau opsi itu mati, aplikasi tidak punya status "terhubung/tidak" untuk diperiksa (toko
    memakai dialog cetak sistem/browser seperti biasa), jadi tidak ada gerbang yang perlu dipasang
    dan aktivitas berjalan seperti sebelumnya. PIN pelewatan (PRINTER_BYPASS_PIN) sepenuhnya
    terpisah dari ACTION_PIN (PIN Refund) — tidak pernah saling menggantikan. */
const PrinterGate = {
  isEnabled() { return !!(Device.get("use_bt_printer") && BtPrinter.isSupported()); },
  isConnected() { return this.isEnabled() && BtPrinter.isConnected(); },

  /** Tampilkan pemberitahuan "printer belum terhubung" dengan 2 pilihan.
      Resolve "connect" | "skip" | "cancel" (cancel = ditutup/Escape/klik luar). */
  promptDisconnected(activityLabel) {
    return new Promise(resolve => {
      const overlay = Modal.open({
        title: `${ico("🖨️")} Printer Belum Terhubung`, size: "sm", dismissible: true,
        body: `<p class="confirm-msg">Printer belum terhubung. Hubungkan printer terlebih dahulu untuk menjalankan aktivitas ini (${esc(activityLabel)}).</p>`,
        footer: `<button type="button" class="btn btn--ghost" data-act="skip">Tetap Jalankan Tanpa Printer</button>
                 <button type="button" class="btn btn--primary" data-act="connect" autofocus>Hubungkan Printer</button>`,
        onClose: () => resolve("cancel")
      });
      const done = val => { overlay._close = () => { overlay.remove(); Modal.stack = Modal.stack.filter(x => x !== overlay); }; Modal.close(overlay); resolve(val); };
      $('[data-act="connect"]', overlay).addEventListener("click", () => done("connect"));
      $('[data-act="skip"]', overlay).addEventListener("click", () => done("skip"));
    });
  },

  /** Peringatan tegas ke-2 + input PIN untuk melanjutkan tanpa printer.
      Resolve true bila PIN benar & dikonfirmasi, false bila dibatalkan (Batal/Escape/klik luar). */
  promptBypassPin() {
    return new Promise(resolve => {
      const overlay = Modal.open({
        title: `${ico("⚠️")} Peringatan`, size: "sm",
        body: `<p class="confirm-msg">Printer belum terhubung. Aktivitas akan tetap dijalankan <strong>TANPA mencetak Bill</strong>.
               Pastikan Anda benar-benar yakin ingin melanjutkan tanpa printer.</p>
               <p class="confirm-msg">Untuk melanjutkan, masukkan PIN:</p>
               <input type="password" inputmode="numeric" maxlength="8" class="input input--lg" id="printer-bypass-pin" placeholder="PIN" autofocus>
               <p class="field-err" id="printer-bypass-err" hidden></p>`,
        footer: `<button type="button" class="btn btn--ghost" data-act="cancel">Batal</button>
                 <button type="button" class="btn btn--danger" data-act="ok">Konfirmasi &amp; Lanjutkan</button>`,
        onClose: () => resolve(false)
      });
      const input = $("#printer-bypass-pin", overlay), err = $("#printer-bypass-err", overlay);
      const submit = () => {
        const pin = input.value.trim();
        if (pin === PRINTER_BYPASS_PIN) { overlay._close = () => { overlay.remove(); Modal.stack = Modal.stack.filter(x => x !== overlay); }; Modal.close(overlay); resolve(true); }
        else { Toast.error("PIN salah. Aktivitas tidak dapat dilanjutkan tanpa printer."); err.textContent = "PIN salah."; err.hidden = false; input.value = ""; input.focus(); }
      };
      $('[data-act="cancel"]', overlay).addEventListener("click", () => { resolve(false); Modal.close(overlay); });
      $('[data-act="ok"]', overlay).addEventListener("click", submit);
      input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
    });
  },

  /** Jalankan pengecekan penuh sebelum aktivitas yang butuh cetak. Mengembalikan:
        { proceed: true,  skipPrint: false } -> printer terhubung, lanjutkan & cetak seperti biasa
        { proceed: true,  skipPrint: true  } -> dilanjutkan tanpa printer (PIN benar); JANGAN cetak
        { proceed: false }                   -> dibatalkan; JANGAN jalankan aktivitas sama sekali
      Tidak pernah mengubah/menghapus data transaksi — hanya menentukan boleh/tidaknya aktivitas
      lanjut dan apakah percetakan boleh dicoba. */
  async ensure(activityLabel) {
    if (!this.isEnabled()) return { proceed: true, skipPrint: false };
    if (this.isConnected()) return { proceed: true, skipPrint: false };
    // eslint-disable-next-line no-constant-condition
    while (true) {
      const choice = await this.promptDisconnected(activityLabel);
      if (choice === "cancel") return { proceed: false };
      if (choice === "connect") {
        try {
          await BtPrinter.connect();
          if (this.isConnected()) return { proceed: true, skipPrint: false };
          Toast.error("Printer belum berhasil terhubung. Coba lagi.");
        } catch (e) { Toast.error(`Gagal menghubungkan printer: ${friendlyError(e)}`); }
        continue; // tampilkan lagi pilihan Hubungkan / Tetap Tanpa Printer
      }
      if (choice === "skip") {
        const pinOk = await this.promptBypassPin();
        if (pinOk) return { proceed: true, skipPrint: true };
        return { proceed: false }; // Batal di layar PIN membatalkan seluruh aktivitas
      }
    }
  }
};

const State = {
  key: "kasir.draft.v2",
  d: null,
  fresh() {
    return {
      orderType: null, tableNo: "", customerName: "", cart: [],
      discountType: "nominal", discountValue: "", payment: "", paymentMethod: "tunai",
      customDrafts: {}, txnKey: uid(), heldId: null, heldLabel: "",
      editingOrderId: null, editingOrderNumber: "", payExistingOrderId: null
    };
  },
  load() {
    try {
      const raw = localStorage.getItem(this.key);
      this.d = raw ? { ...this.fresh(), ...JSON.parse(raw) } : this.fresh();
    } catch (e) { this.d = this.fresh(); }
    if (!Array.isArray(this.d.cart)) this.d.cart = [];
    if (!this.d.customDrafts || typeof this.d.customDrafts !== "object") this.d.customDrafts = {};
    if (!PAYMENT_METHODS[this.d.paymentMethod]) this.d.paymentMethod = "tunai";
  },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.d)); } catch (e) { /* mode privat / penuh */ } },
  set(patch) { Object.assign(this.d, patch); this.save(); },
  /** mulai transaksi baru. Draft custom form tetap dipertahankan. */
  reset() {
    const customDrafts = this.d.customDrafts;
    this.d = { ...this.fresh(), customDrafts };
    this.save();
  }
};

const Cart = {
  lineTotal(l) { return l.qty * l.base_price; },
  key(l) {
    return [l.product_id || "", l.name, l.base_price, l.condiment || "", l.condiment_detail || "",
      l.temperature || "", l.taste || "", (l.notes || "").trim(), l.orderType || ""].join("|");
  },
  add(line) {
    const cart = State.d.cart;
    const k = this.key(line);
    const found = cart.find(l => this.key(l) === k);
    if (found) found.qty = Math.min(999, found.qty + line.qty);
    else cart.push({ ...line, id: uid() });
    State.save();
  },
  find(id) { return State.d.cart.find(l => l.id === id); },
  remove(id) {
    const i = State.d.cart.findIndex(l => l.id === id);
    if (i < 0) return null;
    const [line] = State.d.cart.splice(i, 1);
    State.save();
    return { line, index: i };
  },
  restore(r) { State.d.cart.splice(Math.min(r.index, State.d.cart.length), 0, r.line); State.save(); },
  count() { return State.d.cart.reduce((a, l) => a + l.qty, 0); },
  totals(settings) {
    const d = State.d, s = settings || DEFAULT_SETTINGS;
    const subtotal = d.cart.reduce((a, l) => a + this.lineTotal(l), 0);
    const dv = toInt(d.discountValue) || 0;
    const discount = d.discountType === "persen"
      ? Math.round(subtotal * Math.min(dv, 100) / 100)
      : Math.min(dv, subtotal);
    const base = subtotal - discount;
    const tax = s.tax_enabled ? Math.round(base * (Number(s.tax_percent) || 0) / 100) : 0;
    const total = base + tax;
    const payment = toInt(d.payment) || 0;
    return { subtotal, discount, tax, total, payment, change: payment - total };
  }
};

/** Validasi payload pesanan. Dipakai di kasir dan adapter lokal (server Supabase memvalidasi ulang).
 *  opts.requireFullPayment (default true): saat true (tombol BAYAR/LUNAS), uang dibayar wajib
 *  menutupi total. Saat false (tombol Simpan → Belum Bayar), uang dibayar boleh kurang dari
 *  total (termasuk 0) dan tidak boleh mencatat kembalian, karena transaksi belum lunas. */
function validateOrderPayload(p, opts = {}) {
  const requireFullPayment = opts.requireFullPayment !== false;
  if (!String(p.customer_name || "").trim()) return "Nama pelanggan wajib diisi.";
  if (p.customer_name.trim().length > 60) return "Nama pelanggan maksimal 60 karakter.";
  if (!ORDER_TYPES[p.order_type]) return "Pilih Dine In atau Take Away.";
  if (!Array.isArray(p.items) || !p.items.length) return "Keranjang masih kosong.";
  let subtotal = 0;
  for (const it of p.items) {
    const nm = String(it.product_name || "").trim();
    if (!nm) return "Ada item tanpa nama.";
    if (nm.length > 80) return `Nama "${nm.slice(0, 20)}…" terlalu panjang (maks. 80 karakter).`;
    if (!Number.isInteger(it.base_price) || it.base_price < 0) return `Harga "${nm}" tidak valid.`;
    if (it.is_custom && it.base_price <= 0) return `Harga "${nm}" harus lebih dari 0.`;
    if (!Number.isInteger(it.quantity) || it.quantity < 1 || it.quantity > 999) return `Jumlah "${nm}" tidak valid.`;
    if (!ITEM_ORDER_TYPE_KEYS.includes(it.order_type)) return `Pilih Take Away atau Dine In untuk "${nm}".`;
    subtotal += it.quantity * it.base_price;
  }
  if (subtotal !== p.subtotal) return "Subtotal tidak cocok dengan isi keranjang.";
  if (!Number.isInteger(p.discount) || p.discount < 0 || p.discount > subtotal) return "Diskon tidak valid.";
  if (!Number.isInteger(p.tax) || p.tax < 0) return "Pajak tidak valid.";
  const total = subtotal - p.discount + p.tax;
  if (total !== p.total) return "Total tidak cocok.";
  if (requireFullPayment) {
    if (!Number.isInteger(p.payment) || p.payment < total) return `Uang dibayar kurang ${rp(total - (p.payment || 0))}.`;
    if (p.change !== p.payment - total) return "Kembalian tidak cocok.";
  } else {
    if (!Number.isInteger(p.payment) || p.payment < 0 || p.payment > total) return "Uang dibayar untuk transaksi Belum Bayar tidak valid.";
    if (p.change !== 0) return "Transaksi Belum Bayar tidak boleh mencatat kembalian.";
  }
  return null;
}


"use strict";
/* ==========================================================================
   2. DATA — Supabase adalah SATU-SATUNYA database. Tidak ada adapter lokal,
   tidak ada localStorage sebagai penyimpanan data bisnis, tidak ada fallback.
   ========================================================================== */

/* ---------- Adapter Supabase ---------- */
class SupabaseAdapter {
  constructor(url, anonKey) {
    if (!url || !anonKey) throw new Error("URL / anon key Supabase belum diisi.");
    this.url = url.replace(/\/+$/, "");
    this.key = anonKey;
  }
  async _req(path, opts = {}) {
    const res = await fetch(`${this.url}/rest/v1/${path}`, {
      ...opts,
      headers: {
        apikey: this.key, Authorization: `Bearer ${this.key}`, "Content-Type": "application/json",
        Prefer: opts.prefer || "return=representation", ...(opts.headers || {})
      }
    });
    if (!res.ok) {
      let msg = `Supabase error (${res.status})`;
      try { const j = await res.json(); msg = j.message || j.error_description || msg; } catch (e) { /* respons bukan JSON */ }
      throw new Error(msg);
    }
    if (res.status === 204) return null;
    return res.json();
  }

  async listCategories() { return this._req("categories?select=*&order=sort_order.asc"); }
  async ping() { await this._req("categories?select=id&limit=1"); return true; }
  async saveCategory(cat) {
    if (cat.id) { const [r] = await this._req(`categories?id=eq.${cat.id}`, { method: "PATCH", body: JSON.stringify(cat) }); return r; }
    const [r] = await this._req("categories", { method: "POST", body: JSON.stringify({ custom_mode: "none", icon: "🍽️", active: true, sort_order: 0, ...cat }) });
    return r;
  }
  async deleteCategory(id) {
    const inUse = await this._req(`products?select=id&category_id=eq.${id}&limit=1`);
    if (inUse.length) throw new Error("Kategori masih memiliki menu. Hapus atau pindahkan menu terlebih dahulu.");
    await this._req(`categories?id=eq.${id}`, { method: "DELETE", prefer: "return=minimal" });
  }
  async reorderCategories(idsInOrder) {
    await Promise.all(idsInOrder.map((id, i) => this._req(`categories?id=eq.${id}`, { method: "PATCH", body: JSON.stringify({ sort_order: i + 1 }), prefer: "return=minimal" })));
  }

  async listProducts() { return this._req("products?select=*&order=sort_order.asc"); }
  async saveProduct(p) {
    if (p.id) { const { id, ...rest } = p; const [r] = await this._req(`products?id=eq.${id}`, { method: "PATCH", body: JSON.stringify({ ...rest, updated_at: new Date().toISOString() }) }); return r; }
    const [r] = await this._req("products", { method: "POST", body: JSON.stringify({ active: true, requires_condiment: false, allow_ice_option: false, ...p }) });
    return r;
  }
  async bulkInsertProducts(rows) { return this._req("products", { method: "POST", body: JSON.stringify(rows) }); }
  async deleteProduct(id) { await this._req(`products?id=eq.${id}`, { method: "DELETE", prefer: "return=minimal" }); }

  async nextOrderNumber() {
    // Catatan: dipakai hanya untuk tampilan perkiraan (mis. sebelum bayar). Nomor final yang tersimpan
    // dibuat aman terhadap transaksi bersamaan oleh fungsi RPC create_order_with_items di database.
    const today = todayStr().replace(/-/g, "");
    const from = new Date(); from.setHours(0, 0, 0, 0);
    const rows = await this._req(`orders?select=id&created_at=gte.${from.toISOString()}`);
    return `INV-${today}-${String(rows.length + 1).padStart(3, "0")}`;
  }
  async createOrder(payload, opts = {}) {
    const err = validateOrderPayload(payload, opts);
    if (err) throw new Error(err);
    // Order + order_items disimpan atomik lewat RPC create_order_with_items (lihat migration SQL yang akan
    // menyusul). Idempotent terhadap client_txn_key (aman bila tombol bayar tertekan dua kali / refresh
    // setelah bayar). Kalau fungsi RPC ini belum dibuat di database (migration belum dijalankan), otomatis
    // jatuh ke cara lama (dua insert terpisah) supaya kasir tetap bisa transaksi seperti biasa.
    let result;
    try {
      result = await this._req("rpc/create_order_with_items", { method: "POST", body: JSON.stringify({ payload }) });
      if (!result || !result.order) throw new Error("Transaksi gagal disimpan (respons tidak valid dari database).");
    } catch (e) {
      if (!/could not find|schema cache|PGRST202|function .* does not exist/i.test(e.message || "")) throw e;
      console.warn("RPC create_order_with_items belum tersedia di database, memakai jalur cadangan (belum atomik).", e);
      result = await this._createOrderFallback(payload);
    }
    // RPC lama (sebelum migrasi kolom nama pelanggan/status pembayaran) mungkin tidak menuliskan
    // customer_name / payment_status. Pastikan tetap tersimpan lewat PATCH terpisah agar kompatibel
    // baik dengan RPC lama maupun baru, tanpa perlu mengubah definisi RPC di database.
    result.order = await this._ensureOrderExtras(result.order, payload.customer_name);
    return result;
  }
  async _ensureOrderExtras(order, customerName) {
    const name = String(customerName || "").trim();
    const patch = {};
    if (name && order.customer_name !== name) patch.customer_name = name;
    if (!order.payment_status) patch.payment_status = "belum_bayar";
    if (!Object.keys(patch).length) return order;
    try {
      const [updated] = await this._req(`orders?id=eq.${order.id}`, { method: "PATCH", body: JSON.stringify(patch) });
      return updated || { ...order, ...patch };
    } catch (e) {
      console.warn("Tidak dapat menyimpan customer_name/payment_status (migrasi kolom belum dijalankan?).", e);
      return { ...order, ...patch }; // tampilan tetap benar di sesi ini meski penyimpanan gagal
    }
  }
  /** Ubah Menu Pesanan: perbarui transaksi Belum Bayar yang sudah tersimpan tanpa pernah membuat
      Order ID / transaksi baru. Item lama pada order_id ini dihapus lalu diganti dengan item
      terbaru dari keranjang yang sedang diedit, kemudian kolom ringkasan pada baris orders
      (jenis pesanan, meja, nama pelanggan, subtotal/diskon/pajak/total/uang dibayar) ditulis ulang
      mengikuti isi terbaru. Status pembayaran TIDAK disentuh di sini (tetap Belum Bayar) — hanya
      tombol Telah Bayar/Refund/Arsip yang boleh mengubahnya. Ditolak bila transaksi ternyata sudah
      bukan Belum Bayar lagi (mis. sudah dibayar dari perangkat lain) atau sudah dibatalkan. */
  async updateOrderItems(orderId, payload) {
    const err = validateOrderPayload(payload, { requireFullPayment: false });
    if (err) throw new Error(err);
    const current = await this.getOrder(orderId);
    if (!current) throw new Error("Transaksi tidak ditemukan.");
    if (current.status === "cancelled") throw new Error("Transaksi yang sudah dibatalkan tidak bisa diubah.");
    if ((current.payment_status || "belum_bayar") !== "belum_bayar") throw new Error("Hanya transaksi Belum Bayar yang bisa diubah menu pesanannya.");

    await this._req(`order_items?order_id=eq.${orderId}`, { method: "DELETE", prefer: "return=minimal" });
    const items = payload.items.map(it => ({
      order_id: orderId, product_id: it.product_id || null, product_name: it.product_name, base_price: it.base_price,
      quantity: it.quantity, condiment: it.condiment || null, condiment_detail: it.condiment_detail || null,
      temperature: it.temperature || null, taste: it.taste || null, notes: it.notes || "", tetelan_quantity: 0,
      tetelan_price: 0, subtotal: it.quantity * it.base_price, order_type: it.order_type
    }));
    const savedItems = await this._req("order_items", { method: "POST", body: JSON.stringify(items) });

    const [order] = await this._req(`orders?id=eq.${orderId}`, {
      method: "PATCH", body: JSON.stringify({
        order_type: payload.order_type, table_no: payload.table_no || null,
        customer_name: String(payload.customer_name || "").trim(),
        subtotal: payload.subtotal, discount: payload.discount, tax: payload.tax, total: payload.total,
        payment: payload.payment, change: payload.change,
        payment_method: payload.payment_method || "tunai"
      })
    });
    return { order, items: savedItems };
  }
  async _createOrderFallback(payload) {
    const order_number = await this.nextOrderNumber();
    const [order] = await this._req("orders", {
      method: "POST", body: JSON.stringify({
        order_number, order_type: payload.order_type, table_no: payload.table_no || null,
        customer_name: String(payload.customer_name || "").trim(), payment_status: "belum_bayar",
        subtotal: payload.subtotal, discount: payload.discount, tax: payload.tax, total: payload.total,
        payment: payload.payment, change: payload.change, payment_method: payload.payment_method || "tunai",
        cashier: payload.cashier || "Kasir", client_txn_key: payload.client_txn_key || null, status: "completed"
      })
    });
    const items = payload.items.map(it => ({
      order_id: order.id, product_id: it.product_id || null, product_name: it.product_name, base_price: it.base_price,
      quantity: it.quantity, condiment: it.condiment || null, condiment_detail: it.condiment_detail || null,
      temperature: it.temperature || null, taste: it.taste || null, notes: it.notes || "", tetelan_quantity: 0,
      tetelan_price: 0, subtotal: it.quantity * it.base_price, order_type: it.order_type
    }));
    const savedItems = await this._req("order_items", { method: "POST", body: JSON.stringify(items) });
    return { order, items: savedItems };
  }
  async getOrderItemsBulk(orderIds) {
    if (!orderIds.length) return [];
    return this._req(`order_items?select=*&order_id=in.(${orderIds.join(",")})`);
  }
  async listOrders({ from, to, orderType, query, paymentStatus, limit = 500 } = {}) {
    let path = `orders?select=*&order=created_at.desc&limit=${limit}`;
    if (from) path += `&created_at=gte.${from}`;
    if (to) path += `&created_at=lt.${to}`;
    if (orderType) path += `&order_type=eq.${orderType}`;
    if (paymentStatus) path += `&payment_status=eq.${paymentStatus}`;
    if (query) path += `&order_number=ilike.*${encodeURIComponent(query)}*`;
    return this._req(path);
  }
  async getOrderItems(orderId) { return this._req(`order_items?select=*&order_id=eq.${orderId}`); }
  /** Ambil satu order langsung dari Supabase (bukan dari daftar yang sudah dimuat di memori),
      dipakai sebelum membuka struk supaya status pembayaran yang ditampilkan selalu yang terbaru
      (mis. sudah diubah dari perangkat lain). */
  async getOrder(orderId) {
    const [r] = await this._req(`orders?id=eq.${orderId}&select=*`);
    return r || null;
  }
  async cancelOrder(id, reason) {
    const [r] = await this._req(`orders?id=eq.${id}`, { method: "PATCH", body: JSON.stringify({ status: "cancelled", cancel_reason: reason || "", cancelled_at: new Date().toISOString() }) });
    return r;
  }
  /* ---------- Status pembayaran transaksi: Belum Bayar → Telah Bayar / Refund / Arsip.
     Setiap aksi wajib diverifikasi PIN di sisi UI (lihat Modal.promptActionPin) sebelum method ini
     dipanggil. Perubahan langsung ditulis ke Supabase (tidak pernah hanya di frontend), dan waktu
     perubahan disimpan pada kolom *_at masing-masing. Transaksi tidak pernah dihapus oleh aksi ini. */
  async markOrderPaid(id, actor) {
    const paid_at = new Date().toISOString();
    const [r] = await this._req(`orders?id=eq.${id}`, { method: "PATCH", body: JSON.stringify({ payment_status: "telah_bayar", paid_at }) });
    this._logOrderEvent(id, "telah_bayar", actor);
    return r;
  }
  /** Bayar transaksi Belum Bayar yang sudah tersimpan, tanpa membuat transaksi baru. */
  async completeExistingPayment(id, payment, change, paymentMethod, actor) {
    // Hanya transaksi yang masih Belum Bayar yang boleh dilunasi.
    // Kondisi ini juga menjadi pengaman server-side terhadap double click / double submit.
    const paid_at = new Date().toISOString();
    const rows = await this._req(`orders?id=eq.${id}&payment_status=eq.belum_bayar`, { method: "PATCH", body: JSON.stringify({
      payment: Math.max(0, Number(payment) || 0),
      change: Math.max(0, Number(change) || 0),
      payment_method: paymentMethod || "tunai",
      payment_status: "telah_bayar", paid_at
    }) });
    const r = Array.isArray(rows) ? rows[0] : rows;
    if (!r) throw new Error("Transaksi sudah dibayar atau tidak ditemukan. Data tidak diubah.");
    await this._logOrderEvent(id, "telah_bayar", actor);
    return r;
  }
  async refundOrder(id, actor) {
    const refunded_at = new Date().toISOString();
    const [r] = await this._req(`orders?id=eq.${id}`, { method: "PATCH", body: JSON.stringify({ payment_status: "refund", refunded_at }) });
    this._logOrderEvent(id, "refund", actor);
    return r;
  }
  async archiveOrder(id, actor) {
    const archived_at = new Date().toISOString();
    const [r] = await this._req(`orders?id=eq.${id}`, { method: "PATCH", body: JSON.stringify({ payment_status: "arsip", archived_at }) });
    this._logOrderEvent(id, "arsip", actor);
    return r;
  }
  /** Catatan audit opsional (tabel order_events dari migration terbaru). Gagal-lembut: bila tabel
      belum ada (migrasi belum dijalankan), aksi utama di atas tetap berhasil — hanya audit log yang
      terlewat, dengan peringatan di console. */
  async _logOrderEvent(orderId, action, actor) {
    try {
      await this._req("order_events", { method: "POST", prefer: "return=minimal", body: JSON.stringify({ order_id: orderId, action, actor: actor || null }) });
    } catch (e) { console.warn("Gagal mencatat order_events (tabel opsional belum tersedia?).", e); }
  }

  async getSettings() {
    const rows = await this._req("settings?select=*&limit=1");
    return rows[0] ? rows[0].data : { ...DEFAULT_SETTINGS };
  }
  async saveSettings(patch) {
    const current = await this.getSettings();
    const merged = { ...current, ...patch };
    const rows = await this._req("settings?select=id&limit=1");
    if (rows.length) await this._req(`settings?id=eq.${rows[0].id}`, { method: "PATCH", body: JSON.stringify({ data: merged }), prefer: "return=minimal" });
    else await this._req("settings", { method: "POST", body: JSON.stringify({ data: merged }), prefer: "return=minimal" });
    return merged;
  }

  /* ---------- Pengeluaran (dipakai untuk perhitungan Tutup Kasir) ---------- */
  async listExpenses({ from, to } = {}) {
    let path = "expenses?select=*&order=created_at.desc";
    if (from) path += `&created_at=gte.${from}`;
    if (to) path += `&created_at=lt.${to}`;
    return this._req(path);
  }
  async addExpense(e) {
    const [r] = await this._req("expenses", { method: "POST", body: JSON.stringify({ amount: e.amount, category: e.category || "Lainnya", note: e.note || "", cashier: e.cashier || "Kasir" }) });
    return r;
  }
  async deleteExpense(id) { await this._req(`expenses?id=eq.${id}`, { method: "DELETE", prefer: "return=minimal" }); }

  /* ---------- Tutup Kasir (rekap modal, penjualan tunai/QRIS, pengeluaran) ---------- */
  async listCashClosings({ limit = 30 } = {}) { return this._req(`cash_closings?select=*&order=created_at.desc&limit=${limit}`); }
  async getLastClosing() { const rows = await this._req("cash_closings?select=*&order=created_at.desc&limit=1"); return rows[0] || null; }
  /** Transaksi yang DILUNASI sejak `from` (termasuk yang dibuat sebelum periode, mis. Belum Bayar lalu dilunasi hari ini).
      Gagal-lembut: bila kolom paid_at belum ada, kembalikan daftar kosong. */
  async listOrdersPaidSince(from) {
    try { return await this._req(`orders?select=*&payment_status=eq.telah_bayar&paid_at=gte.${from}&limit=2000`); }
    catch (e) { console.warn("Gagal memuat transaksi lunas periode ini (kolom paid_at?).", e); return []; }
  }
  /** Setiap tutup permanent = SATU record baru (POST), tidak pernah menimpa/menghapus riwayat.
      `c` berisi kolom lengkap; bila kolom tambahan (migrasi SQL Tutup Kasir) belum ada di tabel,
      otomatis disimpan hanya dengan kolom lama dan hasilnya ditandai extraColumns=false. */
  async saveCashClosing(c) {
    try {
      const [r] = await this._req("cash_closings", { method: "POST", body: JSON.stringify(c) });
      return { row: r, extraColumns: true };
    } catch (e) {
      if (isNetworkError(e) || !/column|schema cache|PGRST204/i.test(String(e && e.message))) throw e;
      const { subtotal_total, period_to, status, closed_at, closed_by, ...legacy } = c;
      const [r] = await this._req("cash_closings", { method: "POST", body: JSON.stringify(legacy) });
      return { row: r, extraColumns: false };
    }
  }

  async listUsers() { return this._req("users?select=*"); }
  async saveUser(u) {
    if (u.id) { const { id, ...rest } = u; const [r] = await this._req(`users?id=eq.${id}`, { method: "PATCH", body: JSON.stringify(rest) }); return r; }
    const [r] = await this._req("users", { method: "POST", body: JSON.stringify({ active: true, ...u }) });
    return r;
  }
  async deleteUser(id) { await this._req(`users?id=eq.${id}`, { method: "DELETE", prefer: "return=minimal" }); }
  async findUserByUsername(username) { const rows = await this._req(`users?select=*&username=eq.${encodeURIComponent(username)}&limit=1`); return rows[0] || null; }
}

/** Membuat adapter Supabase dan menguji koneksinya. Supabase adalah SATU-SATUNYA database:
 *  tidak ada fallback ke penyimpanan lokal apa pun jika koneksi gagal. */
async function createAdapter() {
  const url = Device.get("supa_url") || APP_CONFIG.SUPABASE_URL;
  const key = Device.get("supa_key") || APP_CONFIG.SUPABASE_ANON_KEY;
  if (!url || !key) {
    return { adapter: null, mode: "error", error: "URL / Anon Key Supabase belum diisi." };
  }
  const adapter = new SupabaseAdapter(url, key);
  try {
    await adapter.listCategories();
    return { adapter, mode: "connected" };
  } catch (e) {
    console.error("Database Supabase tidak dapat dihubungi:", e);
    return { adapter, mode: "error", error: e.message };
  }
}


"use strict";
/* ==========================================================================
   3. UI KIT — toast, modal, konfirmasi, bottom sheet, loading tombol
   ========================================================================== */

const Toast = {
  root: null,
  init() { this.root = $("#toast-root"); },
  show(msg, kind = "info", ms = 2600) {
    if (!this.root) return;
    const el = document.createElement("div");
    el.className = `toast toast--${kind}`;
    el.setAttribute("role", "status");
    el.innerHTML = `<span class="toast__icon">${kind === "success" ? ico("✅") : kind === "error" ? ico("⚠️") : ico("ℹ️")}</span><span>${esc(msg)}</span>`;
    this.root.appendChild(el);
    requestAnimationFrame(() => el.classList.add("is-show"));
    setTimeout(() => { el.classList.remove("is-show"); setTimeout(() => el.remove(), 200); }, ms);
  },
  success(m) { this.show(m, "success"); },
  error(m) { this.show(m, "error", 4200); },
  info(m) { this.show(m); }
};

const Modal = {
  stack: [],
  /** Membuka modal generik. body: HTML string atau elemen. Mengembalikan elemen root modal. */
  open({ title, body, footer = "", size = "md", onClose, dismissible = true, cls = "" }) {
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML = `
      <div class="modal modal--${size} ${cls}" role="dialog" aria-modal="true" aria-label="${esc(title || "")}">
        <div class="modal__head">
          <h2 class="modal__title">${esc(title || "")}</h2>
          ${dismissible ? `<button type="button" class="modal__x" aria-label="Tutup">${ico("✕")}</button>` : ""}
        </div>
        <div class="modal__body"></div>
        ${footer ? `<div class="modal__foot">${footer}</div>` : ""}
      </div>`;
    const bodyEl = $(".modal__body", overlay);
    if (typeof body === "string") bodyEl.innerHTML = body; else bodyEl.appendChild(body);
    document.body.appendChild(overlay);
    document.body.classList.add("no-scroll");
    requestAnimationFrame(() => overlay.classList.add("is-show"));
    const close = () => {
      overlay.classList.remove("is-show");
      setTimeout(() => { overlay.remove(); this.stack = this.stack.filter(x => x !== overlay); if (!this.stack.length) document.body.classList.remove("no-scroll"); }, 180);
      if (onClose) onClose();
    };
    overlay._close = close;
    if (dismissible) {
      $(".modal__x", overlay)?.addEventListener("click", close);
      overlay.addEventListener("mousedown", e => { if (e.target === overlay) close(); });
    }
    overlay.addEventListener("keydown", e => { if (e.key === "Escape" && dismissible) close(); });
    this.stack.push(overlay);
    setTimeout(() => overlay.querySelector("[autofocus]")?.focus(), 50);
    return overlay;
  },
  close(overlay) { overlay?._close?.(); },
  /** Modal info sederhana dengan pesan multi-baris (dipakai untuk laporan hasil Import Menu). */
  alert({ title = "Info", message, okText = "OK" }) {
    return new Promise(resolve => {
      const overlay = this.open({
        title, dismissible: true, size: "sm",
        body: `<pre class="confirm-msg" style="white-space:pre-wrap;font-family:inherit;">${esc(message)}</pre>`,
        footer: `<button type="button" class="btn btn--primary" data-act="ok" autofocus>${esc(okText)}</button>`,
        onClose: () => resolve()
      });
      $('[data-act="ok"]', overlay).addEventListener("click", () => { resolve(); this.close(overlay); });
    });
  },
  confirm({ title = "Konfirmasi", message, okText = "OK", cancelText = "Batal", danger = false }) {
    return new Promise(resolve => {
      const overlay = this.open({
        title, dismissible: true, size: "sm",
        body: `<p class="confirm-msg">${esc(message)}</p>`,
        footer: `<button type="button" class="btn btn--ghost" data-act="cancel">${esc(cancelText)}</button>
                 <button type="button" class="btn ${danger ? "btn--danger" : "btn--primary"}" data-act="ok" autofocus>${esc(okText)}</button>`,
        onClose: () => resolve(false)
      });
      $('[data-act="ok"]', overlay).setAttribute("autofocus", "");
      $('[data-act="cancel"]', overlay).addEventListener("click", () => { resolve(false); this.close(overlay); });
      $('[data-act="ok"]', overlay).addEventListener("click", () => { resolve(true); overlay._close = () => { overlay.remove(); this.stack = this.stack.filter(x => x !== overlay); }; this.close(overlay); });
    });
  },
  /** Modal berisi form login PIN admin. Resolve username admin bila berhasil, null bila batal. */
  async promptAdminPin(adapter) {
    return new Promise(resolve => {
      const overlay = this.open({
        title: `${ico("🔐")} Verifikasi Admin`, size: "sm",
        body: `<p class="confirm-msg">Masukkan PIN admin untuk melanjutkan.</p>
               <input type="password" inputmode="numeric" maxlength="8" class="input input--lg" id="admin-pin-input" placeholder="PIN" autofocus>
               <p class="field-err" id="admin-pin-err" hidden></p>`,
        footer: `<button type="button" class="btn btn--ghost" data-act="cancel">Batal</button>
                 <button type="button" class="btn btn--primary" data-act="ok">Verifikasi</button>`,
        onClose: () => resolve(null)
      });
      const input = $("#admin-pin-input", overlay), err = $("#admin-pin-err", overlay);
      const submit = async () => {
        const pin = input.value.trim();
        const ok = await Auth.verifyAdminPin(adapter, pin);
        if (ok) { overlay._close = () => { overlay.remove(); this.stack = this.stack.filter(x => x !== overlay); }; this.close(overlay); resolve(ok); }
        else { err.textContent = "PIN salah."; err.hidden = false; input.value = ""; input.focus(); }
      };
      $('[data-act="cancel"]', overlay).addEventListener("click", () => { resolve(null); this.close(overlay); });
      $('[data-act="ok"]', overlay).addEventListener("click", submit);
      input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
    });
  },
  /** Modal PIN tetap (ACTION_PIN) untuk aksi penting non-admin-login: Telah Bayar / Refund / Arsip.
      Resolve true bila PIN benar, false bila dibatalkan. */
  promptActionPin(message = "Masukkan PIN untuk melanjutkan.") {
    return new Promise(resolve => {
      const overlay = this.open({
        title: `${ico("🔒")} Verifikasi PIN`, size: "sm",
        body: `<p class="confirm-msg">${esc(message)}</p>
               <input type="password" inputmode="numeric" maxlength="8" class="input input--lg" id="action-pin-input" placeholder="PIN" autofocus>
               <p class="field-err" id="action-pin-err" hidden></p>`,
        footer: `<button type="button" class="btn btn--ghost" data-act="cancel">Batal</button>
                 <button type="button" class="btn btn--primary" data-act="ok">Verifikasi</button>`,
        onClose: () => resolve(false)
      });
      const input = $("#action-pin-input", overlay), err = $("#action-pin-err", overlay);
      const submit = () => {
        const pin = input.value.trim();
        if (pin === ACTION_PIN) { overlay._close = () => { overlay.remove(); this.stack = this.stack.filter(x => x !== overlay); }; this.close(overlay); resolve(true); }
        else { err.textContent = "PIN salah."; err.hidden = false; input.value = ""; input.focus(); }
      };
      $('[data-act="cancel"]', overlay).addEventListener("click", () => { resolve(false); this.close(overlay); });
      $('[data-act="ok"]', overlay).addEventListener("click", submit);
      input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
    });
  }
};

/** Badge status pembayaran + tombol aksi. Bayar/Lunas cukup konfirmasi tanpa PIN dan
    membuka transaksi yang sama di kasir; Refund tetap wajib PIN. */
const OrderActions = {
  badgeHtml(order) {
    const st = PAYMENT_STATUSES[order.payment_status] || PAYMENT_STATUSES.belum_bayar;
    return `<span class="tag ${st.tagCls}">${ico(st.icon)} ${st.label}</span>`;
  },
  buttonsHtml(order) {
    const status = order.payment_status || "belum_bayar";
    const btns = [];
    if (status === "belum_bayar" && order.status !== "cancelled") btns.push(`<button type="button" class="btn btn--ghost" data-oa="edit">${ico("✏️")} Ubah Menu Pesanan</button>`);
    if (status === "belum_bayar") btns.push(`<button type="button" class="btn btn--primary" data-oa="paid">${ico("💳")} Bayar / Lunas</button>`);
    if (status !== "refund" && status !== "arsip") btns.push(`<button type="button" class="btn btn--danger" data-oa="refund">${ico("↩️")} Refund</button>`);
    return btns.length ? `<div class="receipt-actions order-actions">${btns.join("")}</div>` : "";
  },
  /** Bind tombol aksi di dalam container. items diperlukan khusus untuk aksi "edit" (Ubah Menu
      Pesanan) supaya keranjang kasir bisa dibuka ulang berisi item pesanan ini. onChange(order)
      dipanggil setelah Supabase berhasil diperbarui, supaya halaman pemanggil bisa refresh
      tampilannya dari data terbaru. */
  bind(container, order, items, onChange) {
    $$('[data-oa]', container).forEach(b => b.addEventListener("click", async () => {
      // Cegah klik ganda / klik tombol lain selama satu aksi masih diproses (isu responsivitas tombol).
      if (container.dataset.oaBusy === "1") return;
      const action = b.dataset.oa;
      if (action === "edit") {
        if (order.status === "cancelled" || (order.payment_status || "belum_bayar") !== "belum_bayar") {
          Toast.error("Transaksi ini tidak lagi berstatus Belum Bayar.");
          return;
        }
        if (State.d && State.d.cart.length && State.d.editingOrderId !== order.id) {
          const ok = await Modal.confirm({
            title: "Ubah Menu Pesanan",
            message: "Ada pesanan yang sedang disusun di kasir. Membuka pesanan ini akan menggantikannya. Lanjutkan?",
            okText: "Lanjutkan"
          });
          if (!ok) return;
        }
        KasirPage.startEditOrder(order, items || []);
        const overlay = container.closest(".overlay");
        if (overlay) Modal.close(overlay);
        App.navigate("kasir");
        return;
      }
      const msgs = {
        paid: "Lanjutkan pembayaran transaksi ini?",
        refund: `Proses refund untuk transaksi ${order.order_number}? Transaksi tidak akan dihapus, hanya statusnya berubah.`,
        archive: `Arsipkan transaksi ${order.order_number}?`
      };
      const ok = await Modal.confirm({ title: "Konfirmasi", message: msgs[action], okText: "Lanjutkan", danger: action === "refund" });
      if (!ok) return;

      // Tandai sedang sibuk + beri umpan balik visual (spinner) langsung setelah dikonfirmasi,
      // dan nonaktifkan seluruh tombol aksi di container ini supaya tidak bisa dobel-tap.
      container.dataset.oaBusy = "1";
      const allBtns = $$('[data-oa]', container);
      allBtns.forEach(x => { x.disabled = true; });
