/* ---------- Pesanan: daftar transaksi hari berjalan, ringkas & cepat ---------- */
const PesananPage = {
  async mount(root) {
    root.innerHTML = `<div class="page-loading">Memuat pesanan…</div>`;
    const settings = await App.adapter.getSettings();
    const { from, to } = dayRange(todayStr());
    const orders = await App.adapter.listOrders({ from, to });
    this.orders = orders;
    this.selectedCategory = this.selectedCategory || "semua";
    const render = () => {
      const category = this.selectedCategory || "semua";
      const filtered = category === "semua" ? this.orders : this.orders.filter(o => this.matchesCategory(o, category));
      const counts = {
        semua: this.orders.length,
        belum_bayar: this.orders.filter(o => o.status !== "cancelled" && (o.payment_status || "belum_bayar") === "belum_bayar").length,
        telah_bayar: this.orders.filter(o => o.status !== "cancelled" && (o.payment_status || "belum_bayar") === "telah_bayar").length,
        refund: this.orders.filter(o => o.status !== "cancelled" && (o.payment_status || "belum_bayar") === "refund").length,
        arsip: this.orders.filter(o => this.matchesCategory(o, "arsip")).length
      };
      root.innerHTML = `
        <div class="page">
          <div class="page__head">
            <h1>${ico("📋", "page-ico")}Pesanan Hari Ini</h1>
            <span class="page__sub">${filtered.length} transaksi</span>
          </div>
          <div class="order-status-tabs" role="tablist" aria-label="Kategori pesanan">
            <button type="button" class="chip ${category === "semua" ? "is-active" : ""}" data-order-category="semua">Semua <span>${counts.semua}</span></button>
            <button type="button" class="chip ${category === "belum_bayar" ? "is-active" : ""}" data-order-category="belum_bayar">⏳ Belum Bayar <span>${counts.belum_bayar}</span></button>
            <button type="button" class="chip ${category === "telah_bayar" ? "is-active" : ""}" data-order-category="telah_bayar">${ico("✅")} Sudah Bayar <span>${counts.telah_bayar}</span></button>
            <button type="button" class="chip ${category === "refund" ? "is-active" : ""}" data-order-category="refund">${ico("↩️")} Di Refund <span>${counts.refund}</span></button>
            <button type="button" class="chip ${category === "arsip" ? "is-active" : ""}" data-order-category="arsip">${ico("🗄️")} Arsip <span>${counts.arsip}</span></button>
          </div>
          ${!filtered.length ? `<div class="empty-state">Tidak ada pesanan dalam kategori ini.</div>` : `
          <div class="order-list">
            ${filtered.map(o => this.rowHtml(o)).join("")}
          </div>`}
        </div>`;
      root.querySelectorAll("[data-order-category]").forEach(btn => btn.addEventListener("click", () => {
        this.selectedCategory = btn.dataset.orderCategory;
        render();
      }));
    };
    render();
    root.addEventListener("click", async e => {
      const btn = e.target.closest("[data-view-order]");
      if (!btn) return;
      const cached = this.orders.find(o => o.id === btn.dataset.viewOrder);
      if (!cached) return;
      const [order, items] = await Promise.all([App.adapter.getOrder(cached.id), App.adapter.getOrderItems(cached.id)]);
      ReceiptModal.open(order || cached, items, settings, () => this.mount(root));
    });
  },
  matchesCategory(o, category) {
    const status = o.payment_status || "belum_bayar";
    if (category === "arsip") return o.status === "cancelled" || status === "arsip";
    if (o.status === "cancelled") return false;
    return status === category;
  },
  rowHtml(o) {
    const info = orderTypeInfo(o.order_type);
    const pm = PAYMENT_METHODS[o.payment_method] || PAYMENT_METHODS.tunai;
    const isArchived = o.status === "cancelled" || o.payment_status === "arsip";
    const st = isArchived ? PAYMENT_STATUSES.arsip : (PAYMENT_STATUSES[o.payment_status] || PAYMENT_STATUSES.belum_bayar);
    return `<button type="button" class="order-row ${o.status === "cancelled" ? "order-row--cancelled" : ""}" data-view-order="${o.id}">
      <div class="order-row__main">
        <span class="order-row__type">${ico(info.icon)} ${info.label}${o.table_no ? ` · Meja ${esc(o.table_no)}` : ""}</span>
        <span class="order-row__num">${esc(o.order_number)} · ${esc(o.customer_name || "-")} · ${ico(pm.icon)} ${pm.label}</span>
      </div>
      <div class="order-row__side">
        <span class="order-row__total">${rp(o.total)}</span>
        <span class="order-row__time">${fmtTime(o.created_at)}</span>
      </div>
      <span class="tag ${st.tagCls}">${ico(st.icon)} ${st.label}</span>
      ${o.status === "cancelled" ? `<span class="tag tag--danger">Dibatalkan</span>` : ""}
    </button>`;
  }
};

/* ---------- Daftar Menu: navigasi kategori; klik kategori menampilkan semua menu di dalamnya ---------- */
const DaftarMenuPage = {
  activeId: null,
  async mount(root) {
    root.innerHTML = `<div class="page-loading">Memuat menu…</div>`;

        <div class="cat-bar" role="tablist" aria-label="Kategori menu">
          ${activeCats.map(c => `<button type="button" role="tab" class="cat-chip" data-cat="${esc(String(c.id))}">${categoryIco(c, "cat-ico")} ${esc(c.name)}</button>`).join("")}

/* ---------- Transaksi: riwayat lengkap dengan pencarian & filter ---------- */
const TransaksiPage = {
  async mount(root) {
    this.root = root;
    this.settings = await App.adapter.getSettings();
    this.filters = { from: todayStr(), to: todayStr(), orderType: "", paymentStatus: "", query: "" };
    await this.reload();
    // Delegasi klik dibind sekali per mount agar tidak menumpuk saat reload()/render() dipanggil ulang.
    this.root.addEventListener("click", async e => {
      const btn = e.target.closest("[data-view-order]");
      if (!btn) return;
      const cached = this.orders.find(o => o.id === btn.dataset.viewOrder);
      // Ambil ulang dari Supabase supaya status pembayaran yang tampil selalu yang terbaru.
      const [order, items] = await Promise.all([App.adapter.getOrder(cached.id), App.adapter.getOrderItems(cached.id)]);
      this.openDetail(order || cached, items);
    });
  },
  async reload() {
    const { from, to } = dayRange(this.filters.from, this.filters.to);
    this.orders = await App.adapter.listOrders({
      from, to, orderType: this.filters.orderType || undefined,
      paymentStatus: this.filters.paymentStatus || undefined, query: this.filters.query || undefined
    });
    this.render();
  },
  render() {
    const f = this.filters;
    const totalSum = this.orders.filter(o => o.status !== "cancelled").reduce((a, o) => a + o.total, 0);
    this.root.innerHTML = `
      <div class="page">
        <div class="page__head"><h1>${ico("💰", "page-ico")}Riwayat Transaksi</h1></div>
        <div class="filter-bar">
          <input type="date" class="input" id="f-from" value="${f.from}">
          <span class="filter-bar__sep">–</span>
          <input type="date" class="input" id="f-to" value="${f.to}">
          <select class="input" id="f-type">
            <option value="">Semua Tipe</option>
            ${Object.entries(ORDER_TYPES).map(([k, v]) => `<option value="${k}" ${f.orderType === k ? "selected" : ""}>${v.label}</option>`).join("")}
          </select>
          <select class="input" id="f-status">
            <option value="">Semua Status</option>
            ${Object.entries(PAYMENT_STATUSES).map(([k, v]) => `<option value="${k}" ${f.paymentStatus === k ? "selected" : ""}>${v.label}</option>`).join("")}
          </select>
          <input type="search" class="input" id="f-query" placeholder="Cari no. transaksi / menu…" value="${esc(f.query)}">
        </div>
        <div class="txn-summary">${this.orders.length} transaksi · Total ${rp(totalSum)}</div>
        ${!this.orders.length ? `<div class="empty-state">Tidak ada transaksi pada rentang / filter ini.</div>` : `
        <div class="order-list">${this.orders.map(o => PesananPage.rowHtml(o)).join("")}</div>`}
      </div>`;
    this.bind();
  },
  bind() {
    const root = this.root;
    let t;
    const debounced = () => { clearTimeout(t); t = setTimeout(() => this.applyFilters(), 350); };
    $("#f-from", root).addEventListener("change", e => { this.filters.from = e.target.value; this.applyFilters(); });
    $("#f-to", root).addEventListener("change", e => { this.filters.to = e.target.value; this.applyFilters(); });
    $("#f-type", root).addEventListener("change", e => { this.filters.orderType = e.target.value; this.applyFilters(); });
    $("#f-status", root).addEventListener("change", e => { this.filters.paymentStatus = e.target.value; this.applyFilters(); });
    $("#f-query", root).addEventListener("input", e => { this.filters.query = e.target.value; debounced(); });
  },
  applyFilters() { this.reload(); },
  openDetail(order, items) {
    const info = orderTypeInfo(order.order_type);
    const body = document.createElement("div");
    const renderBody = () => {
      body.innerHTML = `<div class="order-actions-head">${OrderActions.badgeHtml(order)}</div>` + Receipt.htmlFor(order, items, this.settings) + OrderActions.buttonsHtml(order);
      OrderActions.bind(body, order, items, (updated, action) => {
        renderBody();
        if (action === "paid") Toast.success(`Transaksi ${updated.order_number} Sudah Bayar.`);
        // Sinkronkan baris di daftar latar belakang tanpa menutup modal, lalu ambil ulang dari
        // Supabase saat modal ditutup supaya daftar & ringkasan total selalu benar (butir 9).
        const idx = this.orders.findIndex(o => o.id === updated.id);
        if (idx >= 0) this.orders[idx] = { ...this.orders[idx], ...updated };
      });
    };
    renderBody();
    const canCancel = order.status !== "cancelled" && Auth.isAdmin();
    const overlay = Modal.open({
      title: `${ico(info.icon)} ${order.order_number}`, body, size: "sm",
      onClose: () => this.reload(),
      footer: ``
    });
    /* Tombol cetak/PDF/spill/Transaksi Baru/arsip tidak lagi ditampilkan pada popup ini. */
    $("#d-cancel", overlay)?.addEventListener("click", async () => {
      const ok = await Modal.confirm({ title: "Batalkan Transaksi", message: `Batalkan transaksi ${order.order_number}? Tindakan ini memerlukan verifikasi admin.`, danger: true, okText: "Batalkan" });
      if (!ok) return;
      const admin = await Modal.promptAdminPin(App.adapter);
      if (!admin) return;
      try {
        await App.adapter.cancelOrder(order.id, `Dibatalkan oleh ${admin.name || admin.username}`);
        Toast.success("Transaksi dibatalkan.");
        Modal.close(overlay);
        this.reload();
      } catch (err) { Toast.error(friendlyError(err)); }
    });
  }
};

/* ---------- Laporan / Dashboard ---------- */
const LaporanPage = {
  async mount(root) {
    root.innerHTML = `<div class="page-loading">Menyusun laporan…</div>`;
    const { from, to } = dayRange(todayStr());
    const [allOrders, expenses] = await Promise.all([
      App.adapter.listOrders({ from, to, limit: 2000 }),
      App.adapter.listExpenses({ from, to })
    ]);
    const orders = allOrders.filter(o => o.status !== "cancelled");
    const allItems = orders.length ? await App.adapter.getOrderItemsBulk(orders.map(o => o.id)) : [];

    const totalSales = orders.reduce((a, o) => a + o.total, 0);
    // Dihitung per item (bukan per transaksi) karena satu transaksi bisa berisi Take Away + Dine In sekaligus.
    const dineIn = allItems.filter(it => it.order_type === "dine_in").reduce((a, it) => a + it.quantity, 0);
    const takeAway = allItems.filter(it => it.order_type !== "dine_in").reduce((a, it) => a + it.quantity, 0);
    const productSold = allItems.reduce((a, it) => a + it.quantity, 0);
    const cashOrders = orders.filter(o => (o.payment_method || "tunai") === "tunai");
    const qrisOrders = orders.filter(o => o.payment_method === "qris");
    const expensesTotal = expenses.reduce((a, e) => a + e.amount, 0);
    const netAfterExpenses = totalSales - expensesTotal;

    const byName = {};
    for (const it of allItems) byName[it.product_name] = (byName[it.product_name] || 0) + it.quantity;
    const top = Object.entries(byName).sort((a, b) => b[1] - a[1]).slice(0, 5);
    const lastOrder = orders[0];

    const cards = [
      ["🧾", "Total Transaksi", orders.length],
      ["💵", "Total Penjualan", rp(totalSales)],
      ["🏠", "Dine In", dineIn],
      ["🛍️", "Take Away", takeAway],
      ["📦", "Produk Terjual", productSold]
    ];

    root.innerHTML = `
      <div class="page">
        <div class="page__head"><h1>${ico("📊", "page-ico")}Laporan Hari Ini</h1><span class="page__sub">${fmtDate(new Date().toISOString())}</span></div>
        <div class="stat-grid">
          ${cards.map(([icon, label, val]) => `
            <div class="stat-card"><span class="stat-card__icon">${ico(icon)}</span>
              <span class="stat-card__label">${label}</span>
              <span class="stat-card__value">${val}</span></div>`).join("")}
        </div>
        <div class="report-cols">
          <section class="report-block">
            <h2>Rincian Pembayaran</h2>
            <div class="summary-row"><span>${ico("💵")} Tunai (${cashOrders.length} transaksi)</span><span>${rp(cashOrders.reduce((a, o) => a + o.total, 0))}</span></div>
            <div class="summary-row"><span>${ico("🔳")} QRIS (${qrisOrders.length} transaksi)</span><span>${rp(qrisOrders.reduce((a, o) => a + o.total, 0))}</span></div>
            <div class="summary-row"><span>Pengeluaran (${expenses.length})</span><span>-${rp(expensesTotal)}</span></div>
            <div class="summary-row summary-row--total"><span>Selisih Bersih</span><span>${rp(netAfterExpenses)}</span></div>
          </section>
          <section class="report-block">
            <h2>Menu Paling Banyak Terjual</h2>
            ${top.length ? `<ol class="rank-list">${top.map(([n, q]) => `<li><span>${esc(n)}</span><span>${q}</span></li>`).join("")}</ol>` : `<p class="menu-section__note">Belum ada data.</p>`}
          </section>
          <section class="report-block">
            <h2>Transaksi Terakhir</h2>
            ${lastOrder ? `<div class="order-list">${PesananPage.rowHtml(lastOrder)}</div>` : `<p class="menu-section__note">Belum ada transaksi.</p>`}
          </section>
        </div>
      </div>`;
    root.addEventListener("click", async e => {
      const btn = e.target.closest("[data-view-order]");
      if (!btn) return;
      const cached = orders.find(o => o.id === btn.dataset.viewOrder);
      const [order, items, settings] = await Promise.all([
        App.adapter.getOrder(cached.id), App.adapter.getOrderItems(cached.id), App.adapter.getSettings()
      ]);
      ReceiptModal.open(order || cached, items, settings);
    });
  }
};

];

        payment: 25000, change: 0, status: "completed"

  /** Transaksi LUNAS pada rentang [from, to): dibuat pada rentang itu ATAU dilunasi pada rentang itu.
      Belum Bayar / Refund / Arsip / Batal tidak dihitung. Bila kolom payment_status belum ada di
      database, semua transaksi non-batal dianggap lunas (perilaku lama). */
  async collectPaidOrders(from, to) {
    const fromMs = new Date(from).getTime(), toMs = to ? new Date(to).getTime() : Infinity;
    const [created, paidLater] = await Promise.all([
      App.adapter.listOrders({ from, to, limit: 2000 }),
      App.adapter.listOrdersPaidSince(from)
    ]);
    const byId = new Map();
    [...created, ...paidLater].forEach(o => byId.set(o.id, o));
    const all = [...byId.values()];
    const hasStatusCol = all.some(o => "payment_status" in o);
    const eff = o => new Date(o.paid_at || o.created_at).getTime();
    const paid = all.filter(o => o.status !== "cancelled" && (!hasStatusCol || o.payment_status === "telah_bayar")
      && eff(o) >= fromMs && eff(o) < toMs);
    const unpaidCount = all.filter(o => o.status !== "cancelled" && hasStatusCol && (o.payment_status || "belum_bayar") === "belum_bayar").length;
    return { paid, unpaidCount };
  },

  /** Rincian terjual per kategori: [{ name, total, items: [{ name, qty, total }] }], urut sesuai urutan kategori menu. */
  async buildSold(paidOrders) {
    if (!paidOrders.length) return [];
    const ids = paidOrders.map(o => o.id);
    const items = [];
    for (let k = 0; k < ids.length; k += 80) items.push(...await App.adapter.getOrderItemsBulk(ids.slice(k, k + 80)));
    const [cats, prods] = await Promise.all([App.adapter.listCategories(), App.adapter.listProducts()]);
    const catOfProd = new Map(prods.map(p => [p.id, p.category_id]));
    const catById = new Map(cats.map(c => [c.id, c]));
    const groups = new Map();
    for (const it of items) {
      const cat = catById.get(catOfProd.get(it.product_id));
      const key = cat ? cat.id : "_lain";
      if (!groups.has(key)) groups.set(key, { name: cat ? cat.name : "Lainnya", sort: cat ? (cat.sort_order ?? 0) : 9999, total: 0, map: new Map() });
      const g = groups.get(key);
      const amt = Number(it.subtotal ?? (it.quantity * it.base_price)) || 0;
      const row = g.map.get(it.product_name) || { name: it.product_name, qty: 0, total: 0 };
      row.qty += Number(it.quantity) || 0; row.total += amt; g.total += amt;
      g.map.set(it.product_name, row);
    }
    return [...groups.values()].sort((a, b) => a.sort - b.sort).map(g => ({
      name: g.name, total: g.total,
      items: [...g.map.values()].sort((a, b) => b.qty - a.qty || a.name.localeCompare(b.name))
    }));
  },

  async soldForClosing(c) {
    if (!c.period_from) return [];
    const { paid } = await this.collectPaidOrders(new Date(c.period_from).toISOString(), new Date(c.created_at).toISOString());
    return this.buildSold(paid);
  },

  async loadTutupData() {
    const [lastClosing, closings] = await Promise.all([
      App.adapter.getLastClosing(),
      App.adapter.listCashClosings({ limit: 10 })
    ]);
    // Selalu dinormalkan ke format ISO "Z" (created_at Supabase memuat "+00:00" yang merusak query URL).
    const from = new Date(lastClosing ? lastClosing.created_at : dayRange(todayStr()).from).toISOString();
    const [{ paid, unpaidCount }, expenses] = await Promise.all([
      this.collectPaidOrders(from),
      App.adapter.listExpenses({ from })
    ]);
    const sold = await this.buildSold(paid);
    const sum = (arr, f) => arr.reduce((a, o) => a + (Number(f(o)) || 0), 0);
    this._tk = {
      lastClosing, closings, from, sold, unpaidCount,
      subtotalAll: sum(paid, o => o.subtotal ?? o.total),
      cashSales: sum(paid.filter(o => (o.payment_method || "tunai") === "tunai"), o => o.total),
      qrisSales: sum(paid.filter(o => o.payment_method === "qris"), o => o.total),
      expenses, expensesTotal: sum(expenses, e => e.amount)
    };
  },

          </div>`).join("")}
      </section>` : ""}`;

    $$('input[inputmode="numeric"]', wrap).forEach(inp => inp.addEventListener("input", () => { inp.value = digitsOnly(inp.value); }));

    $("#tk-modal", wrap).addEventListener("input", e => {
      this.openingFloatDraft = digitsOnly(e.target.value);
      e.target.value = fmtDigits(this.openingFloatDraft);
      $("#tk-cash-drawer", wrap).textContent = rp((toInt(this.openingFloatDraft) || 0) + tk.cashSales + tk.qrisSales - tk.expensesTotal);
    });

    $("#tk-exp-add", wrap).addEventListener("click", async () => {
      const amount = toInt($("#tk-exp-amount", wrap).value);
      const category = $("#tk-exp-category", wrap).value;
      const note = $("#tk-exp-note", wrap).value.trim();
      if (!amount || amount <= 0) { Toast.error("Masukkan nominal pengeluaran yang valid."); return; }
      try {
        await App.adapter.addExpense({ amount, category, note, cashier: Auth.name() });
        await this.loadTutupData();
        this.renderTutupBody();
        Toast.success("Pengeluaran ditambahkan.");
      } catch (e) { Toast.error(friendlyError(e)); }
    });

    $$("[data-del-expense]", wrap).forEach(b => b.addEventListener("click", async () => {
      const ok = await Modal.confirm({ title: "Hapus Pengeluaran", message: "Hapus catatan pengeluaran ini?", danger: true, okText: "Hapus" });
      if (!ok) return;
      try { await App.adapter.deleteExpense(b.dataset.delExpense); await this.loadTutupData(); this.renderTutupBody(); Toast.success("Pengeluaran dihapus."); }
      catch (err) { Toast.error(friendlyError(err)); }
    }));

    $$("[data-print-closing]", wrap).forEach(b => b.addEventListener("click", () => {
      const c = tk.closings.find(x => x.id === b.dataset.printClosing);
      if (c) this.printClosingReport(c);
    }));

    // Ringkasan sementara: data sama seperti layar, hanya dicetak — TIDAK menyimpan / menutup kasir.
    $("#tk-print", wrap).addEventListener("click", () => {
      this.printClosingReport({
        created_at: new Date().toISOString(), cashier: Auth.name(), opening_float: openingFloat,
        subtotal_total: tk.subtotalAll, cash_sales: tk.cashSales, qris_sales: tk.qrisSales,
        expenses_total: tk.expensesTotal, cash_in_drawer: cashInDrawer, sold: tk.sold
      });
    });

    $("#tk-close", wrap).addEventListener("click", async e => {
      const btn = e.currentTarget;
      const ok = await Modal.confirm({ title: "Tutup Permanent", message: "Apakah Anda yakin ingin menutup kasir secara permanent?", okText: "Lanjutkan", danger: true });
      if (!ok) return; // dibatalkan: tidak ada data yang berubah
      await withLoading(btn, async () => {
        try {
          // Pengaman: pastikan periode belum ditutup dari perangkat lain sejak halaman ini dimuat.
          const latest = await App.adapter.getLastClosing();
          if ((latest?.id || null) !== (tk.lastClosing?.id || null)) {
            Toast.error("Kasir sudah ditutup dari perangkat lain. Data dimuat ulang.");
            await this.loadTutupData(); this.renderTutupBody(); return;
          }
          const nowIso = new Date().toISOString();
          const user = Auth.name();
          const res = await App.adapter.saveCashClosing({
            period_from: tk.from, period_to: nowIso, opening_float: openingFloat,
            subtotal_total: tk.subtotalAll, cash_sales: tk.cashSales, qris_sales: tk.qrisSales,
            expenses_total: tk.expensesTotal, net_cash_sales: netCash,
            grand_total: tk.subtotalAll, cash_in_drawer: cashInDrawer,
            cashier: user, closed_by: user, closed_at: nowIso, status: "CLOSED"
          });
          Toast.success("Kasir berhasil ditutup.");
          if (!res.extraColumns) Toast.info?.("Jalankan SQL migrasi Tutup Kasir agar status CLOSED & periode akhir ikut tersimpan.");
          this.openingFloatDraft = "";
          await this.loadTutupData();
          this.renderTutupBody();
        } catch (err) { Toast.error(friendlyError(err)); }
      });
    });
  },

  /** Baris resi: [{ text, bold }]. Dipakai untuk cetak Bluetooth (tebal via ESC/POS) & dialog cetak browser. */
  closingReportLines(c) {
    const width = Device.width;
    const line = ch => ({ text: ch.repeat(width) });
    const center = (s, bold) => { s = String(s).slice(0, width); const pad = Math.max(0, Math.floor((width - s.length) / 2)); return { text: " ".repeat(pad) + s, bold }; };
    const rowLR = (l, r, bold) => { r = String(r); l = String(l).slice(0, Math.max(1, width - r.length - 1)); return { text: l + " ".repeat(Math.max(1, width - l.length - r.length)) + r, bold }; };
    const out = [];
    out.push(center("BASO GEMBIRA", true));
    out.push(center("TUTUP KASIR", true));
    out.push(line("="));
    out.push(rowLR("Tanggal", fmtDate(c.created_at)));
    out.push(rowLR("Jam", fmtTime(c.created_at)));
    out.push(rowLR("Kasir", c.cashier || "-"));
    out.push(line("-"));
    out.push(rowLR("Subtotal Seluruhnya", rp(c.subtotal_total ?? c.grand_total)));
    out.push(rowLR("Modal Awal", rp(c.opening_float)));
    out.push(rowLR("Cash", rp(c.cash_sales)));
    out.push(rowLR("QRIS", rp(c.qris_sales)));
    out.push(rowLR("Pengeluaran", rp(c.expenses_total)));
    out.push(line("-"));
    out.push(rowLR("Sisa Cash", rp(c.cash_in_drawer), true));
    out.push(line("="));
    if (c.sold && c.sold.length) {
      out.push(center("RINCIAN PENJUALAN", true));
      for (const g of c.sold) {
        out.push(line("-"));
        out.push({ text: String(g.name).toUpperCase(), bold: true });
        g.items.forEach(i => out.push(rowLR(i.name, i.qty + "x")));
        out.push(rowLR("Total seluruhnya", rp(g.total)));
      }
      out.push(line("="));
    }
    return out;
  },
  closingReportText(c) { return this.closingReportLines(c).map(l => l.text).join("\n"); },
  async printClosingReport(c) {
    if (c.sold === undefined) {
      try { c = { ...c, sold: await this.soldForClosing(c) }; } catch (e) { console.warn("Gagal memuat rincian penjualan riwayat.", e); c = { ...c, sold: [] }; }
    }
    const lines = this.closingReportLines(c);
    if (Device.get("use_bt_printer") && BtPrinter.isConnected()) {
      try { await BtPrinter.printSegments(lines); Toast.success("Rekap dikirim ke printer Bluetooth."); return; }
      catch (e) { Toast.error("Gagal cetak Bluetooth: " + friendlyError(e)); return; }
    }
    const w = window.open("", "_blank", "width=420,height=640");
    if (!w) { Toast.error("Popup diblokir. Izinkan popup untuk mencetak."); return; }
    w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Rekap Tutup Kasir</title>
      <style>body{font-family:'Courier New',monospace;font-size:12px;white-space:pre;padding:8px;width:${Device.width === 42 ? "80mm" : "58mm"};}</style>
      </head><body>${lines.map(l => l.bold ? `<b>${esc(l.text)}</b>` : esc(l.text)).join("<br>")}
      <script>window.onload=()=>{window.print(); setTimeout(()=>window.close(), 300);}<\/script>
      </body></html>`);
    w.document.close();
  }
};


"use strict";
/* ==========================================================================
   8. HALAMAN ADMIN — kelola kategori, menu, dan pengguna
   ========================================================================== */

const AdminPage = {
  tab: "menu",
  async mount(root, subTab) {
    this.root = root;
    if (subTab) this.tab = subTab;
    if (!Auth.isAdmin()) {
      const admin = await Modal.promptAdminPin(App.adapter);
      if (!admin) { App.navigate("kasir"); return; }
      Toast.success(`Masuk sebagai ${admin.name || admin.username}.`);
    }
    await this.reload();
  },
  async reload() {
    [this.categories, this.products, this.users] = await Promise.all([
      App.adapter.listCategories(), App.adapter.listProducts(), App.adapter.listUsers()
    ]);
    this.categories.sort((a, b) => a.sort_order - b.sort_order);
    this.render();
  },
  render() {
    this.root.innerHTML = `
      <div class="page">
        <div class="page__head"><h1>${ico("🔐", "page-ico")}Panel Admin</h1></div>
        <div class="tab-bar">
          <button type="button" class="tab-btn ${this.tab === "menu" ? "is-active" : ""}" data-tab="menu">Menu &amp; Kategori</button>
          <button type="button" class="tab-btn ${this.tab === "users" ? "is-active" : ""}" data-tab="users">Pengguna</button>
        </div>
        <div id="admin-content"></div>
      </div>`;
    $$("[data-tab]", this.root).forEach(b => b.addEventListener("click", () => { this.tab = b.dataset.tab; this.render(); }));
    if (this.tab === "menu") this.renderMenuTab(); else this.renderUsersTab();
  },

  /* ---------- Tab Menu & Kategori ---------- */
  renderMenuTab() {
    const wrap = $("#admin-content", this.root);
    wrap.innerHTML = `
      <div class="admin-toolbar">
        <button type="button" class="btn btn--primary" id="add-cat-btn">+ Kategori</button>
        <button type="button" class="btn btn--ghost" id="reseed-btn">${ico("⬆️")} Import Menu dari Data</button>
      </div>
      <div class="admin-cats">
        ${this.categories.map(c => this.catBlock(c)).join("")}
      </div>`;
    $("#add-cat-btn", wrap).addEventListener("click", () => this.openCategoryForm());
    $("#reseed-btn", wrap).addEventListener("click", async e => {
      await withLoading(e.currentTarget, async () => {
        try {
          const report = await seedMenu(App.adapter);
          await this.reload();
          await Modal.alert({ title: "Import Menu Selesai", message: formatSeedReport(report) });
        } catch (err) { Toast.error(friendlyError(err)); }
      });
    });
    wrap.addEventListener("click", e => {
      const editCat = e.target.closest("[data-edit-cat]"); if (editCat) return this.openCategoryForm(this.categories.find(c => c.id === editCat.dataset.editCat));
      const delCat = e.target.closest("[data-del-cat]"); if (delCat) return this.deleteCategory(delCat.dataset.delCat);
      const addProd = e.target.closest("[data-add-prod]"); if (addProd) return this.openProductForm(null, addProd.dataset.addProd);
      const editProd = e.target.closest("[data-edit-prod]"); if (editProd) return this.openProductForm(this.products.find(p => p.id === editProd.dataset.editProd));
      const delProd = e.target.closest("[data-del-prod]"); if (delProd) return this.deleteProduct(delProd.dataset.delProd);
      const toggleProd = e.target.closest("[data-toggle-prod]"); if (toggleProd) return this.toggleProductActive(toggleProd.dataset.toggleProd);
    });
  },

  catBlock(c) {
    const items = this.products.filter(p => p.category_id === c.id).sort((a, b) => a.sort_order - b.sort_order);
    return `<section class="admin-cat">
      <header class="admin-cat__head">
        <span class="admin-cat__title">${categoryIco(c, "cat-ico")} ${esc(c.name)} ${c.active === false ? `<span class="tag tag--muted">Nonaktif</span>` : ""} ${c.custom_mode !== "none" ? `<span class="tag tag--soft">${esc(CUSTOM_MODES[c.custom_mode])}</span>` : ""}</span>
        <div class="admin-cat__actions">
          ${c.custom_mode === "none" ? `<button type="button" class="btn btn--sm btn--ghost" data-add-prod="${c.id}">+ Menu</button>` : ""}
          <button type="button" class="btn btn--sm btn--ghost" data-edit-cat="${c.id}">Edit</button>
          <button type="button" class="btn btn--sm btn--ghost btn--danger-text" data-del-cat="${c.id}">Hapus</button>
        </div>
      </header>
      ${c.custom_mode !== "none" ? `<p class="menu-section__note">Kategori custom: kasir memasukkan nama${c.custom_mode === "name_price_qty" ? ", harga, dan jumlah" : " dan harga"} sendiri.</p>` :
        !items.length ? `<p class="menu-section__note">Belum ada menu.</p>` : `
        <div class="admin-prod-list">
          ${items.map(p => `<div class="admin-prod-row ${p.active === false ? "is-inactive" : ""}">
            <div class="admin-prod-row__info">
              <span class="admin-prod-row__name">${esc(p.name)}</span>
              <span class="admin-prod-row__price">${rp(p.price)}</span>
              <span class="admin-prod-row__flags">
                ${p.requires_condiment ? `<span class="tag tag--soft">Kondimen</span>` : ""}
                ${p.allow_ice_option ? `<span class="tag tag--soft">Es/Hangat</span>` : ""}
                ${p.allow_taste_option ? `<span class="tag tag--soft">Asin/Manis</span>` : ""}
              </span>
            </div>
            <div class="admin-prod-row__actions">
              <button type="button" class="btn btn--sm btn--ghost" data-toggle-prod="${p.id}">${p.active === false ? "Aktifkan" : "Nonaktifkan"}</button>
              <button type="button" class="btn btn--sm btn--ghost" data-edit-prod="${p.id}">Edit</button>
              <button type="button" class="btn btn--sm btn--ghost btn--danger-text" data-del-prod="${p.id}">Hapus</button>
            </div>
          </div>`).join("")}
        </div>`}
    </section>`;
  },

  openCategoryForm(cat) {
    const isNew = !cat;
    const state = cat ? { ...cat } : { name: "", icon: "🍽️", custom_mode: "none", active: true };
    const body = document.createElement("div");
    body.innerHTML = `
      <label class="field"><span>Ikon (emoji)</span><input type="text" class="input" id="c-icon" maxlength="4" value="${esc(state.icon || "")}"></label>
      <label class="field"><span>Nama Kategori</span><input type="text" class="input" id="c-name" maxlength="60" value="${esc(state.name)}"></label>
      <label class="field"><span>Tipe Kategori</span>
        <select class="input" id="c-mode">
          ${Object.entries(CUSTOM_MODES).map(([k, v]) => `<option value="${k}" ${state.custom_mode === k ? "selected" : ""}>${esc(v)}</option>`).join("")}
        </select>
      </label>
      <label class="toggle-row"><span>Aktif</span><input type="checkbox" id="c-active" ${state.active !== false ? "checked" : ""}></label>`;
    const overlay = Modal.open({
      title: isNew ? "Tambah Kategori" : "Edit Kategori", body, size: "sm",
      footer: `<button type="button" class="btn btn--ghost" data-act="cancel">Batal</button><button type="button" class="btn btn--primary" id="c-save">Simpan</button>`
    });
    $('[data-act="cancel"]', overlay).addEventListener("click", () => Modal.close(overlay));
    $("#c-save", overlay).addEventListener("click", async () => {
      const name = $("#c-name", overlay).value.trim();
      if (!name) { Toast.error("Nama kategori wajib diisi."); return; }
      await withLoading($("#c-save", overlay), async () => {
        try {
          await App.adapter.saveCategory({
            id: cat?.id, name, icon: $("#c-icon", overlay).value.trim() || "🍽️",
            custom_mode: $("#c-mode", overlay).value, active: $("#c-active", overlay).checked,
            sort_order: cat?.sort_order ?? (this.categories.length + 1)
          });
          Toast.success("Kategori disimpan.");
          Modal.close(overlay); await this.reload();
        } catch (e) { Toast.error(friendlyError(e)); }
      });
    });
  },

  async deleteCategory(id) {
    const ok = await Modal.confirm({ title: "Hapus Kategori", message: "Kategori ini akan dihapus permanen. Lanjutkan?", danger: true, okText: "Hapus" });
    if (!ok) return;
    try { await App.adapter.deleteCategory(id); Toast.success("Kategori dihapus."); await this.reload(); }
    catch (e) { Toast.error(friendlyError(e)); }
  },

  openProductForm(product, presetCategoryId) {
    const isNew = !product;
    const state = product ? { ...product } : {
      category_id: presetCategoryId || this.categories[0]?.id, name: "", description: "", price: "",
      requires_condiment: false, condiment_options: null, allow_ice_option: false, allow_taste_option: false, active: true
    };
    const catOptions = this.categories.filter(c => c.custom_mode === "none");
    const body = document.createElement("div");
    const renderBody = () => {
      body.innerHTML = `
        <label class="field"><span>Kategori</span>
          <select class="input" id="p-cat">${catOptions.map(c => `<option value="${c.id}" ${state.category_id === c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select>
        </label>
        <label class="field"><span>Nama Menu</span><input type="text" class="input" id="p-name" maxlength="80" value="${esc(state.name)}"></label>
        <label class="field"><span>Deskripsi (opsional)</span><input type="text" class="input" id="p-desc" maxlength="140" value="${esc(state.description || "")}"></label>
        <label class="field"><span>Harga</span><div class="input-prefix"><span>Rp</span><input type="text" inputmode="numeric" class="input" id="p-price" value="${fmtDigits(state.price)}"></div></label>
        <label class="toggle-row"><span>Butuh Pilihan Kondimen</span><input type="checkbox" id="p-condiment" ${state.requires_condiment ? "checked" : ""}></label>
        <label class="toggle-row"><span>Punya Pilihan Es/Hangat</span><input type="checkbox" id="p-ice" ${state.allow_ice_option ? "checked" : ""}></label>
        <label class="toggle-row"><span>Punya Pilihan Asin/Manis</span><input type="checkbox" id="p-taste" ${state.allow_taste_option ? "checked" : ""}></label>
        <label class="toggle-row"><span>Aktif</span><input type="checkbox" id="p-active" ${state.active !== false ? "checked" : ""}></label>`;
      bindRupiahInput($("#p-price", body));

      footer: `<button type="button" class="btn btn--ghost" data-act="cancel">Batal</button><button type="button" class="btn btn--primary" id="p-save">Simpan</button>`
    });
    $('[data-act="cancel"]', overlay).addEventListener("click", () => Modal.close(overlay));
    $("#p-save", overlay).addEventListener("click", async () => {

        try {
          await App.adapter.saveProduct({
            id: product?.id, category_id: $("#p-cat", overlay).value, name,
            description: $("#p-desc", overlay).value.trim(), price,
            requires_condiment: $("#p-condiment", overlay).checked,
            allow_ice_option: $("#p-ice", overlay).checked,
            allow_taste_option: $("#p-taste", overlay).checked,
            active: $("#p-active", overlay).checked,
            sort_order: product?.sort_order ?? (this.products.filter(x => x.category_id === $("#p-cat", overlay).value).length + 1)
          });
          Toast.success("Menu disimpan.");
          Modal.close(overlay); await this.reload();
        } catch (e) { Toast.error(friendlyError(e)); }

  async deleteProduct(id) {
    const ok = await Modal.confirm({ title: "Hapus Menu", message: "Menu ini akan dihapus permanen. Lanjutkan?", danger: true, okText: "Hapus" });
    if (!ok) return;
    try { await App.adapter.deleteProduct(id); Toast.success("Menu dihapus."); await this.reload(); }
    catch (e) { Toast.error(friendlyError(e)); }
  },
  async toggleProductActive(id) {
    const p = this.products.find(x => x.id === id);
    try { await App.adapter.saveProduct({ id, active: p.active === false }); await this.reload(); }
    catch (e) { Toast.error(friendlyError(e)); }
  },

  /* ---------- Tab Pengguna ---------- */
  renderUsersTab() {
    const wrap = $("#admin-content", this.root);
    wrap.innerHTML = `
      <div class="admin-toolbar"><button type="button" class="btn btn--primary" id="add-user-btn">+ Pengguna</button></div>

              <span class="admin-prod-row__name">${esc(u.name)} <span class="tag tag--soft">${u.role === "admin" ? "Admin" : "Kasir"}</span> ${u.active === false ? `<span class="tag tag--muted">Nonaktif</span>` : ""}</span>

    $("#add-user-btn", wrap).addEventListener("click", () => this.openUserForm());

      const edit = e.target.closest("[data-edit-user]");
      if (edit) this.openUserForm(this.users.find(u => u.id === edit.dataset.editUser));

  },
  openUserForm(user) {
    const isNew = !user;
    const state = user ? { ...user } : { username: "", name: "", role: "cashier", active: true };
    const body = document.createElement("div");
    body.innerHTML = `
      <label class="field"><span>Nama</span><input type="text" class="input" id="u-name" value="${esc(state.name)}"></label>
      <label class="field"><span>Username</span><input type="text" class="input" id="u-username" value="${esc(state.username)}" ${isNew ? "" : "readonly"}></label>
      <label class="field"><span>Peran</span>
        <select class="input" id="u-role"><option value="cashier" ${state.role === "cashier" ? "selected" : ""}>Kasir</option><option value="admin" ${state.role === "admin" ? "selected" : ""}>Admin</option></select>
      </label>
      <label class="field"><span>PIN Baru (kosongkan bila tidak diubah)</span><input type="password" inputmode="numeric" class="input" id="u-pin" maxlength="8" placeholder="••••"></label>
      <label class="toggle-row"><span>Aktif</span><input type="checkbox" id="u-active" ${state.active !== false ? "checked" : ""}></label>`;
    const overlay = Modal.open({
      title: isNew ? "Tambah Pengguna" : "Edit Pengguna", body, size: "sm",
      footer: `<button type="button" class="btn btn--ghost" data-act="cancel">Batal</button><button type="button" class="btn btn--primary" id="u-save">Simpan</button>`
    });
    $('[data-act="cancel"]', overlay).addEventListener("click", () => Modal.close(overlay));
    $("#u-save", overlay).addEventListener("click", async () => {
      const name = $("#u-name", overlay).value.trim(), username = $("#u-username", overlay).value.trim();
      if (!name || !username) { Toast.error("Nama dan username wajib diisi."); return; }
      await withLoading($("#u-save", overlay), async () => {
        try {
          const pin = $("#u-pin", overlay).value.trim();
          const saved = await App.adapter.saveUser({
            id: user?.id, name, username, role: $("#u-role", overlay).value, active: $("#u-active", overlay).checked,
            ...(user ? {} : { pin_hash: null })
          });
          if (pin) await Auth.setPin(App.adapter, saved.id, pin);
          Toast.success("Pengguna disimpan.");
          Modal.close(overlay); await this.reload();
        } catch (e) { Toast.error(friendlyError(e)); }
      });
    });
  }
};


"use strict";
/* ==========================================================================
   9. APP — login, navigasi, layout, boot
   ========================================================================== */

/* Pintasan menu Tutup Kasir: membuka tab "Tutup Kasir" di halaman Pengaturan (tab aslinya tetap ada). */
const TutupKasirPage = { mount(root) { return PengaturanPage.mount(root, "tutup"); } };

const ico = (value, cls = "") => {
  const svg = UI_ICON_SVG[value] || UI_ICON_SVG["🍽️"];
  const cssClass = cls ? `ui-ico ${cls}` : "ui-ico";
  return `<svg class="${cssClass}" viewBox="0 0 24 24" aria-hidden="true">${svg}</svg>`;
};
const categoryIco = (category, cls = "ui-ico") => ico(category?.icon || "🍽️", cls);

const navIcon = key => `<svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true">${NAV_SVG[key] || ""}</svg>`;

/* ---------- Avatar akun (login) ----------
   Tidak ada kolom foto/avatar di database pengguna, jadi avatar dibuat otomatis
   dari inisial nama dengan warna konsisten (deterministik) memakai palet tema yang ada. */
const AVATAR_PALETTE = [
  { bg: "var(--primary-tint)", fg: "var(--primary-dark)" },
  { bg: "var(--accent-tint)", fg: "var(--accent)" },
  { bg: "var(--gold-tint)", fg: "var(--gold)" }
];
const initialsOf = name => {
  const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return "?";
  return parts.length === 1 ? parts[0].slice(0, 2).toUpperCase() : (parts[0][0] + parts[1][0]).toUpperCase();
};
const avatarStyle = seed => {
  let h = 0;
  for (const ch of String(seed || "")) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const p = AVATAR_PALETTE[h % AVATAR_PALETTE.length];
  return `--av-bg:${p.bg};--av-fg:${p.fg}`;
};

const App = {
  adapter: null, mode: "connecting", connError: "", current: "kasir",

  async boot() {
    Device.load();
    Auth.load();
    Toast.init();
    document.documentElement.style.setProperty("--paper-cols", Device.width);

    const boot = await createAdapter();
    this.adapter = boot.adapter; this.mode = boot.mode; this.connError = boot.error || "";

    if (this.mode === "error") {
      return this.renderConnectionError();
    }

    // Tidak ada seed otomatis. Menu awal hanya dimasukkan lewat tombol "Import Menu dari Data".
    try { await repairMenu(this.adapter); } catch (e) { console.error(e); }
    try { await Auth.ensureDefaultPin(this.adapter); } catch (e) { console.error(e); }

    if (!Auth.isLoggedIn()) return this.renderLogin();
    this.renderShell();
    this.navigate(this.current);
  },

  renderConnectionError() {
    const root = $("#app-root");
    root.innerHTML = `
      <div class="login-screen">
        <div class="login-card">
          <div class="login-card__brand">${ico("🔴")} Database Supabase Tidak Terhubung</div>
          <p class="field-err" style="position:static;display:block;">Database Supabase tidak dapat dihubungi. Data belum dapat digunakan.${this.connError ? `<br><small>${esc(this.connError)}</small>` : ""}</p>
          <p class="menu-section__note">Aplikasi ini hanya menggunakan Supabase sebagai database — tidak ada mode lokal atau data cadangan di perangkat. Periksa koneksi internet dan pengaturan URL/Anon Key, lalu coba lagi.</p>
          <button type="button" class="btn btn--primary btn--block btn--lg" id="retry-conn-btn">Coba Lagi</button>
        </div>
      </div>`;
    $("#retry-conn-btn").addEventListener("click", () => this.boot());
  },

  /** Layar login: tahap 1 memuat daftar akun aktif dari database (bukan daftar statis),
      lalu menampilkan kartu pemilihan akun. Password/PIN baru diminta setelah akun dipilih. */
  async renderLogin() {
    const root = $("#app-root");
    root.innerHTML = `
      <div class="login-screen">
        <div class="login-shell login-fade">
          <div class="login-shell__brand">${ico("🍜")}Kasir Baso &amp; Mie Ayam</div>
          <p class="login-shell__sub">Memuat akun…</p>
        </div>
      </div>`;
    let users = [];
    try { users = (await this.adapter.listUsers()).filter(u => u.active !== false); }
    catch (e) {
      root.innerHTML = `
        <div class="login-screen">
          <div class="login-card login-fade">
            <div class="login-card__brand">${ico("🔴")} Gagal Memuat Akun</div>
            <p class="field-err" style="position:static;display:block;">${esc(friendlyError(e))}</p>
            <button type="button" class="btn btn--primary btn--block btn--lg" id="login-retry-btn">Coba Lagi</button>
          </div>
        </div>`;
      $("#login-retry-btn").addEventListener("click", () => this.renderLogin());
      return;
    }
    this._loginUsers = users;
    this.renderAccountPicker();
  },

  /** Tahap 1: kartu daftar akun, diambil langsung dari this._loginUsers (hasil listUsers()).
      Akun baru/terhapus otomatis tercermin di sini karena datanya selalu dari database. */
  renderAccountPicker() {
    const root = $("#app-root");
    const users = this._loginUsers || [];
    root.innerHTML = `
      <div class="login-screen">
        <div class="login-shell login-fade">
          <div class="login-shell__brand">${ico("🍜")}Kasir Baso &amp; Mie Ayam</div>
          <p class="login-shell__sub">Pilih akun untuk masuk</p>
          ${users.length ? `
            <div class="acct-grid">
              ${users.map(u => `
                <button type="button" class="acct-card" data-user="${esc(String(u.id))}">
                  <span class="acct-card__avatar" style="${avatarStyle(u.name || u.username)}">${initialsOf(u.name || u.username)}</span>
                  <span class="acct-card__name">${esc(u.name || u.username)}</span>
                  <span class="acct-card__role ${u.role === "admin" ? "acct-card__role--admin" : ""}">${u.role === "admin" ? "Administrator" : "Kasir"}</span>
                </button>`).join("")}
            </div>` : `<p class="login-hint">Belum ada akun terdaftar. Hubungi admin untuk membuat akun.</p>`}
          <div class="login-dua">
            <p class="login-dua__arabic">رَبِّ إِنِّي لِمَا أَنْزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ</p>
            <p class="login-dua__note">Jangan lupa baca doa 🤲</p>
          </div>
        </div>
      </div>`;
    $$("[data-user]", root).forEach(b => b.addEventListener("click", () => {
      const user = users.find(u => String(u.id) === b.dataset.user);
      if (user) this.renderPasswordStep(user);
    }));
  },

  /** Tahap 2: input password khusus akun yang dipilih. Verifikasi tetap lewat Auth.login()
      (username + PIN/password) yang sudah memakai sistem otentikasi & database yang ada. */
  renderPasswordStep(user) {
    const root = $("#app-root");
    root.innerHTML = `
      <div class="login-screen">
        <div class="login-card login-fade">
          <button type="button" class="login-back" id="login-back-btn">${ico("◀")}Kembali</button>
          <div class="login-card__user">
            <span class="acct-card__avatar acct-card__avatar--lg" style="${avatarStyle(user.name || user.username)}">${initialsOf(user.name || user.username)}</span>
            <div>
              <div class="login-card__user-name">${esc(user.name || user.username)}</div>
              <div class="login-card__user-role">${user.role === "admin" ? "Administrator" : "Kasir"}</div>
            </div>
          </div>
          <label class="field"><span>Password</span><input type="password" inputmode="numeric" maxlength="8" class="input input--lg" id="login-pin" autocomplete="current-password" autofocus></label>
          <p class="field-err" id="login-err" hidden></p>
          <button type="button" class="btn btn--primary btn--block btn--lg" id="login-btn" data-loading-text="Masuk…">Masuk</button>
        </div>
      </div>`;
    const submit = async () => {
      const pin = $("#login-pin").value.trim();
      const err = $("#login-err");
      if (!pin) { err.textContent = "Masukkan password."; err.hidden = false; return; }
      await withLoading($("#login-btn"), async () => {
        try {
          await Auth.login(this.adapter, user.username, pin);
          err.hidden = true;
          this.renderShell();
          this.navigate("kasir");
        } catch (e) {
          err.textContent = /tidak ditemukan/i.test(e?.message || "") ? "Akun tidak ditemukan. Muat ulang halaman." : "Password salah. Silakan coba lagi.";
          err.hidden = false;
        }
      });
    };
    $("#login-btn").addEventListener("click", submit);
    $("#login-pin").addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
    $("#login-back-btn").addEventListener("click", () => this.renderAccountPicker());
  },

  renderShell() {
    const items = NAV_ITEMS.filter(i => !i.adminOnly || true); // admin item selalu tampil; akses diverifikasi PIN saat dibuka
    const root = $("#app-root");
    let collapsed = false;
    try { collapsed = localStorage.getItem("kasir.sidenav.collapsed") === "1"; } catch (e) { /* mode privat */ }
    root.innerHTML = `
      <div class="shell">
        <header class="topbar">
          <button type="button" class="topbar__menu" id="hamburger-btn" aria-label="Menu">${ico("☰")}</button>
          <button type="button" class="topbar__collapse" id="collapse-btn" aria-label="Ciutkan/lebarkan sidebar" title="Ciutkan/lebarkan sidebar">${ico(collapsed ? "☰" : "◀")}</button>
          <span class="topbar__brand">${ico("🍜")} Kasir Baso &amp; Mie Ayam</span>
          <span class="topbar__mode ${this.mode === "connected" ? "topbar__mode--cloud" : ""}">${this.mode === "connected" ? `${ico("🟢")} Database Terhubung` : `${ico("🔴")} Database Terputus`}</span>
          <span class="topbar__user">${esc(Auth.name())}</span>
          <button type="button" class="topbar__logout" id="logout-btn">Keluar</button>
        </header>
        <nav class="sidenav ${collapsed ? "is-collapsed" : ""}" id="sidenav">
          ${NAV_GROUPS.map(g => `<div class="sidenav__group">${g.label}</div>${g.keys.map(k => items.find(i => i.key === k)).filter(Boolean).map(i => `<button type="button" class="sidenav__item" data-nav="${i.key}" title="${esc(i.label)}"><span class="sidenav__icon">${navIcon(i.key)}</span><span class="sidenav__label">${i.label}</span></button>`).join("")}`).join("")}
        </nav>
        <div class="sidenav-scrim" id="sidenav-scrim"></div>
        <main class="content ${collapsed ? "is-collapsed" : ""}" id="page-root"></main>
        <nav class="bottomnav" id="bottomnav">
          ${items.filter(i => ["kasir", "pesanan", "menu", "transaksi", "pengaturan"].includes(i.key)).map(i => `
            <button type="button" class="bottomnav__item" data-nav="${i.key}"><span>${navIcon(i.key)}</span><small>${i.label}</small></button>`).join("")}
          <button type="button" class="bottomnav__item" data-nav="more"><span>${navIcon("more")}</span><small>Lainnya</small></button>
        </nav>
      </div>`;
    $$("[data-nav]", root).forEach(b => b.addEventListener("click", () => {
      if (b.dataset.nav === "more") return this.openMoreSheet();
      this.navigate(b.dataset.nav);
    }));
    $("#hamburger-btn", root).addEventListener("click", () => {
      const nav = $("#sidenav", root), scrim = $("#sidenav-scrim", root), open = !nav.classList.contains("is-open");
      nav.classList.toggle("is-open", open);
      scrim.classList.toggle("is-show", open);
      $("#hamburger-btn", root).setAttribute("aria-expanded", String(open));
    });
    $("#sidenav-scrim", root).addEventListener("click", () => { $("#sidenav", root).classList.remove("is-open"); $("#sidenav-scrim", root).classList.remove("is-show"); });
    $("#collapse-btn", root).addEventListener("click", () => {
      const nav = $("#sidenav", root), content = $("#page-root", root), btn = $("#collapse-btn", root);
      const nowCollapsed = !nav.classList.contains("is-collapsed");
      nav.classList.toggle("is-collapsed", nowCollapsed);
      content.classList.toggle("is-collapsed", nowCollapsed);
      btn.innerHTML = ico(nowCollapsed ? "☰" : "◀");
      btn.setAttribute("aria-label", nowCollapsed ? "Buka sidebar" : "Tutup sidebar");
      btn.setAttribute("title", nowCollapsed ? "Buka sidebar" : "Tutup sidebar");
      try { localStorage.setItem("kasir.sidenav.collapsed", nowCollapsed ? "1" : "0"); } catch (e) { /* mode privat */ }
    });
    $("#logout-btn", root).addEventListener("click", async () => {
      const ok = await Modal.confirm({ title: "Keluar", message: "Keluar dari sesi ini?" });
      if (ok) { Auth.logout(); this.renderLogin(); }
    });
  },

  openMoreSheet() {
    const body = document.createElement("div");
    body.className = "more-sheet";
    body.innerHTML = `
      <button type="button" class="more-sheet__item" data-nav="tutup">${navIcon("tutup")}<span>Tutup Kasir</span></button>
      <button type="button" class="more-sheet__item" data-nav="laporan">${navIcon("laporan")}<span>Laporan</span></button>
      <button type="button" class="more-sheet__item" data-nav="refresh">${navIcon("refresh")}<span>Refresh Halaman</span></button>
      <button type="button" class="more-sheet__item" data-nav="admin">${navIcon("admin")}<span>Admin</span></button>`;
    const overlay = Modal.open({ title: "Menu Lainnya", body, size: "sm" });
    $$("[data-nav]", overlay).forEach(b => b.addEventListener("click", () => { Modal.close(overlay); this.navigate(b.dataset.nav); }));
  },

  /** Panel Refresh Halaman: muat ulang data halaman aktif, atau muat ulang seluruh aplikasi. */
  openRefreshPanel() {
    $("#sidenav")?.classList.remove("is-open"); $("#sidenav-scrim")?.classList.remove("is-show");
    const body = document.createElement("div");
    body.className = "refresh-panel";
    body.innerHTML = `
      <button type="button" class="refresh-opt" data-act="data">${navIcon("refresh")}<span><b>Muat ulang halaman</b><small>Ambil data terbaru dari database tanpa keluar dari halaman ini.</small></span></button>
      <button type="button" class="refresh-opt" data-act="app">${navIcon("power")}<span><b>Muat ulang aplikasi</b><small>Buka ulang aplikasi dari awal. Sesi login tetap aktif.</small></span></button>`;
    const overlay = Modal.open({ title: "Refresh Halaman", body, size: "sm" });
    $('[data-act="data"]', overlay).addEventListener("click", async () => {
      Modal.close(overlay);
      await this.navigate(this.current);
      Toast.success("Halaman dimuat ulang.");
    });
    $('[data-act="app"]', overlay).addEventListener("click", () => { Modal.close(overlay); setTimeout(() => location.reload(), 200); });
  },

  async navigate(key, subTab) {
    if (key === "refresh") return this.openRefreshPanel();
    const item = NAV_ITEMS.find(i => i.key === key);
    if (!item) return;
    this.current = key;
    $$("[data-nav]", document).forEach(b => b.classList.toggle("is-active", b.dataset.nav === key));
    $("#sidenav")?.classList.remove("is-open"); $("#sidenav-scrim")?.classList.remove("is-show");
    Sheet.close();
    const root = $("#page-root");
    if (!root) return;
    root.innerHTML = `<div class="page-loading">Memuat…</div>`;
    try { await item.page.mount(root, subTab); }
    catch (e) { console.error(e); root.innerHTML = `<div class="empty-state">Gagal memuat halaman. ${esc(friendlyError(e))}</div>`; }
  }
};

document.addEventListener("DOMContentLoaded", () => App.boot());

</script>
</body>
</html>
