      const originalHtml = b.innerHTML;
      b.classList.add("is-loading");
      b.innerHTML = `<span class="spinner" aria-hidden="true"></span><span>Memproses…</span>`;
      const resetButtons = () => {
        container.dataset.oaBusy = "";
        allBtns.forEach(x => { x.disabled = false; });
        b.classList.remove("is-loading");
        b.innerHTML = originalHtml;
      };

      // Bayar / Lunas TIDAK menggunakan PIN. PIN hanya diwajibkan untuk Refund.
      if (action === "paid") {
        // Ambil data terbaru sebelum membuka kasir agar transaksi yang sudah dibayar
        // dari perangkat/sesi lain tidak ikut diproses lagi.
        try {
          const latest = await App.adapter.getOrder(order.id);
          if (!latest || (latest.payment_status || "belum_bayar") !== "belum_bayar") {
            Toast.error("Transaksi ini sudah tidak berstatus Belum Bayar.");
            resetButtons();
            return;
          }
          const latestItems = await App.adapter.getOrderItems(order.id);
          KasirPage.startPayOrder(latest, latestItems);
          const currentOverlay = container.closest(".overlay");
          if (currentOverlay) Modal.close(currentOverlay);
          await App.navigate("kasir");
        } catch (e) { Toast.error(friendlyError(e)); resetButtons(); }
        return;
      }

      if (action === "refund") {
        const pinOk = await Modal.promptActionPin("Masukkan PIN untuk konfirmasi refund.");
        if (!pinOk) { resetButtons(); return; }
      }
      try {
        let updated;
        if (action === "refund") updated = await App.adapter.refundOrder(order.id, Auth.name());
        else updated = await App.adapter.archiveOrder(order.id, Auth.name());
        Object.assign(order, updated || {});
        Toast.success("Status transaksi diperbarui.");
        resetButtons();
        onChange && onChange(order, action);
      } catch (e) { Toast.error(friendlyError(e)); resetButtons(); }
    }));
  }
};

/** Bottom sheet untuk keranjang pada layar sempit. */
const Sheet = {
  el: null,
  open() { this.el = $("#cart-sheet"); this.el.classList.add("is-open"); $("#cart-scrim").classList.add("is-show"); document.body.classList.add("no-scroll"); },
  close() { this.el?.classList.remove("is-open"); $("#cart-scrim")?.classList.remove("is-show"); document.body.classList.remove("no-scroll"); },
  toggle() { this.el?.classList.contains("is-open") ? this.close() : this.open(); }
};

/** Menonaktifkan tombol + menampilkan spinner selama fn async berjalan; mengembalikan tombol ke semula setelahnya. */
async function withLoading(btn, fn) {
  if (!btn || btn.disabled) return;
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.classList.add("is-loading");
  btn.innerHTML = `<span class="spinner" aria-hidden="true"></span><span>${btn.dataset.loadingText || "Memproses…"}</span>`;
  try { return await fn(); }
  finally { btn.disabled = false; btn.classList.remove("is-loading"); btn.innerHTML = original; }
}

/** Format input rupiah otomatis: menyimpan hanya digit, menampilkan bertitik. */
function bindRupiahInput(input) {
  input.addEventListener("input", () => {
    const pos = input.selectionStart, before = input.value.length;
    input.value = fmtDigits(input.value);
    const diff = input.value.length - before;
    const p = Math.max(0, pos + diff);
    input.setSelectionRange(p, p);
  });
}

function friendlyError(e) {
  const m = (e && e.message) || String(e);
  if (isNetworkError(e)) return "Tidak dapat terhubung ke server. Periksa koneksi internet, data Anda belum hilang.";
  return m;
}
function isNetworkError(e) {
  const m = (e && e.message) || String(e);
  return /fetch|network|Failed to fetch|NetworkError/i.test(m);
}


"use strict";
/* ==========================================================================
   4. STRUK — render HTML struk, teks polos (thermal), cetak, simpan PDF, bagikan
   ========================================================================== */

const Receipt = {
  /** Bangun baris-baris item untuk ditampilkan (dipakai HTML & teks). */
  lines(items) {
    const out = [];
    for (const it of items) {
      out.push({ type: "item", name: it.product_name, qty: it.quantity, price: it.base_price, total: it.quantity * it.base_price });
      const meta = [];
      if (it.condiment) meta.push(`Kondimen: ${it.condiment}${it.condiment_detail ? ` (${it.condiment_detail})` : ""}`);
      if (it.temperature) meta.push(it.temperature);
      if (it.taste) meta.push(it.taste);
      if (meta.length) out.push({ type: "meta", text: meta.join(" · ") });
      if (it.notes) out.push({ type: "note", text: `Catatan: ${it.notes}` });
    }
    return out;
  },

  /** true jika keranjang/pesanan berisi item Take Away DAN Dine In sekaligus. */
  isMixed(items) {
    const types = new Set(items.map(it => it.order_type === "dine_in" ? "dine_in" : "take_away"));
    return types.size > 1;
  },
  groupItems(items) {
    return {
      take_away: items.filter(it => it.order_type !== "dine_in"),
      dine_in: items.filter(it => it.order_type === "dine_in")
    };
  },

  htmlFor(order, items, settings) {
    const mixed = this.isMixed(items);
    const rowsFor = arr => this.lines(arr).map(r => {
      if (r.type === "item") return `<div class="rc-row"><span>${esc(r.name)}${r.qty > 1 ? ` ×${r.qty}` : ""}</span><span>${rp(r.total)}</span></div>`;
      if (r.type === "meta") return `<div class="rc-sub">${esc(r.text)}</div>`;
      return `<div class="rc-sub rc-sub--note">${esc(r.text)}</div>`;
    }).join("");
    let rowsHtml;
    if (mixed) {
      const g = this.groupItems(items);
      rowsHtml = `<div class="rc-row rc-bold"><span>${ORDER_TYPES.take_away.receipt}</span></div>${rowsFor(g.take_away)}
        <div class="rc-hr rc-hr--dashed"></div>
        <div class="rc-row rc-bold"><span>${ORDER_TYPES.dine_in.receipt}</span></div>${rowsFor(g.dine_in)}`;
    } else {
      rowsHtml = rowsFor(items);
    }
    const typeInfo = orderTypeInfo(order.order_type);
    return `
      <div class="receipt" id="receipt-print-area">
        <div class="rc-center rc-bold rc-lg">${esc(settings.restaurant_name || "Restoran")}</div>
        ${settings.address ? `<div class="rc-center rc-sub">${esc(settings.address)}</div>` : ""}
        ${settings.phone ? `<div class="rc-center rc-sub">${esc(settings.phone)}</div>` : ""}
        <div class="rc-hr"></div>
        <div class="rc-row"><span class="rc-bold">${esc(typeInfo.receipt)}${order.table_no ? ` · Meja ${esc(order.table_no)}` : ""}</span></div>
        <div class="rc-row"><span>No. Transaksi</span><span>${esc(order.order_number)}</span></div>
        <div class="rc-row"><span>Nama Pelanggan</span><span>${esc(order.customer_name || "-")}</span></div>
        <div class="rc-row"><span>Tanggal</span><span>${fmtDateTime(order.created_at)}</span></div>
        <div class="rc-row"><span>Kasir</span><span>${esc(order.cashier || "-")}</span></div>
        <div class="rc-row"><span>Metode Bayar</span><span>${esc((PAYMENT_METHODS[order.payment_method] || PAYMENT_METHODS.tunai).label)}</span></div>
        <div class="rc-hr rc-hr--dashed"></div>
        ${rowsHtml}
        <div class="rc-hr rc-hr--dashed"></div>
        <div class="rc-row"><span>Subtotal</span><span>${rp(order.subtotal)}</span></div>
        ${order.discount > 0 ? `<div class="rc-row"><span>Diskon</span><span>-${rp(order.discount)}</span></div>` : ""}
        ${order.tax > 0 ? `<div class="rc-row"><span>Pajak</span><span>${rp(order.tax)}</span></div>` : ""}
        <div class="rc-row rc-bold rc-lg"><span>${mixed ? "TOTAL KESELURUHAN" : "TOTAL"}</span><span>${rp(order.total)}</span></div>
        <div class="rc-row"><span>Bayar</span><span>${rp(order.payment)}</span></div>
        <div class="rc-row"><span>Kembali</span><span>${rp(order.change)}</span></div>
        <div class="rc-row rc-bold"><span>Status</span><span>${esc((PAYMENT_STATUSES[order.payment_status] || PAYMENT_STATUSES.belum_bayar).label.toUpperCase())}</span></div>
        <div class="rc-hr"></div>
        <div class="rc-center">${esc(settings.receipt_footer || "Terima kasih")}</div>
        ${order.status === "cancelled" ? `<div class="rc-center rc-cancelled">— DIBATALKAN —</div>` : ""}
        ${order.payment_status === "refund" ? `<div class="rc-center rc-cancelled">— REFUND —</div>` : ""}
        ${order.payment_status === "arsip" ? `<div class="rc-center rc-cancelled">— ARSIP —</div>` : ""}
      </div>`;
  },

  /** Versi teks polos rata kolom, untuk printer thermal / berbagi teks. */
  textFor(order, items, settings, width) {
    width = width || 32;
    const line = ch => ch.repeat(width);
    const dashed = () => "-".repeat(width);
    const center = s => { s = s.slice(0, width); const pad = Math.max(0, Math.floor((width - s.length) / 2)); return " ".repeat(pad) + s; };
    const rowLR = (l, r) => {
      l = String(l); r = String(r);
      if (l.length + r.length + 1 > width) {
        const wrapped = [];
        let rest = l;
        while (rest.length > width) { wrapped.push(rest.slice(0, width)); rest = rest.slice(width); }
        return wrapped.concat(rest).join("\n") + "\n" + " ".repeat(Math.max(0, width - r.length)) + r;
      }
      return l + " ".repeat(width - l.length - r.length) + r;
    };
    const out = [];
    out.push(center(settings.restaurant_name || "Restoran"));
    if (settings.address) out.push(center(settings.address));
    if (settings.phone) out.push(center(settings.phone));
    out.push(line("="));
    const typeInfo = orderTypeInfo(order.order_type);
    out.push(`${typeInfo.receipt}${order.table_no ? " - Meja " + order.table_no : ""}`);
    out.push(rowLR("No. Transaksi", order.order_number));
    out.push(rowLR("Nama Pelanggan", order.customer_name || "-"));
    out.push(rowLR("Tanggal", fmtDateTime(order.created_at)));
    out.push(rowLR("Kasir", order.cashier || "-"));
    out.push(rowLR("Metode Bayar", (PAYMENT_METHODS[order.payment_method] || PAYMENT_METHODS.tunai).label));
    out.push(dashed());
    const mixed = this.isMixed(items);
    const pushLines = arr => { for (const it of this.lines(arr)) {
      if (it.type === "item") out.push(rowLR(it.name + (it.qty > 1 ? ` x${it.qty}` : ""), rp(it.total)));
      else if (it.type === "meta") out.push("  " + it.text);
      else out.push("  " + it.text);
    } };
    if (mixed) {
      const g = this.groupItems(items);
      out.push(ORDER_TYPES.take_away.receipt);
      pushLines(g.take_away);
      out.push(dashed());
      out.push(ORDER_TYPES.dine_in.receipt);
      pushLines(g.dine_in);
    } else {
      pushLines(items);
    }
    out.push(dashed());
    out.push(rowLR("Subtotal", rp(order.subtotal)));
    if (order.discount > 0) out.push(rowLR("Diskon", "-" + rp(order.discount)));
    if (order.tax > 0) out.push(rowLR("Pajak", rp(order.tax)));
    out.push(rowLR(mixed ? "TOTAL KESELURUHAN" : "TOTAL", rp(order.total)));
    out.push(rowLR("Bayar", rp(order.payment)));
    out.push(rowLR("Kembali", rp(order.change)));
    out.push(rowLR("Status", (PAYMENT_STATUSES[order.payment_status] || PAYMENT_STATUSES.belum_bayar).label.toUpperCase()));
    out.push(line("="));
    out.push(center(settings.receipt_footer || "Terima kasih"));
    if (order.status === "cancelled") out.push(center("** DIBATALKAN **"));
    if (order.payment_status === "refund") out.push(center("** REFUND **"));
    if (order.payment_status === "arsip") out.push(center("** ARSIP **"));
    return out.join("\n");
  },

  async print(order, items, settings) {
    if (Device.get("use_bt_printer") && BtPrinter.isConnected()) {
      try { await BtPrinter.printText(this.textFor(order, items, settings, Device.width)); Toast.success("Bill Pembayaran tercetak & terpotong otomatis."); return; }
      catch (e) {
        // Bill sudah tercetak, hanya perintah potong yang gagal — jangan tampilkan sebagai error cetak.
        if (e.cutFailed) { Toast.info("Bill Pembayaran tercetak, tetapi printer ini tidak mendukung pemotongan kertas otomatis."); return; }
        Toast.error("Gagal cetak Bluetooth: " + friendlyError(e)); return;
      }
    }
    const w = window.open("", "_blank", "width=420,height=640");
    if (!w) { Toast.error("Popup diblokir. Izinkan popup untuk mencetak struk."); return; }
    w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(order.order_number)}</title>
      <style>
        @page { margin: 6mm; }
        body { font-family: 'Courier New', monospace; font-size: 12px; color:#000; margin:0; padding:8px; width: ${Device.width === 42 ? "80mm" : "58mm"}; }
        .rc-row { display:flex; justify-content:space-between; gap:8px; }
        .rc-row--addon { padding-left: 8px; }
        .rc-sub { font-size: 11px; padding-left: 8px; color:#333; }
        .rc-sub--note { font-style: italic; }
        .rc-center { text-align:center; }
        .rc-bold { font-weight:700; }
        .rc-lg { font-size: 14px; }
        .rc-hr { border-top: 1px solid #000; margin: 6px 0; }
        .rc-hr--dashed { border-top: 1px dashed #000; }
        .rc-cancelled { text-align:center; font-weight:700; margin-top:6px; }
      </style></head><body>${this.htmlFor(order, items, settings)}
      <script>window.onload=()=>{window.print(); setTimeout(()=>window.close(), 300);}<\/script>
      </body></html>`);
    w.document.close();
  },

  async savePdf(order, items, settings) {
    const html = `<!doctype html><html><head><meta charset="utf-8"><style>
        body { font-family: 'Courier New', monospace; font-size: 12px; color:#000; margin:0; padding:10px; }
        .rc-row { display:flex; justify-content:space-between; gap:8px; }
        .rc-row--addon { padding-left: 8px; }
        .rc-sub { font-size: 11px; padding-left: 8px; color:#333; }
        .rc-sub--note { font-style: italic; }
        .rc-center { text-align:center; }
        .rc-bold { font-weight:700; }
        .rc-lg { font-size: 14px; }
        .rc-hr { border-top: 1px solid #000; margin: 6px 0; }
        .rc-hr--dashed { border-top: 1px dashed #000; }
        .rc-cancelled { text-align:center; font-weight:700; margin-top:6px; }
      </style></head><body>${this.htmlFor(order, items, settings)}</body></html>`;
    // Tanpa pustaka PDF eksternal: buka jendela cetak dengan pilihan "Simpan sebagai PDF" milik browser.
    const w = window.open("", "_blank", "width=420,height=640");
    if (!w) { Toast.error("Popup diblokir. Izinkan popup untuk menyimpan PDF."); return; }
    w.document.write(html + `<script>window.onload=()=>window.print();<\/script>`);
    w.document.close();
    Toast.info("Pilih \"Simpan sebagai PDF\" pada dialog cetak.");
  },

  async share(order, items, settings) {
    const text = this.textFor(order, items, settings, Device.width);
    if (navigator.share) {
      try { await navigator.share({ title: order.order_number, text }); return; }
      catch (e) { if (e.name === "AbortError") return; }
    }
    try { await navigator.clipboard.writeText(text); Toast.success("Struk disalin ke clipboard."); }
    catch (e) { Toast.error("Tidak dapat membagikan. Coba cetak struk."); }
  }
};

/* ---------- Bill Dapur — slip pesanan tanpa harga untuk dapur ---------- */
const KitchenBill = {
  htmlFor(order, items, settings) {
    const typeInfo = orderTypeInfo(order.order_type);
    const rowFor = it => {
      const meta = [];
      if (it.condiment) meta.push(`${it.condiment}${it.condiment_detail ? ` (${it.condiment_detail})` : ""}`);
      if (it.temperature) meta.push(it.temperature);
      if (it.taste) meta.push(it.taste);
      return `
        <div class="rc-row rc-bold rc-lg"><span>${esc(it.product_name)} ${it.quantity > 1 ? `×${it.quantity}` : ""}</span>${settings.kitchen_ticket_show_price ? `<span>${rp(it.quantity * it.base_price)}</span>` : ""}</div>
        ${meta.length ? `<div class="rc-sub">${esc(meta.join(" · "))}</div>` : ""}
        ${it.notes ? `<div class="rc-sub rc-sub--note">Catatan: ${esc(it.notes)}</div>` : ""}`;
    };
    let rowsHtml;
    if (Receipt.isMixed(items)) {
      const g = Receipt.groupItems(items);
      rowsHtml = `<div class="rc-row rc-bold">${ORDER_TYPES.take_away.receipt}</div>${g.take_away.map(rowFor).join("")}
        <div class="rc-hr rc-hr--dashed"></div>
        <div class="rc-row rc-bold">${ORDER_TYPES.dine_in.receipt}</div>${g.dine_in.map(rowFor).join("")}`;
    } else {
      rowsHtml = items.map(rowFor).join("");
    }
    return `
      <div class="receipt" id="kitchen-print-area">
        <div class="kb-highlight">${esc(typeInfo.receipt)}${order.table_no ? ` · Meja ${esc(order.table_no)}` : ""}</div>
        <div class="kb-highlight">${esc(order.customer_name || "-")}</div>
        <div class="rc-hr"></div>
        <div class="rc-center rc-bold rc-lg">${esc(settings.kitchen_ticket_header || "BON DAPUR")}</div>
        <div class="rc-row"><span>No. Transaksi</span><span>${esc(order.order_number)}</span></div>
        <div class="rc-row"><span>Jam</span><span>${fmtDateTime(order.created_at)}</span></div>
        <div class="rc-hr rc-hr--dashed"></div>
        ${rowsHtml}
        <div class="rc-hr rc-hr--dashed"></div>
        ${settings.kitchen_ticket_note ? `<div class="rc-sub">${esc(settings.kitchen_ticket_note)}</div>` : ""}
      </div>`;
  },
  textFor(order, items, settings, width) {
    width = width || 32;
    const line = ch => ch.repeat(width);
    const dashed = () => "-".repeat(width);
    const center = s => { s = s.slice(0, width); const pad = Math.max(0, Math.floor((width - s.length) / 2)); return " ".repeat(pad) + s; };
    const typeInfo = orderTypeInfo(order.order_type);
    const out = [];
    out.push(center(typeInfo.receipt + (order.table_no ? " - Meja " + order.table_no : "")));
    out.push(center(order.customer_name || "-"));
    out.push(line("="));
    out.push(center(settings.kitchen_ticket_header || "BON DAPUR"));
    out.push(`No. ${order.order_number}`);
    out.push(`Jam: ${fmtDateTime(order.created_at)}`);
    out.push(dashed());
    const pushItem = it => {
      out.push(`${it.product_name}${it.quantity > 1 ? ` x${it.quantity}` : ""}`);
      const meta = [];
      if (it.condiment) meta.push(`${it.condiment}${it.condiment_detail ? ` (${it.condiment_detail})` : ""}`);
      if (it.temperature) meta.push(it.temperature);
      if (it.taste) meta.push(it.taste);
      if (meta.length) out.push("  " + meta.join(" · "));
      if (it.notes) out.push("  Catatan: " + it.notes);
    };
    if (Receipt.isMixed(items)) {
      const g = Receipt.groupItems(items);
      out.push(ORDER_TYPES.take_away.receipt);
      g.take_away.forEach(pushItem);
      out.push(dashed());
      out.push(ORDER_TYPES.dine_in.receipt);
      g.dine_in.forEach(pushItem);
    } else {
      items.forEach(pushItem);
    }
    out.push(dashed());
    if (settings.kitchen_ticket_note) out.push(settings.kitchen_ticket_note);
    return out.join("\n");
  },
  /** Versi tersegmentasi dari textFor(), khusus untuk printer Bluetooth (ESC/POS): baris jenis
      pesanan (DINE IN/TAKE AWAY/CAMPUR) & Nama Pelanggan dipisah sebagai segmen tersendiri agar
      bisa dicetak menonjol — tebal, 2x ukuran huruf, rata tengah (setara ±20px pada versi HTML) —
      sementara sisa isi bill (header, nomor, jam, daftar item, catatan) tetap format standar
      seperti sebelumnya, tidak berubah ukuran/posisinya. Dipakai oleh KitchenBill.print(); lihat
      BtPrinter.printSegments untuk cara segmen ini dirender jadi perintah ESC/POS. */
  segmentsFor(order, items, settings, width) {
    width = width || 32;
    const dashed = () => "-".repeat(width);
    const center = s => { s = s.slice(0, width); const pad = Math.max(0, Math.floor((width - s.length) / 2)); return " ".repeat(pad) + s; };
    // Banyak printer thermal klon TIDAK menghormati perintah "rata tengah" bawaan ESC/POS (ESC a)
    // saat mode 2x ukuran huruf (GS !) aktif — hasilnya teks malah mepet ke kanan, bukan center.
    // Supaya benar-benar center di printer manapun, tengah dihitung MANUAL lewat spasi (sama
    // seperti header "BON DAPUR" di atas, yang sudah terbukti center dengan benar), bukan lewat
    // perintah align printer. Setiap karakter pada mode 2x ukuran menempati dot 2x lebih lebar,
    // jadi jumlah karakter yang muat per baris jadi separuh (halfWidth) — spasi pun dihitung
    // berdasarkan halfWidth ini, bukan lebar penuh (width).
    const halfWidth = Math.max(6, Math.floor(width / 2));
    const centerHalf = s => { s = String(s || "").slice(0, halfWidth); const pad = Math.max(0, Math.floor((halfWidth - s.length) / 2)); return " ".repeat(pad) + s; };
    const typeInfo = orderTypeInfo(order.order_type);
    const body = [];
    body.push("=".repeat(width));
    body.push(center(settings.kitchen_ticket_header || "BON DAPUR"));
    body.push(`No. ${order.order_number}`);
    body.push(`Jam: ${fmtDateTime(order.created_at)}`);
    body.push(dashed());
    const pushItem = it => {
      body.push(`${it.product_name}${it.quantity > 1 ? ` x${it.quantity}` : ""}`);
      const meta = [];
      if (it.condiment) meta.push(`${it.condiment}${it.condiment_detail ? ` (${it.condiment_detail})` : ""}`);
      if (it.temperature) meta.push(it.temperature);
      if (it.taste) meta.push(it.taste);
      if (meta.length) body.push("  " + meta.join(" · "));
      if (it.notes) body.push("  Catatan: " + it.notes);
    };
    if (Receipt.isMixed(items)) {
      const g = Receipt.groupItems(items);
      body.push(ORDER_TYPES.take_away.receipt);
      g.take_away.forEach(pushItem);
      body.push(dashed());
      body.push(ORDER_TYPES.dine_in.receipt);
      g.dine_in.forEach(pushItem);
    } else {
      items.forEach(pushItem);
    }
    body.push(dashed());
    if (settings.kitchen_ticket_note) body.push(settings.kitchen_ticket_note);
    return [
      { text: centerHalf(typeInfo.receipt + (order.table_no ? " - MEJA " + order.table_no : "")), bold: true, size: "double" },
      { text: centerHalf(order.customer_name || "-"), bold: true, size: "double" },
      { text: body.join("\n") }
    ];
  },
  async print(order, items, settings) {
    if (Device.get("use_bt_printer") && BtPrinter.isConnected()) {
      try { await BtPrinter.printSegments(this.segmentsFor(order, items, settings, Device.width)); Toast.success("Bill Kitchen tercetak & terpotong otomatis."); return; }
      catch (e) {
        // Bill sudah tercetak, hanya perintah potong yang gagal — jangan tampilkan sebagai error cetak.
        if (e.cutFailed) { Toast.info("Bill Kitchen tercetak, tetapi printer ini tidak mendukung pemotongan kertas otomatis."); return; }
        Toast.error("Gagal cetak Bluetooth: " + friendlyError(e)); return;
      }
    }
    const w = window.open("", "_blank", "width=420,height=640");
    if (!w) { Toast.error("Popup diblokir. Izinkan popup untuk mencetak bill dapur."); return; }
    w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Bill Dapur ${esc(order.order_number)}</title>
      <style>
        @page { margin: 6mm; }
        body { font-family: 'Courier New', monospace; font-size: 13px; color:#000; margin:0; padding:8px; width: ${Device.width === 42 ? "80mm" : "58mm"}; }
        .rc-row { display:flex; justify-content:space-between; gap:8px; }
        .rc-sub { font-size: 11.5px; padding-left: 4px; color:#333; }
        .rc-sub--note { font-style: italic; }
        .rc-center { text-align:center; }
        .rc-bold { font-weight:700; }
        .rc-lg { font-size: 15px; }
        .rc-hr { border-top: 1px solid #000; margin: 6px 0; }
        .rc-hr--dashed { border-top: 1px dashed #000; }
        .kb-highlight { text-align: center; font-weight: bold; font-size: 20px; margin-bottom: 4px; }
      </style></head><body>${this.htmlFor(order, items, settings)}
      <script>window.onload=()=>{window.print(); setTimeout(()=>window.close(), 300);}<\/script>
      </body></html>`);
    w.document.close();
  },
  /** "Spill Struk Kitchen" — bagikan bon dapur (teks polos, tanpa info harga/pembayaran)
      lewat fitur share perangkat, atau salin ke clipboard bila share tidak tersedia. */
  async share(order, items, settings) {
    const text = this.textFor(order, items, settings, Device.width);
    if (navigator.share) {
      try { await navigator.share({ title: `Bon Dapur ${order.order_number}`, text }); return; }
      catch (e) { if (e.name === "AbortError") return; }
    }
    try { await navigator.clipboard.writeText(text); Toast.success("Struk kitchen disalin ke clipboard."); }
    catch (e) { Toast.error("Tidak dapat membagikan. Coba cetak bill dapur."); }
  }
};


"use strict";
/* ==========================================================================
   5. AUTH — sesi kasir/admin sederhana berbasis PIN (disimpan di perangkat)
   Catatan: ini otentikasi ringan yang cocok untuk kasir satu perangkat bersama.
   Bila Supabase Auth tersedia dan dikonfigurasi, PIN admin tetap dipakai sebagai
   verifikasi cepat di lantai kasir (mis. sebelum membatalkan transaksi).
   ========================================================================== */

const Auth = {
  key: "kasir.session.v1",
  session: null,

  load() {
    try { this.session = JSON.parse(localStorage.getItem(this.key) || "null"); }
    catch (e) { this.session = null; }
  },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.session)); } catch (e) { /* abaikan */ } },
  logout() { this.session = null; this.save(); },
  isLoggedIn() { return !!this.session; },
  isAdmin() { return this.session?.role === "admin"; },
  name() { return this.session?.name || "Kasir"; },

  async login(adapter, username, pin) {
    const user = await adapter.findUserByUsername(username);
    if (!user || user.active === false) throw new Error("Pengguna tidak ditemukan.");
    if (user.pin_hash) {
      const h = await sha256(pin || "");
      if (h !== user.pin_hash) throw new Error("PIN salah.");
    } // pengguna tanpa PIN diperbolehkan masuk tanpa verifikasi (mode default, dapat diatur admin)
    this.session = { id: user.id, username: user.username, name: user.name, role: user.role };
    this.save();
    return this.session;
  },

  /** Login langsung dengan PIN saja (tanpa username), dipakai layar login utama.
      Mencocokkan PIN ke seluruh pengguna aktif yang sudah memiliki PIN. */
  async loginByPin(adapter, pin) {
    const users = await adapter.listUsers();
    const h = await sha256(pin || "");
    const match = users.find(u => u.active !== false && u.pin_hash && u.pin_hash === h);
    if (!match) throw new Error("PIN salah.");
    this.session = { id: match.id, username: match.username, name: match.name, role: match.role };
    this.save();
    return this.session;
  },

  /** Memastikan ada PIN default agar kasir/admin bisa langsung masuk tanpa setup manual.
      Hanya mengisi PIN pengguna admin bila belum pernah diatur (pin_hash masih kosong);
      tidak akan menimpa PIN yang sudah sengaja diubah admin. */
  async ensureDefaultPin(adapter, defaultPin = "24434") {
    const users = await adapter.listUsers();
    const admin = users.find(u => u.role === "admin");
    if (admin && !admin.pin_hash) {
      await this.setPin(adapter, admin.id, defaultPin);
    }
  },

  async verifyAdminPin(adapter, pin) {
    const users = await adapter.listUsers();
    const admins = users.filter(u => u.role === "admin" && u.active !== false);
    for (const a of admins) {
      if (!a.pin_hash) return a; // admin tanpa PIN diset = selalu boleh (peringatkan di Pengaturan)
      const h = await sha256(pin || "");
      if (h === a.pin_hash) return a;
    }
    return null;
  },

  async setPin(adapter, userId, pin) {
    const pin_hash = pin ? await sha256(pin) : null;
    return adapter.saveUser({ id: userId, pin_hash });
  }
};

/* ==========================================================================
   6. HALAMAN KASIR

const KASIR_ALL_CAT = "__semua__"; // id semu untuk kategori "Semua Menu" di sidebar kasir

const KasirPage = {
  root: null, categories: [], products: [], activeCat: null, settings: DEFAULT_SETTINGS,

  async mount(root) {
    this.root = root;
    State.load();
    await this.reloadData();
    this.render();
    this.bindRootDelegation(); // hanya sekali per mount agar listener tidak menumpuk saat render() dipanggil ulang
  },

  async reloadData() {
    [this.categories, this.products, this.settings] = await Promise.all([
      App.adapter.listCategories(), App.adapter.listProducts(), App.adapter.getSettings()
    ]);
    this.categories = this.categories.filter(c => c.active !== false);

    if (State.d.paymentMethod === "qris") {

    return `
      <div class="order-type">
        <span class="order-type__label">Jenis pesanan berikutnya:</span>
        ${ITEM_ORDER_TYPE_KEYS.map(k => { const v = ORDER_TYPES[k]; return `
          <button type="button" class="order-type__btn ${(d.orderType || "dine_in") === k ? "is-active" : ""}" data-order-type="${k}">
            <span>${ico(v.icon)} ${v.label}</span>
          </button>`; }).join("")}
        ${tableField}
      </div>`;
  },

  categoryBar() {
    // Kategori diambil langsung dari this.categories (hasil listCategories()), jadi kategori baru
    // yang ditambahkan admin otomatis ikut muncul di sidebar tanpa perlu kode tambahan.
    return `<div class="cat-nav" role="tablist" aria-label="Kategori menu">
      <button type="button" class="cat-chip ${this.activeCat === KASIR_ALL_CAT ? "is-active" : ""}" data-cat="${KASIR_ALL_CAT}" role="tab" aria-selected="${this.activeCat === KASIR_ALL_CAT}">
        <span class="cat-chip__ico">${ico("🍱", "cat-ico")}</span><span class="cat-chip__label">Semua Menu</span>
      </button>
      ${this.categories.map(c => `
        <button type="button" class="cat-chip ${c.id === this.activeCat ? "is-active" : ""}" data-cat="${c.id}" role="tab" aria-selected="${c.id === this.activeCat}">
          <span class="cat-chip__ico">${categoryIco(c, "cat-ico")}</span><span class="cat-chip__label">${esc(c.name)}</span>
        </button>`).join("")}
    </div>`;
  },

  productGrid() {
    if (this.activeCat === KASIR_ALL_CAT) {
      // "Semua Menu": gabungkan produk dari semua kategori non-custom (kategori custom tidak
      // punya daftar produk tetap — tetap bisa diakses lewat chip kategorinya sendiri).
      const catIds = new Set(this.categories.filter(c => !c.custom_mode || c.custom_mode === "none").map(c => c.id));
      const items = this.products.filter(p => p.active !== false && catIds.has(p.category_id));
      if (!items.length) return `<div class="empty-state">Belum ada menu.</div>`;
      return `<div class="prod-grid">${items.map(p => `
        <button type="button" class="prod-card" data-product="${p.id}">
          <span class="prod-card__name">${esc(p.name)}</span>
          ${p.description ? `<span class="prod-card__desc">${esc(p.description)}</span>` : ""}
          <span class="prod-card__price">${rp(p.price)}</span>
        </button>`).join("")}</div>`;
    }
    const cat = this.categories.find(c => c.id === this.activeCat);
    if (!cat) return `<div class="empty-state">Belum ada kategori aktif.</div>`;
    if (cat.custom_mode && cat.custom_mode !== "none") return this.customForm(cat);
    const items = this.products.filter(p => p.category_id === cat.id && p.active !== false);
    if (!items.length) return `<div class="empty-state">Belum ada menu di kategori ini.</div>`;
    return `<div class="prod-grid">${items.map(p => `
      <button type="button" class="prod-card" data-product="${p.id}">
        <span class="prod-card__name">${esc(p.name)}</span>
        ${p.description ? `<span class="prod-card__desc">${esc(p.description)}</span>` : ""}
        <span class="prod-card__price">${rp(p.price)}</span>
      </button>`).join("")}</div>`;
  },

  customForm(cat) {
    const draft = State.d.customDrafts[cat.id] || { name: "", price: "", qty: "1" };
    if (!ITEM_ORDER_TYPE_KEYS.includes(draft.type)) draft.type = State.d.orderType || "dine_in";
    const withQty = cat.custom_mode === "name_price_qty";
    return `<div class="custom-form" data-cat-id="${cat.id}">
      <div class="custom-form__title">${categoryIco(cat, "cat-ico")} ${esc(cat.name)} — Custom</div>
      <div class="field-group">
        <div class="field-group__label">Jenis Pesanan</div>
        <div class="choice-grid choice-grid--2">
          ${ITEM_ORDER_TYPE_KEYS.map(k => { const v = ORDER_TYPES[k]; return `
            <button type="button" class="choice-card ${draft.type === k ? "is-selected" : ""}" data-custom-type="${k}">
              <span class="choice-card__icon">${ico(v.icon)}</span><span>${v.label}</span>
            </button>`; }).join("")}
        </div>
      </div>
      <label class="field">
        <span>Nama Produk</span>
        <input type="text" class="input" id="custom-name" maxlength="80" placeholder="Contoh: Baso Custom" value="${esc(draft.name)}">
      </label>
      <label class="field">
        <span>Harga</span>
        <div class="input-prefix"><span>Rp</span><input type="text" inputmode="numeric" class="input" id="custom-price" placeholder="0" value="${esc(fmtDigits(draft.price))}"></div>
      </label>
      ${withQty ? `<label class="field">
        <span>Jumlah</span>
        <div class="qty-stepper qty-stepper--form">
          <button type="button" class="qty-btn" data-qty-step="-1">−</button>
          <input type="text" inputmode="numeric" class="qty-input" id="custom-qty" value="${esc(draft.qty || "1")}">
          <button type="button" class="qty-btn" data-qty-step="1">+</button>
        </div>
      </label>` : ""}
      <button type="button" class="btn btn--primary btn--block btn--lg" id="custom-add-btn">Tambah ke Keranjang</button>
    </div>`;
  },

  cartPanel(isSheet = false) {
    const d = State.d, t = Cart.totals(this.settings);
    const idPrefix = isSheet ? "s-" : "";
    return `
      <div class="cart">
        <div class="cart__head">
          <h2>${ico("🧾")} Keranjang</h2>
          ${isSheet ? `<button type="button" class="modal__x" id="sheet-close" aria-label="Tutup">${ico("✕")}</button>` : ""}
        </div>
        <div class="cart__customer">
          <label class="field field--customer">
            <span>Nama Pelanggan *</span>
            <input type="text" class="input" id="${idPrefix}customer-name" maxlength="60" placeholder="Nama pelanggan" value="${esc(d.customerName || "")}">
          </label>
        </div>
        ${d.editingOrderId ? `
        <div class="cart-edit-banner">
          <span>${ico("✏️")} Mengubah pesanan <strong>${esc(d.editingOrderNumber || "")}</strong></span>
          <button type="button" class="btn btn--ghost btn--sm" id="${idPrefix}cancel-edit-btn">Batal</button>
        </div>` : ""}
        <div class="cart__items" id="${idPrefix}cart-items">${this.cartItemsHtml()}</div>
        <div class="cart__summary">
          ${this.settings.cashier_can_discount !== false ? `
          <div class="summary-row summary-row--discount">
            <span>Diskon</span>
            <div class="discount-input">
              <select class="input input--sm" id="${idPrefix}discount-type">
                <option value="nominal" ${d.discountType === "nominal" ? "selected" : ""}>Rp</option>
                <option value="persen" ${d.discountType === "persen" ? "selected" : ""}>%</option>
              </select>
              <input type="text" inputmode="numeric" class="input input--sm" id="${idPrefix}discount-value" placeholder="0" value="${esc(d.discountType === "persen" ? digitsOnly(d.discountValue) : fmtDigits(d.discountValue))}">
            </div>
          </div>` : ""}
          <div class="summary-row"><span>Subtotal</span><span>${rp(t.subtotal)}</span></div>
          ${t.discount > 0 ? `<div class="summary-row"><span>Diskon</span><span>-${rp(t.discount)}</span></div>` : ""}
          ${this.settings.tax_enabled ? `<div class="summary-row"><span>Pajak (${this.settings.tax_percent}%)</span><span>${rp(t.tax)}</span></div>` : ""}
          <div class="summary-row summary-row--total"><span>Total</span><span>${rp(t.total)}</span></div>
          <div class="paymethod-group">
            ${Object.entries(PAYMENT_METHODS).map(([k, m]) => `
              <button type="button" class="chip paymethod-chip ${d.paymentMethod === k ? "is-selected" : ""}" data-paymethod="${k}">${ico(m.icon)} ${m.label}</button>`).join("")}
          </div>
          <div class="summary-row">
            <span>Uang Dibayar</span>
            <div class="input-prefix input-prefix--summary"><span>Rp</span>
              <input type="text" inputmode="numeric" class="input" id="${idPrefix}payment-input" placeholder="0" value="${esc(fmtDigits(d.payment))}" ${d.paymentMethod === "qris" ? "readonly" : ""}>
            </div>
          </div>
          ${d.paymentMethod === "tunai" ? `
          <div class="quick-cash" id="${idPrefix}quick-cash">
            ${this.quickCashOptions(t.total).map(v => `<button type="button" class="chip" data-quick-cash="${v}">${v === t.total ? "Uang Pas" : rp(v)}</button>`).join("")}
          </div>
          <div class="summary-row summary-row--change ${t.change < 0 ? "is-negative" : ""}">
            <span>Kembalian</span><span>${t.payment > 0 ? rp(t.change) : "—"}</span>
          </div>` : `<p class="menu-section__note">QRIS: nominal bayar otomatis mengikuti total, tanpa kembalian.</p>`}
        </div>
        <div class="cart__actions">
          <button type="button" class="btn btn--ghost btn--block" id="${idPrefix}kitchen-btn">
            ${ico("🍳")} Bill Kitchen
          </button>
          <button type="button" class="btn btn--ghost btn--block" id="${idPrefix}save-btn" data-loading-text="${d.editingOrderId ? "Menyimpan perubahan…" : "Menyimpan…"}">
            ${d.editingOrderId ? `${ico("💾")} Simpan Perubahan` : `${ico("💾")} Simpan (Belum Bayar)`}
          </button>
          ${d.editingOrderId ? "" : `
          <button type="button" class="btn btn--primary btn--block btn--pay" id="${idPrefix}pay-btn" data-loading-text="Memproses…">
            ${ico("🟢")} BAYAR${t.total > 0 ? ` · ${rp(t.total)}` : ""}
          </button>`}
        </div>
      </div>`;
  },

  quickCashOptions(total) {
    if (total <= 0) return [];
    const rounds = [5000, 10000, 20000, 50000, 100000];
    const opts = new Set([total]);
    for (const r of rounds) { const v = Math.ceil(total / r) * r; if (v > total) { opts.add(v); if (opts.size >= 4) break; } }
    return Array.from(opts).sort((a, b) => a - b).slice(0, 4);
  },

  cartItemsHtml() {
    const cart = State.d.cart;
    if (!cart.length) return `<div class="cart-empty">Keranjang masih kosong.<br>Pilih menu untuk mulai transaksi.</div>`;
    const lineHtml = l => {
      const meta = [];
      if (l.condiment) meta.push(`Kondimen: ${esc(l.condiment)}${l.condiment_detail ? ` (${esc(l.condiment_detail)})` : ""}`);
      if (l.temperature) meta.push(esc(l.temperature));
      if (l.taste) meta.push(esc(l.taste));
      return `<div class="cart-item" data-line="${l.id}">
        <div class="cart-item__row">
          <span class="cart-item__name">${esc(l.name)}</span>
          <button type="button" class="cart-item__del" data-remove="${l.id}" aria-label="Hapus">${ico("🗑️", "button-ico")}</button>
        </div>
        ${meta.length ? `<div class="cart-item__meta">${meta.join(" · ")}</div>` : ""}
        <div class="cart-item__type-toggle">
          ${ITEM_ORDER_TYPE_KEYS.map(k => `<button type="button" class="chip chip--sm cart-item__type-btn ${l.orderType === k ? "is-selected" : ""}" data-line-type="${l.id}" data-type="${k}">${ico(ORDER_TYPES[k].icon)} ${ORDER_TYPES[k].label}</button>`).join("")}
        </div>
        <div class="cart-item__note-wrap">
          <input type="text" class="cart-item__note" data-note="${l.id}" placeholder="Tambah catatan…" value="${esc(l.notes || "")}" maxlength="140">
        </div>
        <div class="cart-item__row cart-item__row--bottom">
          <div class="qty-stepper">
            <button type="button" class="qty-btn" data-step="${l.id}" data-dir="-1">−</button>
            <span class="qty-val">${l.qty}</span>
            <button type="button" class="qty-btn" data-step="${l.id}" data-dir="1">+</button>
          </div>
          <span class="cart-item__subtotal">${rp(Cart.lineTotal(l))}</span>
        </div>
      </div>`;
    };
    const takeAway = cart.filter(l => l.orderType !== "dine_in");
    const dineIn = cart.filter(l => l.orderType === "dine_in");
    if (takeAway.length && dineIn.length) {
      return `
        <div class="cart-group">
          <div class="cart-group__label">${ico(ORDER_TYPES.take_away.icon)} TAKE AWAY</div>
          ${takeAway.map(lineHtml).join("")}
        </div>
        <div class="cart-group">
          <div class="cart-group__label">${ico(ORDER_TYPES.dine_in.icon)} DINE IN</div>
          ${dineIn.map(lineHtml).join("")}
        </div>`;
    }
    return cart.map(lineHtml).join("");
  },

  /* ---------- event binding ---------- */
  /** Dipanggil sekali per mount(). Menggunakan delegasi pada root, jadi tetap berfungsi
      walau isi root diganti lewat innerHTML pada render() berikutnya. */
  bindRootDelegation() {
    const root = this.root;

    root.addEventListener("click", e => {
      const otBtn = e.target.closest("[data-order-type]");
      if (otBtn) return this.setOrderType(otBtn.dataset.orderType);

      const catBtn = e.target.closest("[data-cat]");
      if (catBtn) return this.setCategory(catBtn.dataset.cat);

      const prodBtn = e.target.closest("[data-product]");
      if (prodBtn) return this.openProduct(prodBtn.dataset.product);

      const qtyStep = e.target.closest("[data-qty-step]");
      if (qtyStep) return this.stepCustomQty(Number(qtyStep.dataset.qtyStep));

      const addBtn = e.target.closest("#custom-add-btn");
      if (addBtn) return this.addCustomToCart();

      const customTypeBtn = e.target.closest("[data-custom-type]");
      if (customTypeBtn) return this.setCustomType(customTypeBtn.dataset.customType);

      if (e.target.closest("#fab-cart")) return Sheet.open();
      if (e.target.closest("#sheet-close")) return Sheet.close();
      if (e.target.closest("#cart-scrim")) return Sheet.close();
    });

    root.addEventListener("change", e => {
      if (e.target.matches("#table-no")) { State.set({ tableNo: e.target.value }); }
    });

    root.addEventListener("input", e => {
      if (e.target.matches("#custom-name")) return this.saveCustomDraft();
      if (e.target.matches("#custom-price")) {
        const el = e.target, pos = el.selectionStart, before = el.value.length;
        el.value = fmtDigits(el.value);
        const p = Math.max(0, pos + (el.value.length - before));
        el.setSelectionRange(p, p);
        this.saveCustomDraft();
        return;
      }
      if (e.target.matches("#custom-qty")) { e.target.value = digitsOnly(e.target.value); this.saveCustomDraft(); }
    });
  },

  bindCartPanel(panel) {
    if (!panel) return;
    panel.addEventListener("click", e => {
      const rm = e.target.closest("[data-remove]");
      if (rm) return this.removeLine(rm.dataset.remove);
      const lineType = e.target.closest("[data-line-type]");
      if (lineType) return this.setLineType(lineType.dataset.lineType, lineType.dataset.type);
      const step = e.target.closest("[data-step]");
      if (step) return this.stepLine(step.dataset.step, Number(step.dataset.dir));
      const qc = e.target.closest("[data-quick-cash]");
      if (qc) { State.set({ payment: String(qc.dataset.quickCash) }); return this.refreshCartAreas(); }
      const pm = e.target.closest("[data-paymethod]");
      if (pm) return this.setPaymentMethod(pm.dataset.paymethod);
      const payBtn = e.target.closest('[id$="pay-btn"]');
      if (payBtn) return this.pay(payBtn);
      const saveBtn = e.target.closest('[id$="save-btn"]');
      if (saveBtn) return this.saveUnpaid(saveBtn);
      const kitchenBtn = e.target.closest('[id$="kitchen-btn"]');
      if (kitchenBtn) return this.printKitchenBill(kitchenBtn);
      const cancelEditBtn = e.target.closest('[id$="cancel-edit-btn"]');
      if (cancelEditBtn) return this.cancelEdit();
    });
    panel.addEventListener("input", e => {
      if (e.target.matches('[id$="discount-value"]')) {
        const type = $('[id$="discount-type"]', panel)?.value || "nominal";
        e.target.value = type === "persen" ? digitsOnly(e.target.value).slice(0, 3) : fmtDigits(e.target.value);
        State.set({ discountValue: digitsOnly(e.target.value) });
        return this.refreshCartAreas();
      }
      if (e.target.matches('[id$="payment-input"]')) {
        e.target.value = fmtDigits(e.target.value);
        State.set({ payment: digitsOnly(e.target.value) });
        return this.refreshCartAreas();
      }
      if (e.target.matches("[data-note]")) {
        const line = Cart.find(e.target.dataset.note);
        if (line) { line.notes = e.target.value; State.save(); }
      }
      if (e.target.matches('[id$="customer-name"]')) {
        State.set({ customerName: e.target.value });
      }
    });
    panel.addEventListener("change", e => {
      if (e.target.matches('[id$="discount-type"]')) {
        State.set({ discountType: e.target.value });
        return this.refreshCartAreas();
      }
    });
  },

  setOrderType(type) {
    if (!ITEM_ORDER_TYPE_KEYS.includes(type)) return;
    State.set({ orderType: type });
    this.render();
  },
  setLineType(id, type) {
    if (!ITEM_ORDER_TYPE_KEYS.includes(type)) return;
    const l = Cart.find(id); if (!l) return;
    l.orderType = type;
    State.save();
    this.refreshCartAreas();
  },
  setCustomType(type) {
    if (!ITEM_ORDER_TYPE_KEYS.includes(type)) return;
    const cat = this.categories.find(c => c.id === this.activeCat);
    if (!cat) return;
    const draft = State.d.customDrafts[cat.id] || { name: "", price: "", qty: "1" };
    draft.type = type;
    State.d.customDrafts[cat.id] = draft;
    State.save();
    if ($("#product-grid", this.root)) $("#product-grid", this.root).innerHTML = this.productGrid();
  },
  setPaymentMethod(method) {
    if (!PAYMENT_METHODS[method]) return;
    const t = Cart.totals(this.settings);
    State.set({ paymentMethod: method, payment: method === "qris" ? String(t.total) : State.d.payment });
    this.refreshCartAreas();
  },
  setCategory(id) { this.activeCat = id; $("#product-grid", this.root).innerHTML = this.productGrid(); this.rebindGrid(); this.highlightCat(id); },
  highlightCat(id) { $$(".cat-chip", this.root).forEach(b => { const on = b.dataset.cat === id; b.classList.toggle("is-active", on); b.setAttribute("aria-selected", on); }); },
  rebindGrid() { /* delegasi sudah di root, tidak perlu re-bind */ },

  saveCustomDraft() {
    const cat = this.categories.find(c => c.id === this.activeCat);
    if (!cat) return;
    const name = $("#custom-name", this.root)?.value || "";
    const price = digitsOnly($("#custom-price", this.root)?.value || "");
    const qty = digitsOnly($("#custom-qty", this.root)?.value || "") || "1";
    State.d.customDrafts[cat.id] = { name, price, qty };
    State.save();
  },
  stepCustomQty(dir) {
    const el = $("#custom-qty", this.root); if (!el) return;
    const v = Math.max(1, Math.min(999, (parseInt(el.value, 10) || 1) + dir));
    el.value = String(v); this.saveCustomDraft();
  },
  addCustomToCart() {
    const cat = this.categories.find(c => c.id === this.activeCat);
    if (!cat) return;
    const name = ($("#custom-name", this.root)?.value || "").trim();
    const price = toInt($("#custom-price", this.root)?.value);
    const qty = cat.custom_mode === "name_price_qty" ? Math.max(1, toInt($("#custom-qty", this.root)?.value) || 1) : 1;
    const draft = State.d.customDrafts[cat.id] || {};
    const orderType = ITEM_ORDER_TYPE_KEYS.includes(draft.type) ? draft.type : (State.d.orderType || "dine_in");
    if (!name) { Toast.error("Masukkan nama produk."); $("#custom-name", this.root)?.focus(); return; }
    if (!price || price <= 0) { Toast.error("Masukkan harga yang valid."); $("#custom-price", this.root)?.focus(); return; }
    Cart.add({ product_id: null, name, base_price: price, qty, is_custom: true, condiment: null, condiment_detail: null, temperature: null, notes: "", orderType });
    State.d.customDrafts[cat.id] = { name: "", price: "", qty: "1", type: orderType };
    State.save();
    Toast.success(`${name} ditambahkan ke keranjang.`);
    this.render();
    if ($("#product-grid", this.root)) { $("#product-grid", this.root).innerHTML = this.productGrid(); this.highlightCat(cat.id); }
  },

  openProduct(id) {
    const p = this.products.find(x => x.id === id);
    if (!p) return;
    ProductModal.open(p, this.settings, line => {
      Cart.add(line);
      Toast.success(`${line.name} ditambahkan ke keranjang.`);
      this.render();
    }, State.d.orderType || "dine_in");
  },

  removeLine(id) {
    const removed = Cart.remove(id);
    this.render();
    if (removed) {
      Toast.show(`${removed.line.name} dihapus.`, "info", 4000);
      // Sederhana & aman: tanpa tombol undo di toast untuk menghindari state basi; hapus memang harus disengaja.
    }
  },
  stepLine(id, dir) {
    const l = Cart.find(id); if (!l) return;
    l.qty = Math.max(1, Math.min(999, l.qty + dir));
    State.save();
    this.refreshCartAreas();
  },

  refreshCartAreas() {
    this.syncQrisPayment();
    const desktop = $("#cart-panel", this.root), sheet = $("#cart-sheet", this.root);
    if (desktop) desktop.innerHTML = this.cartPanel(false);
    if (sheet) sheet.innerHTML = `<div class="cart-sheet__handle" id="sheet-handle"></div>` + this.cartPanel(true);
    const fab = $("#fab-count", this.root); if (fab) fab.textContent = Cart.count();
  },

  /** Validasi bersama sebelum transaksi disimpan (dipakai BAYAR maupun Simpan). Mengembalikan
      nama pelanggan yang sudah di-trim, atau null bila ada yang belum valid (toast sudah ditampilkan). */
  validateBeforeSubmit(d) {
    const customerName = (d.customerName || "").trim();
    if (!customerName) {
      Toast.error("Nama pelanggan wajib diisi.");
      $('[id$="customer-name"]', this.root)?.focus();
      return null;
    }
    if (!d.cart.length) { Toast.error("Keranjang masih kosong."); return null; }
    const hasDineIn = d.cart.some(l => l.orderType === "dine_in");
    if (hasDineIn && this.settings.tables_enabled && !d.tableNo) { Toast.error("Pilih nomor meja untuk pesanan Dine In."); return null; }
    return customerName;
  },

  /** Menentukan jenis pesanan ringkasan transaksi dari isi keranjang: "dine_in"/"take_away" bila
      seragam, atau "campur" bila keranjang berisi keduanya. Satu transaksi selalu tetap satu Order ID. */
  cartOrderType(cart) {
    const types = new Set(cart.map(l => l.orderType === "dine_in" ? "dine_in" : "take_away"));
    return types.size > 1 ? "campur" : ([...types][0] || "take_away");
  },

  buildOrderPayload(customerName, t, d) {
    const hasDineIn = d.cart.some(l => l.orderType === "dine_in");
    const items = d.cart.map(l => ({
      product_id: l.product_id, product_name: l.name, base_price: l.base_price, quantity: l.qty,
      condiment: l.condiment, condiment_detail: l.condiment_detail, temperature: l.temperature, taste: l.taste || null,
      notes: (l.notes || "").trim(), tetelan_quantity: 0, tetelan_price: 0,
      is_custom: !!l.is_custom, order_type: l.orderType === "dine_in" ? "dine_in" : "take_away"
    }));
    return {
      order_type: this.cartOrderType(d.cart), table_no: hasDineIn ? (d.tableNo || null) : null, customer_name: customerName, items,
      subtotal: t.subtotal, discount: t.discount, tax: t.tax, total: t.total, payment: t.payment, change: t.change,
      payment_method: PAYMENT_METHODS[d.paymentMethod] ? d.paymentMethod : "tunai",
      cashier: Auth.name(), client_txn_key: d.txnKey
    };
  },

  /** Kirim transaksi ke Supabase (lewat createOrder — selalu tersimpan dengan status awal
      Belum Bayar, lihat _ensureOrderExtras) lalu buka struk. Dipakai baik oleh BAYAR maupun Simpan
      supaya kedua tombol punya jalur penyimpanan & penanganan error yang identik. */
  async submitOrder(btn, payload, successMessage, opts = {}) {
    await withLoading(btn, async () => {
      try {
        const { order, items: savedItems } = await App.adapter.createOrder(payload, opts);
        Toast.success(successMessage(order));
        State.reset();
        ReceiptModal.open(order, savedItems, this.settings, null, !!opts.simplifiedReceipt);
        this.render();
      } catch (e) {
        console.error(e);
        if (isNetworkError(e)) Toast.error("Internet terputus. Transaksi belum tersimpan — coba lagi setelah koneksi normal.");
        else Toast.error(friendlyError(e));
        // Data input kasir TIDAK dihapus: State tidak direset agar bisa dicoba lagi (client_txn_key tetap sama, aman dari duplikasi).
      }
    });
  },

  /** Simpan hasil "Ubah Menu Pesanan" ke transaksi Belum Bayar yang sama (lewat
      updateOrderItems — Order ID/order_number sama, tidak pernah membuat transaksi baru). */
  async submitOrderUpdate(btn, orderId, payload, successMessage) {
    await withLoading(btn, async () => {
      try {
        const { order, items: savedItems } = await App.adapter.updateOrderItems(orderId, payload);
        Toast.success(successMessage(order));
        State.reset();
        ReceiptModal.open(order, savedItems, this.settings, null, true);
        this.render();
      } catch (e) {
        console.error(e);
        if (isNetworkError(e)) Toast.error("Internet terputus. Perubahan belum tersimpan — coba lagi setelah koneksi normal.");
        else Toast.error(friendlyError(e));
        // State tidak direset agar perubahan yang sudah diketik kasir tidak hilang; bisa dicoba lagi.
      }
    });
  },


  /** Membuka kembali pesanan Belum Bayar untuk diedit ("Ubah Menu Pesanan"): isi keranjang kasir
      diganti dengan item transaksi ini, dan State.d.editingOrderId ditandai supaya tombol
      "Simpan" berubah menjadi "Simpan Perubahan" dan memperbarui Order ID yang sama (bukan
      membuat transaksi baru). Dipanggil dari OrderActions (tombol "Ubah Menu Pesanan" pada
      struk/riwayat), lalu App.navigate("kasir") membuka halaman ini dengan draft yang sudah diisi. */
  startEditOrder(order, items) {
    const cart = (items || []).map(it => ({
      id: uid(),
      product_id: it.product_id || null,
      name: it.product_name,
      base_price: it.base_price,
      qty: it.quantity,
      is_custom: !it.product_id,
      condiment: it.condiment || null,
      condiment_detail: it.condiment_detail || null,
      temperature: it.temperature || null,
      taste: it.taste || null,
      notes: it.notes || "",
      orderType: it.order_type === "dine_in" ? "dine_in" : "take_away"
    }));
    const customDrafts = (State.d && State.d.customDrafts) || {};
    State.d = {
      ...State.fresh(),
      customDrafts,
      orderType: order.order_type === "dine_in" ? "dine_in" : "take_away",
      tableNo: order.table_no || "",
      customerName: order.customer_name || "",
      cart,
      discountType: "nominal",
      discountValue: order.discount ? String(order.discount) : "",
      paymentMethod: PAYMENT_METHODS[order.payment_method] ? order.payment_method : "tunai",
      payment: String(order.payment || 0),
      editingOrderId: order.id,
      editingOrderNumber: order.order_number
    };
    State.save();
  },

  /** Membuka transaksi Belum Bayar untuk proses pembayaran tanpa membuat transaksi baru. */
  startPayOrder(order, items) {
    const cart = (items || []).map(it => ({
      id: uid(), product_id: it.product_id || null, name: it.product_name, base_price: it.base_price,
      qty: it.quantity, is_custom: !it.product_id, condiment: it.condiment || null,
      condiment_detail: it.condiment_detail || null, temperature: it.temperature || null,
      taste: it.taste || null, notes: it.notes || "", orderType: it.order_type === "dine_in" ? "dine_in" : "take_away"
    }));
    const customDrafts = (State.d && State.d.customDrafts) || {};
    State.d = {
      ...State.fresh(), customDrafts,
      orderType: order.order_type === "dine_in" ? "dine_in" : "take_away",
      tableNo: order.table_no || "", customerName: order.customer_name || "", cart,
      discountType: "nominal", discountValue: order.discount ? String(order.discount) : "",
      paymentMethod: PAYMENT_METHODS[order.payment_method] ? order.payment_method : "tunai",
      payment: String(order.payment || 0), payExistingOrderId: order.id
    };
    State.save();
  },

  /** Batalkan mode "Ubah Menu Pesanan" tanpa menyimpan apa pun: kembali ke keranjang kosong
      seperti transaksi baru biasa. Perubahan yang belum ditekan "Simpan Perubahan" tidak
      pernah tersimpan ke Supabase, jadi transaksi aslinya di database tidak berubah. */
  cancelEdit() {
    State.reset();
    Toast.show("Perubahan menu pesanan dibatalkan.", "info", 3000);
    this.render();
  },

  /** Tombol "Bill Kitchen": cetak Bill Dapur langsung dari isi keranjang yang sedang dipilih,
      tanpa mengirim apa pun ke Supabase dan tanpa membuat transaksi, dan tanpa mengosongkan
      keranjang setelah cetak. Tidak mensyaratkan uang dibayar — hanya jenis pesanan (dan nomor
      meja bila Dine In) serta keranjang tidak kosong, sama seperti kondisi minimum sebelum
      "pesanan masuk ke keranjang". Isi keranjang, kondimen, dan nama pelanggan yang tampil selalu
      data terbaru dari State (tidak perlu diisi ulang). Sebelum mencetak, PrinterGate.ensure
      memeriksa koneksi printer (lihat PrinterGate) — bila belum terhubung, kasir bisa langsung
      menghubungkan dari sana (gestur klik pada modal ini tetap dianggap gestur pengguna oleh Web
      Bluetooth) atau melanjutkan tanpa cetak setelah verifikasi PIN. */
  async printKitchenBill(btn) {
    const d = State.d;
    if (!d.cart.length) { Toast.error("Keranjang masih kosong."); return; }
    const hasDineIn = d.cart.some(l => l.orderType === "dine_in");
    if (hasDineIn && this.settings.tables_enabled && !d.tableNo) { Toast.error("Pilih nomor meja untuk pesanan Dine In."); return; }

    const gate = await PrinterGate.ensure("Bill Kitchen");
    if (!gate.proceed) return;

    const previewOrder = {
      order_number: d.editingOrderId ? d.editingOrderNumber : "PRATINJAU", order_type: this.cartOrderType(d.cart), table_no: hasDineIn ? (d.tableNo || null) : null,
      customer_name: (d.customerName || "").trim(), created_at: new Date().toISOString()
    };
    const previewItems = d.cart.map(l => ({
      product_name: l.name, base_price: l.base_price, quantity: l.qty,
      condiment: l.condiment || null, condiment_detail: l.condiment_detail || null,
      temperature: l.temperature || null, taste: l.taste || null, notes: (l.notes || "").trim(),
      order_type: l.orderType === "dine_in" ? "dine_in" : "take_away"
    }));
    await withLoading(btn, async () => {
      if (gate.skipPrint) {
        // PIN pelewatan sudah diverifikasi oleh PrinterGate — jangan kirim perintah print sama sekali.
        Toast.info("Bill Kitchen diproses tanpa mencetak (printer tidak terhubung).");
        return;
      }
      await KitchenBill.print(previewOrder, previewItems, this.settings);
    });
  },

  async pay(btn) {
    const t = Cart.totals(this.settings);
    const d = State.d;
    const customerName = this.validateBeforeSubmit(d);
    if (!customerName) return;
    if (t.payment < t.total) { Toast.error(`Uang dibayar kurang ${rp(t.total - t.payment)}.`); return; }

    if (d.payExistingOrderId) {
      // Printer diperiksa SEBELUM aktivitas pembayaran dilanjutkan (lihat PrinterGate), tapi hanya
      // relevan bila toko memang memakai printer Bluetooth aplikasi DAN percetakan otomatis
      // (Bill Pembayaran/Bill Dapur) sedang aktif — kalau tidak, tidak ada yang akan dicetak
      // sehingga tidak perlu ada gerbang sama sekali.
      let skipPrint = false;
      if (PrinterGate.isEnabled() && (Device.get("autoprint") || Device.get("autoprint_dapur"))) {
        const gate = await PrinterGate.ensure("Bayar / Lunas");
        if (!gate.proceed) return;
        skipPrint = gate.skipPrint;
      }
      await withLoading(btn, async () => {
        try {
          const updated = await App.adapter.completeExistingPayment(d.payExistingOrderId, t.payment, t.change, d.paymentMethod, Auth.name());
          // Verifikasi ulang dari database sebelum meninggalkan halaman pembayaran.
          const saved = await App.adapter.getOrder(d.payExistingOrderId);
          if (!saved || (saved.payment_status || "belum_bayar") !== "telah_bayar") {
            throw new Error("Pembayaran belum terverifikasi tersimpan di database.");
          }
          Toast.success(`Transaksi ${saved.order_number || updated?.order_number || ""} sudah dibayar.`);
          // Cetak Bill Pembayaran (dan Bill Dapur bila diaktifkan) otomatis ke printer yang sudah
          // terhubung — HANYA setelah status di database benar-benar "telah_bayar" di atas, tanpa
          // membuka popup struk sama sekali (lihat KasirPage.autoPrintAfterPayment). Kegagalan cetak
          // tidak boleh menghentikan alur kembali ke Pesanan / membatalkan pembayaran yang sudah tersimpan.
          await this.autoPrintAfterPayment(saved, { skipPrint });
          State.reset();
          // Jangan membuka popup struk setelah pembayaran dari Transaksi Tersimpan.
          // Langsung kembali ke Pesanan agar daftar diambil ulang dari database.
          await App.navigate("pesanan");
        } catch (e) {
          console.error(e);
          Toast.error(isNetworkError(e) ? "Internet terputus. Pembayaran belum tersimpan — coba lagi." : friendlyError(e));
        }
      });
      return;
    }

    const payload = this.buildOrderPayload(customerName, t, d);
    await this.submitOrder(btn, payload, order => `Transaksi ${order.order_number} tersimpan.`);
  },

  /** Cetak otomatis Bill Pembayaran (struk) + Bill Dapur (opsional) ke printer yang sudah
      terhubung, khusus untuk alur Bayar/Lunas dari Pesanan/Transaksi Tersimpan yang TIDAK
      membuka popup struk (lihat KasirPage.pay). Menghormati pengaturan "Cetak Otomatis Setelah
      Bayar" yang sama dengan yang dipakai ReceiptModal untuk transaksi baru (Device.get
      "autoprint" & "autoprint_dapur"). Hanya dipanggil SETELAH pemanggil memverifikasi status
      pembayaran di database sudah "telah_bayar" — tidak pernah mencetak sebelum itu.
      opts.skipPrint: true bila PrinterGate sudah memverifikasi PIN pelewatan printer — dalam hal
      ini JANGAN kirim perintah print sama sekali (bukan "print gagal", tapi memang sengaja tidak
      mencoba mencetak, sesuai aturan "jangan ada print palsu").
      Tidak pernah membuka popup preview/struk maupun window.print() dialog cetak browser bila
      printer Bluetooth sudah tersambung (lihat Receipt.print & KitchenBill.print); gagal cetak
      tidak boleh membatalkan pembayaran yang sudah tersimpan atau menghentikan navigasi kembali. */
  async autoPrintAfterPayment(order, opts = {}) {
    if (opts.skipPrint) return;
    if (!Device.get("autoprint") && !Device.get("autoprint_dapur")) return;
    let items = [];
    try { items = await App.adapter.getOrderItems(order.id); }
    catch (e) { console.warn("Gagal mengambil item transaksi untuk cetak otomatis.", e); return; }
    if (Device.get("autoprint")) {
      try { await Receipt.print(order, items, this.settings); }
      catch (e) { console.warn("Gagal mencetak Bill Pembayaran otomatis.", e); }
      // Catatan: Receipt.print sudah menangani sendiri kasus cutFailed (bill tetap tercetak,
      // hanya potong otomatis yang gagal) lewat Toast.info — tidak dianggap error di sini.
    }
    if (Device.get("autoprint_dapur")) {
      try { await KitchenBill.print(order, items, this.settings); }
      catch (e) { console.warn("Gagal mencetak Bill Dapur otomatis.", e); }
    }
  },

  /** Tombol "Simpan": simpan transaksi walau belum dibayar (penuh/sebagian/sama sekali belum).
      Tidak ada syarat "Uang Dibayar" mencukupi — transaksi otomatis masuk kategori Belum Bayar
      (status awal default di adapter), dan baru pindah ke Sudah Bayar lewat tombol Telah Bayar/
      Bayar-Lunas di struk setelah ini. Uang yang sudah sempat diisi kasir tetap dicatat, tapi
      dibatasi maksimal sebesar total (tidak pernah tercatat "kembalian" untuk transaksi yang
      belum lunas). Saat sedang dalam mode "Ubah Menu Pesanan" (State.d.editingOrderId terisi),
      tombol yang sama ini menjadi "Simpan Perubahan" dan memperbarui transaksi Belum Bayar yang
      sama lewat updateOrderItems, alih-alih membuat transaksi baru. */
  async saveUnpaid(btn) {
    const t = Cart.totals(this.settings);
    const d = State.d;
    const customerName = this.validateBeforeSubmit(d);
    if (!customerName) return;

    const payload = this.buildOrderPayload(customerName, t, d);
    payload.payment = Math.max(0, Math.min(t.payment, t.total));
    payload.change = 0;
    if (d.editingOrderId) {
      await this.submitOrderUpdate(btn, d.editingOrderId, payload, order => `Transaksi ${order.order_number} diperbarui · Belum Bayar.`);
    } else {
      await this.submitOrder(btn, payload, order => `Transaksi ${order.order_number} disimpan · Belum Bayar.`, { requireFullPayment: false, simplifiedReceipt: true });
    }
  }
};

/* ---------- Modal pemilihan kondimen / es-hangat ---------- */
const ProductModal = {
  open(product, settings, onAdd, defaultType) {
    const availableCondiments = product.condiment_options && product.condiment_options.length
      ? CONDIMENTS.filter(c => product.condiment_options.includes(c.key))
      : CONDIMENTS;
    const st = { condiments: [], temperature: null, taste: null, qty: 1, notes: "", orderType: ITEM_ORDER_TYPE_KEYS.includes(defaultType) ? defaultType : "dine_in" };

    const body = document.createElement("div");
    body.className = "product-modal";
    const render = () => {
      body.innerHTML = `
        ${product.description ? `<p class="product-modal__desc">${esc(product.description)}</p>` : ""}
        <div class="product-modal__price">${rp(product.price)}</div>

        <div class="field-group">
          <div class="field-group__label">Jenis Pesanan</div>
          <div class="choice-grid choice-grid--2">
            ${ITEM_ORDER_TYPE_KEYS.map(k => { const v = ORDER_TYPES[k]; return `
              <button type="button" class="choice-card ${st.orderType === k ? "is-selected" : ""}" data-item-order-type="${k}">
                <span class="choice-card__icon">${ico(v.icon)}</span><span>${v.label}</span>
              </button>`; }).join("")}
          </div>
        </div>

        ${product.requires_condiment ? `
        <div class="field-group">
          <div class="field-group__label">Pilih Kondimen <span class="field-group__hint">(bisa lebih dari satu)</span></div>
          <div class="choice-grid">
            ${availableCondiments.map(c => `
              <button type="button" class="choice-card ${st.condiments.includes(c.key) ? "is-selected" : ""}" data-condiment="${esc(c.key)}">
                <span class="choice-card__icon">${ico(c.icon)}</span><span>${esc(c.key)}</span>
              </button>`).join("")}
          </div>
        </div>` : ""}

        ${product.allow_ice_option ? `
        <div class="field-group">
          <div class="field-group__label">Es / Hangat</div>
          <div class="choice-grid choice-grid--2">
            ${TEMPS.map(t => `
              <button type="button" class="choice-card ${st.temperature === t.key ? "is-selected" : ""}" data-temp="${esc(t.key)}">
                <span class="choice-card__icon">${ico(t.icon)}</span><span>${esc(t.key)}</span>
              </button>`).join("")}
          </div>
        </div>` : ""}

        ${product.allow_taste_option ? `
        <div class="field-group">
          <div class="field-group__label">Asin / Manis</div>
          <div class="choice-grid choice-grid--2">
            ${TASTES.map(t => `
              <button type="button" class="choice-card ${st.taste === t.key ? "is-selected" : ""}" data-taste="${esc(t.key)}">
                <span class="choice-card__icon">${ico(t.icon)}</span><span>${esc(t.key)}</span>
              </button>`).join("")}
          </div>
        </div>` : ""}

        <div class="field-group">
          <div class="field-group__label">Jumlah</div>
          <div class="qty-stepper qty-stepper--form">
            <button type="button" class="qty-btn" id="pm-qty-minus">−</button>
            <span class="qty-val qty-val--lg">${st.qty}</span>
            <button type="button" class="qty-btn" id="pm-qty-plus">+</button>
          </div>
        </div>

        <label class="field">
          <span>Catatan (opsional)</span>
          <textarea class="input" id="pm-notes" rows="2" maxlength="140" placeholder="Contoh: jangan terlalu pedas">${esc(st.notes)}</textarea>
        </label>`;

      $$("[data-condiment]", body).forEach(b => b.addEventListener("click", () => {
        const v = b.dataset.condiment;
        if (EXCLUSIVE_CONDIMENTS.includes(v)) {
          // "Baso Aja" / "Campur" berdiri sendiri: pilih/batalkan, tanpa kombinasi lain.
          st.condiments = st.condiments.includes(v) ? [] : [v];
        } else if (st.condiments.includes(v)) {
          st.condiments = st.condiments.filter(x => x !== v);
        } else {
          st.condiments = [...st.condiments.filter(x => !EXCLUSIVE_CONDIMENTS.includes(x)), v];
        }
        render();
      }));
      $$("[data-item-order-type]", body).forEach(b => b.addEventListener("click", () => { st.orderType = b.dataset.itemOrderType; render(); }));
      $$("[data-temp]", body).forEach(b => b.addEventListener("click", () => { st.temperature = b.dataset.temp; render(); }));
      $$("[data-taste]", body).forEach(b => b.addEventListener("click", () => { st.taste = b.dataset.taste; render(); }));
      $("#pm-qty-minus", body)?.addEventListener("click", () => { st.qty = Math.max(1, st.qty - 1); render(); });
      $("#pm-qty-plus", body)?.addEventListener("click", () => { st.qty = Math.min(999, st.qty + 1); render(); });
      $("#pm-notes", body)?.addEventListener("input", e => { st.notes = e.target.value; });
    };
    render();

    const overlay = Modal.open({
      title: `${esc(product.name)}`, body, size: "md",
      footer: `<button type="button" class="btn btn--primary btn--block btn--lg" id="pm-add">Tambah ke Keranjang</button>`
    });

    $("#pm-add", overlay).addEventListener("click", () => {
      if (product.requires_condiment && !st.condiments.length) { Toast.error("Pilih kondimen terlebih dahulu."); return; }
      if (product.allow_ice_option && !st.temperature) { Toast.error("Pilih Es atau Hangat."); return; }
      if (product.allow_taste_option && !st.taste) { Toast.error("Pilih Asin atau Manis."); return; }
      onAdd({
        product_id: product.id, name: product.name, base_price: product.price, qty: st.qty,
        condiment: st.condiments.length ? st.condiments.join(", ") : null, condiment_detail: null,
        temperature: st.temperature, taste: st.taste,
        notes: st.notes.trim(), is_custom: false, orderType: st.orderType
      });
      Modal.close(overlay);
    });
  }
};

/* ---------- Modal struk setelah pembayaran ---------- */
const ReceiptModal = {
  /** simplified=true dipakai khusus untuk popup yang langsung muncul setelah kasir menekan
      "Simpan (Belum Bayar)" atau "Simpan Perubahan" di halaman Kasir (judul "🧾 Transaksi
      Disimpan"): popup ini menampilkan struk dan tiga aksi ringkas: "Ubah", "Bayar", dan
      "Refund". "Ubah" tidak meminta PIN; "Bayar" membuka kembali transaksi untuk proses
      pembayaran tanpa membuat transaksi baru; "Refund" tetap meminta PIN. Arsip, cetak, PDF,
      dan spill tetap tersedia pada tampilan transaksi lengkap di halaman Pesanan/Riwayat. */
  open(order, items, settings, onChange, simplified = false) {
    const body = document.createElement("div");
    const titleFor = o => o.payment_status === "belum_bayar" ? `${ico("🧾")} Transaksi Disimpan` : `${ico("✅")} Pembayaran Berhasil`;
    const renderBody = () => {
      if (simplified) {
        body.innerHTML = Receipt.htmlFor(order, items, settings) + `
          <div class="receipt-actions order-actions" style="margin-top:12px">
            <button type="button" class="btn btn--ghost" id="rc-edit">${ico("✏️")} Ubah</button>
            <button type="button" class="btn btn--primary" id="rc-pay">${ico("💳")} Bayar</button>
            <button type="button" class="btn btn--danger" id="rc-refund">${ico("↩️")} Refund</button>
          </div>`;
        return;
      }
      body.innerHTML = `<div class="order-actions-head">${OrderActions.badgeHtml(order)}</div>` + Receipt.htmlFor(order, items, settings) + OrderActions.buttonsHtml(order);
      OrderActions.bind(body, order, items, (updated, action) => {
        renderBody();
        const titleEl = $(".modal__title", overlay);
        if (titleEl) titleEl.textContent = titleFor(updated);
        if (action === "paid") Toast.success(`Transaksi ${updated.order_number} Sudah Bayar.`);
        onChange && onChange(updated);
      });
    };
    renderBody();
    const overlay = Modal.open({
      title: titleFor(order),
      body, size: "sm", dismissible: true,
      footer: ``
    });
    if (simplified) {
      $("#rc-edit", body).addEventListener("click", () => {
        KasirPage.startEditOrder(order, items || []);
        Modal.close(overlay);
        App.navigate("kasir");
      });
      $("#rc-pay", body).addEventListener("click", () => {
        if ((order.payment_status || "belum_bayar") !== "belum_bayar") { Toast.show("Transaksi ini bukan Belum Bayar.", "info"); return; }
        KasirPage.startPayOrder(order, items || []);
        Modal.close(overlay);
        App.navigate("kasir");
      });
      $("#rc-refund", body).addEventListener("click", async () => {
        if ((order.payment_status || "belum_bayar") === "refund") return;
        const ok = await Modal.confirm({ title: "Konfirmasi Refund", message: `Proses refund untuk transaksi ${order.order_number}? Transaksi tidak akan dihapus, hanya statusnya berubah.`, okText: "Lanjutkan", danger: true });
        if (!ok) return;
        const pinOk = await Modal.promptActionPin("Masukkan PIN untuk konfirmasi refund.");
        if (!pinOk) return;
        try {
          const updated = await App.adapter.refundOrder(order.id, Auth.name());
          Object.assign(order, updated || {});
          Toast.success("Transaksi berhasil di-refund.");
          renderBody();
          onChange && onChange(order);
        } catch (e) { Toast.error(friendlyError(e)); }
      });
    } else {
      // Popup detail transaksi hanya menampilkan aksi Ubah Menu Pesanan, Bayar / Lunas, dan Refund.
    }
    // CATATAN ATURAN PRINT: modal ini dipakai untuk 3 skenario berbeda — Simpan/Belum Bayar,
    // Simpan Perubahan, dan sekadar membuka/melihat transaksi dari Pesanan/Riwayat — dan TIDAK
    // SATU PUN dari ketiganya boleh mencetak apa pun secara otomatis. Satu-satunya aktivitas yang
    // boleh mencetak otomatis adalah Bill Kitchen (KasirPage.printKitchenBill) dan Bill Pembayaran
    // setelah pembayaran BENAR-BENAR berhasil tersimpan (KasirPage.autoPrintAfterPayment, dipanggil
    // langsung dari KasirPage.pay setelah status terverifikasi "telah_bayar" — tanpa membuka modal
    // ini sama sekali). Karena itu, modal ini sengaja TIDAK memicu print dalam bentuk apa pun.
  }
};
