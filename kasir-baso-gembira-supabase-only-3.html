      if (String(t.total) !== State.d.payment) State.set({ payment: String(t.total) });
    }
  },
  render() {
    this.syncQrisPayment();
    const d = State.d;
    this.root.innerHTML = `
      <div class="kasir">
        <div class="kasir__main">
          ${this.orderTypeBar(d)}
          ${this.categoryBar()}
          <div class="kasir__grid" id="product-grid">${this.productGrid()}</div>
        </div>
        <aside class="kasir__cart kasir__cart--desktop" id="cart-panel">${this.cartPanel()}</aside>
      </div>
      <div class="cart-scrim" id="cart-scrim"></div>
      <div class="cart-sheet" id="cart-sheet">
        <div class="cart-sheet__handle" id="sheet-handle"></div>
        ${this.cartPanel(true)}
      </div>
      <button type="button" class="fab-cart" id="fab-cart" aria-label="Buka keranjang">
        🛒 <span class="fab-cart__count" id="fab-count">${Cart.count()}</span>
      </button>`;
    // Panel keranjang dibuat ulang setiap render() penuh, jadi listener panel di-bind ulang di sini.
    // Delegasi klik tingkat-root di-bind sekali saja lewat bindRootDelegation() (dipanggil dari mount()).
    this.bindCartPanel($("#cart-panel", this.root));
    this.bindCartPanel($("#cart-sheet", this.root));
  },

  orderTypeBar(d) {
    const tableField = d.orderType === "dine_in" && this.settings.tables_enabled ? `
      <div class="order-table">
        <label for="table-no">Nomor Meja</label>
        <select id="table-no" class="input">
          <option value="">Pilih meja…</option>
          ${Array.from({ length: this.settings.table_count || 20 }, (_, i) => i + 1)
            .map(n => `<option value="${n}" ${d.tableNo == n ? "selected" : ""}>Meja ${n}</option>`).join("")}
        </select>
      </div>` : "";
    return `
      <div class="order-type">
        ${Object.entries(ORDER_TYPES).map(([k, v]) => `
          <button type="button" class="order-type__btn ${d.orderType === k ? "is-active" : ""}" data-order-type="${k}">
            <span class="order-type__icon">${v.icon}</span><span>${v.label}</span>
          </button>`).join("")}
        ${tableField}
      </div>`;
  },

  categoryBar() {
    return `<div class="cat-bar" role="tablist">
      ${this.categories.map(c => `
        <button type="button" class="cat-chip ${c.id === this.activeCat ? "is-active" : ""}" data-cat="${c.id}" role="tab" aria-selected="${c.id === this.activeCat}">
          <span>${esc(c.icon || "🍽️")}</span><span>${esc(c.name)}</span>
        </button>`).join("")}
    </div>`;
  },

  productGrid() {
    const cat = this.categories.find(c => c.id === this.activeCat);
    if (!cat) return `<div class="empty-state">Belum ada kategori aktif.</div>`;
    if (cat.custom_mode && cat.custom_mode !== "none") return this.customForm(cat);
    const items = this.products.filter(p => p.category_id === cat.id && p.active !== false);
    if (!items.length) return `<div class="empty-state">Belum ada menu di kategori ini.</div>`;
    return `<div class="prod-grid">${items.map(p => `
      <button type="button" class="prod-card" data-product="${p.id}">
        <span class="prod-card__name">${esc(p.name)}</span>
        ${p.description ? `<span class="prod-card__desc">${esc(p.description)}</span>` : ""}
        <span class="prod-card__price">${rp(p.price)}</span>
      </button>`).join("")}</div>`;
  },

  customForm(cat) {
    const draft = State.d.customDrafts[cat.id] || { name: "", price: "", qty: "1" };
    const withQty = cat.custom_mode === "name_price_qty";
    return `<div class="custom-form" data-cat-id="${cat.id}">
      <div class="custom-form__title">${esc(cat.icon || "🍽️")} ${esc(cat.name)} — Custom</div>
      <label class="field">
        <span>Nama Produk</span>
        <input type="text" class="input" id="custom-name" maxlength="80" placeholder="Contoh: Baso Custom" value="${esc(draft.name)}">
      </label>
      <label class="field">
        <span>Harga</span>
        <div class="input-prefix"><span>Rp</span><input type="text" inputmode="numeric" class="input" id="custom-price" placeholder="0" value="${esc(fmtDigits(draft.price))}"></div>
      </label>
      ${withQty ? `<label class="field">
        <span>Jumlah</span>
        <div class="qty-stepper qty-stepper--form">
          <button type="button" class="qty-btn" data-qty-step="-1">−</button>
          <input type="text" inputmode="numeric" class="qty-input" id="custom-qty" value="${esc(draft.qty || "1")}">
          <button type="button" class="qty-btn" data-qty-step="1">+</button>
        </div>
      </label>` : ""}
      <button type="button" class="btn btn--primary btn--block btn--lg" id="custom-add-btn">Tambah ke Keranjang</button>
    </div>`;
  },

  cartPanel(isSheet = false) {
    const d = State.d, t = Cart.totals(this.settings);
    const idPrefix = isSheet ? "s-" : "";
    return `
      <div class="cart">
        <div class="cart__head">
          <h2>🧾 Keranjang</h2>
          ${isSheet ? `<button type="button" class="modal__x" id="sheet-close" aria-label="Tutup">✕</button>` : ""}
        </div>
        <div class="cart__items" id="${idPrefix}cart-items">${this.cartItemsHtml()}</div>
        <div class="cart__summary">
          ${this.settings.cashier_can_discount !== false ? `
          <div class="summary-row summary-row--discount">
            <span>Diskon</span>
            <div class="discount-input">
              <select class="input input--sm" id="${idPrefix}discount-type">
                <option value="nominal" ${d.discountType === "nominal" ? "selected" : ""}>Rp</option>
                <option value="persen" ${d.discountType === "persen" ? "selected" : ""}>%</option>
              </select>
              <input type="text" inputmode="numeric" class="input input--sm" id="${idPrefix}discount-value" placeholder="0" value="${esc(d.discountType === "persen" ? digitsOnly(d.discountValue) : fmtDigits(d.discountValue))}">
            </div>
          </div>` : ""}
          <div class="summary-row"><span>Subtotal</span><span>${rp(t.subtotal)}</span></div>
          ${t.discount > 0 ? `<div class="summary-row"><span>Diskon</span><span>-${rp(t.discount)}</span></div>` : ""}
          ${this.settings.tax_enabled ? `<div class="summary-row"><span>Pajak (${this.settings.tax_percent}%)</span><span>${rp(t.tax)}</span></div>` : ""}
          <div class="summary-row summary-row--total"><span>Total</span><span>${rp(t.total)}</span></div>
          <div class="paymethod-group">
            ${Object.entries(PAYMENT_METHODS).map(([k, m]) => `
              <button type="button" class="chip paymethod-chip ${d.paymentMethod === k ? "is-selected" : ""}" data-paymethod="${k}">${m.icon} ${m.label}</button>`).join("")}
          </div>
          <div class="summary-row">
            <span>Uang Dibayar</span>
            <div class="input-prefix input-prefix--summary"><span>Rp</span>
              <input type="text" inputmode="numeric" class="input" id="${idPrefix}payment-input" placeholder="0" value="${esc(fmtDigits(d.payment))}" ${d.paymentMethod === "qris" ? "readonly" : ""}>
            </div>
          </div>
          ${d.paymentMethod === "tunai" ? `
          <div class="quick-cash" id="${idPrefix}quick-cash">
            ${this.quickCashOptions(t.total).map(v => `<button type="button" class="chip" data-quick-cash="${v}">${v === t.total ? "Uang Pas" : rp(v)}</button>`).join("")}
          </div>
          <div class="summary-row summary-row--change ${t.change < 0 ? "is-negative" : ""}">
            <span>Kembalian</span><span>${t.payment > 0 ? rp(t.change) : "—"}</span>
          </div>` : `<p class="menu-section__note">QRIS: nominal bayar otomatis mengikuti total, tanpa kembalian.</p>`}
        </div>
        <button type="button" class="btn btn--primary btn--block btn--pay" id="${idPrefix}pay-btn" data-loading-text="Memproses…">
          🟢 BAYAR${t.total > 0 ? ` · ${rp(t.total)}` : ""}
        </button>
      </div>`;
  },

  quickCashOptions(total) {
    if (total <= 0) return [];
    const rounds = [5000, 10000, 20000, 50000, 100000];
    const opts = new Set([total]);
    for (const r of rounds) { const v = Math.ceil(total / r) * r; if (v > total) { opts.add(v); if (opts.size >= 4) break; } }
    return Array.from(opts).sort((a, b) => a - b).slice(0, 4);
  },

  cartItemsHtml() {
    const cart = State.d.cart;
    if (!cart.length) return `<div class="cart-empty">Keranjang masih kosong.<br>Pilih menu untuk mulai transaksi.</div>`;
    return cart.map(l => {
      const meta = [];
      if (l.condiment) meta.push(`Kondimen: ${esc(l.condiment)}${l.condiment_detail ? ` (${esc(l.condiment_detail)})` : ""}`);
      if (l.temperature) meta.push(esc(l.temperature));
      if (l.taste) meta.push(esc(l.taste));
      return `<div class="cart-item" data-line="${l.id}">
        <div class="cart-item__row">
          <span class="cart-item__name">${esc(l.name)}</span>
          <button type="button" class="cart-item__del" data-remove="${l.id}" aria-label="Hapus">🗑️</button>
        </div>
        ${meta.length ? `<div class="cart-item__meta">${meta.join(" · ")}</div>` : ""}
        <div class="cart-item__note-wrap">
          <input type="text" class="cart-item__note" data-note="${l.id}" placeholder="Tambah catatan…" value="${esc(l.notes || "")}" maxlength="140">
        </div>
        <div class="cart-item__row cart-item__row--bottom">
          <div class="qty-stepper">
            <button type="button" class="qty-btn" data-step="${l.id}" data-dir="-1">−</button>
            <span class="qty-val">${l.qty}</span>
            <button type="button" class="qty-btn" data-step="${l.id}" data-dir="1">+</button>
          </div>
          <span class="cart-item__subtotal">${rp(Cart.lineTotal(l))}</span>
        </div>
      </div>`;
    }).join("");
  },

  /* ---------- event binding ---------- */
  /** Dipanggil sekali per mount(). Menggunakan delegasi pada root, jadi tetap berfungsi
      walau isi root diganti lewat innerHTML pada render() berikutnya. */
  bindRootDelegation() {
    const root = this.root;

    root.addEventListener("click", e => {
      const otBtn = e.target.closest("[data-order-type]");
      if (otBtn) return this.setOrderType(otBtn.dataset.orderType);

      const catBtn = e.target.closest("[data-cat]");
      if (catBtn) return this.setCategory(catBtn.dataset.cat);

      const prodBtn = e.target.closest("[data-product]");
      if (prodBtn) return this.openProduct(prodBtn.dataset.product);

      const qtyStep = e.target.closest("[data-qty-step]");
      if (qtyStep) return this.stepCustomQty(Number(qtyStep.dataset.qtyStep));

      const addBtn = e.target.closest("#custom-add-btn");
      if (addBtn) return this.addCustomToCart();

      if (e.target.closest("#fab-cart")) return Sheet.open();
      if (e.target.closest("#sheet-close")) return Sheet.close();
      if (e.target.closest("#cart-scrim")) return Sheet.close();
    });

    root.addEventListener("change", e => {
      if (e.target.matches("#table-no")) { State.set({ tableNo: e.target.value }); }
    });

    root.addEventListener("input", e => {
      if (e.target.matches("#custom-name")) return this.saveCustomDraft();
      if (e.target.matches("#custom-price")) {
        const el = e.target, pos = el.selectionStart, before = el.value.length;
        el.value = fmtDigits(el.value);
        const p = Math.max(0, pos + (el.value.length - before));
        el.setSelectionRange(p, p);
        this.saveCustomDraft();
        return;
      }
      if (e.target.matches("#custom-qty")) { e.target.value = digitsOnly(e.target.value); this.saveCustomDraft(); }
    });
  },

  bindCartPanel(panel) {
    if (!panel) return;
    panel.addEventListener("click", e => {
      const rm = e.target.closest("[data-remove]");
      if (rm) return this.removeLine(rm.dataset.remove);
      const step = e.target.closest("[data-step]");
      if (step) return this.stepLine(step.dataset.step, Number(step.dataset.dir));
      const qc = e.target.closest("[data-quick-cash]");
      if (qc) { State.set({ payment: String(qc.dataset.quickCash) }); return this.refreshCartAreas(); }
      const pm = e.target.closest("[data-paymethod]");
      if (pm) return this.setPaymentMethod(pm.dataset.paymethod);
      const payBtn = e.target.closest('[id$="pay-btn"]');
      if (payBtn) return this.pay(payBtn);
    });
    panel.addEventListener("input", e => {
      if (e.target.matches('[id$="discount-value"]')) {
        const type = $('[id$="discount-type"]', panel)?.value || "nominal";
        e.target.value = type === "persen" ? digitsOnly(e.target.value).slice(0, 3) : fmtDigits(e.target.value);
        State.set({ discountValue: digitsOnly(e.target.value) });
        return this.refreshCartAreas();
      }
      if (e.target.matches('[id$="payment-input"]')) {
        e.target.value = fmtDigits(e.target.value);
        State.set({ payment: digitsOnly(e.target.value) });
        return this.refreshCartAreas();
      }
      if (e.target.matches("[data-note]")) {
        const line = Cart.find(e.target.dataset.note);
        if (line) { line.notes = e.target.value; State.save(); }
      }
    });
    panel.addEventListener("change", e => {
      if (e.target.matches('[id$="discount-type"]')) {
        State.set({ discountType: e.target.value });
        return this.refreshCartAreas();
      }
    });
  },

  setOrderType(type) {
    State.set({ orderType: type, tableNo: type === "take_away" ? "" : State.d.tableNo });
    this.render();
  },
  setPaymentMethod(method) {
    if (!PAYMENT_METHODS[method]) return;
    const t = Cart.totals(this.settings);
    State.set({ paymentMethod: method, payment: method === "qris" ? String(t.total) : State.d.payment });
    this.refreshCartAreas();
  },
  setCategory(id) { this.activeCat = id; $("#product-grid", this.root).innerHTML = this.productGrid(); this.rebindGrid(); this.highlightCat(id); },
  highlightCat(id) { $$(".cat-chip", this.root).forEach(b => { const on = b.dataset.cat === id; b.classList.toggle("is-active", on); b.setAttribute("aria-selected", on); }); },
  rebindGrid() { /* delegasi sudah di root, tidak perlu re-bind */ },

  saveCustomDraft() {
    const cat = this.categories.find(c => c.id === this.activeCat);
    if (!cat) return;
    const name = $("#custom-name", this.root)?.value || "";
    const price = digitsOnly($("#custom-price", this.root)?.value || "");
    const qty = digitsOnly($("#custom-qty", this.root)?.value || "") || "1";
    State.d.customDrafts[cat.id] = { name, price, qty };
    State.save();
  },
  stepCustomQty(dir) {
    const el = $("#custom-qty", this.root); if (!el) return;
    const v = Math.max(1, Math.min(999, (parseInt(el.value, 10) || 1) + dir));
    el.value = String(v); this.saveCustomDraft();
  },
  addCustomToCart() {
    const cat = this.categories.find(c => c.id === this.activeCat);
    if (!cat) return;
    const name = ($("#custom-name", this.root)?.value || "").trim();
    const price = toInt($("#custom-price", this.root)?.value);
    const qty = cat.custom_mode === "name_price_qty" ? Math.max(1, toInt($("#custom-qty", this.root)?.value) || 1) : 1;
    if (!name) { Toast.error("Masukkan nama produk."); $("#custom-name", this.root)?.focus(); return; }
    if (!price || price <= 0) { Toast.error("Masukkan harga yang valid."); $("#custom-price", this.root)?.focus(); return; }
    Cart.add({ product_id: null, name, base_price: price, qty, is_custom: true, condiment: null, condiment_detail: null, temperature: null, notes: "" });
    State.d.customDrafts[cat.id] = { name: "", price: "", qty: "1" };
    State.save();
    Toast.success(`${name} ditambahkan ke keranjang.`);
    this.render();
    if ($("#product-grid", this.root)) { $("#product-grid", this.root).innerHTML = this.productGrid(); this.highlightCat(cat.id); }
  },

  openProduct(id) {
    const p = this.products.find(x => x.id === id);
    if (!p) return;
    ProductModal.open(p, this.settings, line => {
      Cart.add(line);
      Toast.success(`${line.name} ditambahkan ke keranjang.`);
      this.render();
    });
  },

  removeLine(id) {
    const removed = Cart.remove(id);
    this.render();
    if (removed) {
      Toast.show(`${removed.line.name} dihapus.`, "info", 4000);
      // Sederhana & aman: tanpa tombol undo di toast untuk menghindari state basi; hapus memang harus disengaja.
    }
  },
  stepLine(id, dir) {
    const l = Cart.find(id); if (!l) return;
    l.qty = Math.max(1, Math.min(999, l.qty + dir));
    State.save();
    this.refreshCartAreas();
  },

  refreshCartAreas() {
    this.syncQrisPayment();
    const desktop = $("#cart-panel", this.root), sheet = $("#cart-sheet", this.root);
    if (desktop) desktop.innerHTML = this.cartPanel(false);
    if (sheet) sheet.innerHTML = `<div class="cart-sheet__handle" id="sheet-handle"></div>` + this.cartPanel(true);
    const fab = $("#fab-count", this.root); if (fab) fab.textContent = Cart.count();
  },

  async pay(btn) {
    const t = Cart.totals(this.settings);
    const d = State.d;
    if (!d.orderType) { Toast.error("Pilih Dine In atau Take Away terlebih dahulu."); return; }
    if (this.settings.tables_enabled && d.orderType === "dine_in" && !d.tableNo) { Toast.error("Pilih nomor meja."); return; }
    if (!d.cart.length) { Toast.error("Keranjang masih kosong."); return; }
    if (t.payment < t.total) { Toast.error(`Uang dibayar kurang ${rp(t.total - t.payment)}.`); return; }

    const items = d.cart.map(l => ({
      product_id: l.product_id, product_name: l.name, base_price: l.base_price, quantity: l.qty,
      condiment: l.condiment, condiment_detail: l.condiment_detail, temperature: l.temperature, taste: l.taste || null,
      notes: (l.notes || "").trim(), tetelan_quantity: 0, tetelan_price: 0,
      is_custom: !!l.is_custom
    }));
    const payload = {
      order_type: d.orderType, table_no: d.tableNo || null, items,
      subtotal: t.subtotal, discount: t.discount, tax: t.tax, total: t.total, payment: t.payment, change: t.change,
      payment_method: PAYMENT_METHODS[d.paymentMethod] ? d.paymentMethod : "tunai",
      cashier: Auth.name(), client_txn_key: d.txnKey
    };

    await withLoading(btn, async () => {
      try {
        const { order, items: savedItems } = await App.adapter.createOrder(payload);
        Toast.success(`Transaksi ${order.order_number} tersimpan.`);
        State.reset();
        ReceiptModal.open(order, savedItems, this.settings);
        this.render();
      } catch (e) {
        console.error(e);
        if (isNetworkError(e)) Toast.error("Internet terputus. Transaksi belum tersimpan — coba lagi setelah koneksi normal.");
        else Toast.error(friendlyError(e));
        // Data input kasir TIDAK dihapus: State tidak direset agar bisa dicoba lagi (client_txn_key tetap sama, aman dari duplikasi).
      }
    });
  }
};

/* ---------- Modal pemilihan kondimen / es-hangat ---------- */
const ProductModal = {
  open(product, settings, onAdd) {
    const needsCampur = product.condiment_options ? product.condiment_options.includes("Campur") : true;
    const campurItems = settings.campur_items && settings.campur_items.length ? settings.campur_items : CAMPUR_CHOICES;
    const availableCondiments = product.condiment_options && product.condiment_options.length
      ? CONDIMENTS.filter(c => product.condiment_options.includes(c.key))
      : CONDIMENTS;
    const st = { condiment: null, condimentDetail: [], temperature: null, taste: null, qty: 1, notes: "" };

    const body = document.createElement("div");
    body.className = "product-modal";
    const render = () => {
      body.innerHTML = `
        ${product.description ? `<p class="product-modal__desc">${esc(product.description)}</p>` : ""}
        <div class="product-modal__price">${rp(product.price)}</div>

        ${product.requires_condiment ? `
        <div class="field-group">
          <div class="field-group__label">Pilih Kondimen</div>
          <div class="choice-grid">
            ${availableCondiments.map(c => `
              <button type="button" class="choice-card ${st.condiment === c.key ? "is-selected" : ""}" data-condiment="${esc(c.key)}">
                <span class="choice-card__icon">${c.icon}</span><span>${esc(c.key)}</span>
              </button>`).join("")}
          </div>
          ${st.condiment === "Campur" && needsCampur ? `
          <div class="field-group__label field-group__label--sub">Kombinasi Campur</div>
          <div class="choice-grid choice-grid--wrap">
            ${campurItems.map(it => `
              <button type="button" class="choice-chip ${st.condimentDetail.includes(it) ? "is-selected" : ""}" data-campur="${esc(it)}">${esc(it)}</button>`).join("")}
          </div>` : ""}
        </div>` : ""}

        ${product.allow_ice_option ? `
        <div class="field-group">
          <div class="field-group__label">Es / Hangat</div>
          <div class="choice-grid choice-grid--2">
            ${TEMPS.map(t => `
              <button type="button" class="choice-card ${st.temperature === t.key ? "is-selected" : ""}" data-temp="${esc(t.key)}">
                <span class="choice-card__icon">${t.icon}</span><span>${esc(t.key)}</span>
              </button>`).join("")}
          </div>
        </div>` : ""}

        ${product.allow_taste_option ? `
        <div class="field-group">
          <div class="field-group__label">Asin / Manis</div>
          <div class="choice-grid choice-grid--2">
            ${TASTES.map(t => `
              <button type="button" class="choice-card ${st.taste === t.key ? "is-selected" : ""}" data-taste="${esc(t.key)}">
                <span class="choice-card__icon">${t.icon}</span><span>${esc(t.key)}</span>
              </button>`).join("")}
          </div>
        </div>` : ""}

        <div class="field-group">
          <div class="field-group__label">Jumlah</div>
          <div class="qty-stepper qty-stepper--form">
            <button type="button" class="qty-btn" id="pm-qty-minus">−</button>
            <span class="qty-val qty-val--lg">${st.qty}</span>
            <button type="button" class="qty-btn" id="pm-qty-plus">+</button>
          </div>
        </div>

        <label class="field">
          <span>Catatan (opsional)</span>
          <textarea class="input" id="pm-notes" rows="2" maxlength="140" placeholder="Contoh: jangan terlalu pedas">${esc(st.notes)}</textarea>
        </label>`;

      $$("[data-condiment]", body).forEach(b => b.addEventListener("click", () => {
        st.condiment = st.condiment === b.dataset.condiment ? null : b.dataset.condiment;
        if (st.condiment !== "Campur") st.condimentDetail = [];
        render();
      }));
      $$("[data-campur]", body).forEach(b => b.addEventListener("click", () => {
        const v = b.dataset.campur;
        st.condimentDetail = st.condimentDetail.includes(v) ? st.condimentDetail.filter(x => x !== v) : [...st.condimentDetail, v];
        render();
      }));
      $$("[data-temp]", body).forEach(b => b.addEventListener("click", () => { st.temperature = b.dataset.temp; render(); }));
      $$("[data-taste]", body).forEach(b => b.addEventListener("click", () => { st.taste = b.dataset.taste; render(); }));
      $("#pm-qty-minus", body)?.addEventListener("click", () => { st.qty = Math.max(1, st.qty - 1); render(); });
      $("#pm-qty-plus", body)?.addEventListener("click", () => { st.qty = Math.min(999, st.qty + 1); render(); });
      $("#pm-notes", body)?.addEventListener("input", e => { st.notes = e.target.value; });
    };
    render();

    const overlay = Modal.open({
      title: `${esc(product.name)}`, body, size: "md",
      footer: `<button type="button" class="btn btn--primary btn--block btn--lg" id="pm-add">Tambah ke Keranjang</button>`
    });

    $("#pm-add", overlay).addEventListener("click", () => {
      if (product.requires_condiment && !st.condiment) { Toast.error("Pilih kondimen terlebih dahulu."); return; }
      if (st.condiment === "Campur" && needsCampur && !st.condimentDetail.length) { Toast.error("Pilih minimal satu kombinasi untuk Campur."); return; }
      if (product.allow_ice_option && !st.temperature) { Toast.error("Pilih Es atau Hangat."); return; }
      if (product.allow_taste_option && !st.taste) { Toast.error("Pilih Asin atau Manis."); return; }
      onAdd({
        product_id: product.id, name: product.name, base_price: product.price, qty: st.qty,
        condiment: st.condiment, condiment_detail: st.condimentDetail.length ? st.condimentDetail.join(", ") : null,
        temperature: st.temperature, taste: st.taste,
        notes: st.notes.trim(), is_custom: false
      });
      Modal.close(overlay);
    });
  }
};

/* ---------- Modal struk setelah pembayaran ---------- */
const ReceiptModal = {
  open(order, items, settings) {
    const body = document.createElement("div");
    body.innerHTML = Receipt.htmlFor(order, items, settings);
    const overlay = Modal.open({
      title: "✅ Pembayaran Berhasil", body, size: "sm", dismissible: true,

        <div class="receipt-actions">
          <button type="button" class="btn btn--ghost" id="rc-print">🖨️ Cetak Struk</button>

          <button type="button" class="btn btn--primary btn--block" id="rc-new">🔄 Transaksi Baru</button>
        </div>`
    });
    $("#rc-print", overlay).addEventListener("click", () => Receipt.print(order, items, settings));

    $("#rc-pdf", overlay).addEventListener("click", () => Receipt.savePdf(order, items, settings));

  }
};

/* ---------- Transaksi: riwayat lengkap dengan pencarian & filter ---------- */
const TransaksiPage = {
  async mount(root) {
    this.root = root;
    this.settings = await App.adapter.getSettings();
    this.filters = { from: todayStr(), to: todayStr(), orderType: "", query: "" };
    await this.reload();
    // Delegasi klik dibind sekali per mount agar tidak menumpuk saat reload()/render() dipanggil ulang.
    this.root.addEventListener("click", async e => {
      const btn = e.target.closest("[data-view-order]");
      if (!btn) return;
      const order = this.orders.find(o => o.id === btn.dataset.viewOrder);
      const items = await App.adapter.getOrderItems(order.id);
      this.openDetail(order, items);
    });
  },
  async reload() {
    const { from, to } = dayRange(this.filters.from, this.filters.to);
    this.orders = await App.adapter.listOrders({ from, to, orderType: this.filters.orderType || undefined, query: this.filters.query || undefined });
    this.render();
  },
  render() {
    const f = this.filters;
    const totalSum = this.orders.filter(o => o.status !== "cancelled").reduce((a, o) => a + o.total, 0);
    this.root.innerHTML = `
      <div class="page">
        <div class="page__head"><h1>💰 Riwayat Transaksi</h1></div>
        <div class="filter-bar">
          <input type="date" class="input" id="f-from" value="${f.from}">
          <span class="filter-bar__sep">–</span>
          <input type="date" class="input" id="f-to" value="${f.to}">
          <select class="input" id="f-type">
            <option value="">Semua Tipe</option>
            ${Object.entries(ORDER_TYPES).map(([k, v]) => `<option value="${k}" ${f.orderType === k ? "selected" : ""}>${v.label}</option>`).join("")}
          </select>
          <input type="search" class="input" id="f-query" placeholder="Cari no. transaksi / menu…" value="${esc(f.query)}">
        </div>
        <div class="txn-summary">${this.orders.length} transaksi · Total ${rp(totalSum)}</div>
        ${!this.orders.length ? `<div class="empty-state">Tidak ada transaksi pada rentang ini.</div>` : `
        <div class="order-list">${this.orders.map(o => PesananPage.rowHtml(o)).join("")}</div>`}
      </div>`;
    this.bind();
  },
  bind() {
    const root = this.root;
    let t;
    const debounced = () => { clearTimeout(t); t = setTimeout(() => this.applyFilters(), 350); };
    $("#f-from", root).addEventListener("change", e => { this.filters.from = e.target.value; this.applyFilters(); });
    $("#f-to", root).addEventListener("change", e => { this.filters.to = e.target.value; this.applyFilters(); });
    $("#f-type", root).addEventListener("change", e => { this.filters.orderType = e.target.value; this.applyFilters(); });
    $("#f-query", root).addEventListener("input", e => { this.filters.query = e.target.value; debounced(); });
  },
  applyFilters() { this.reload(); },
  openDetail(order, items) {
    const info = ORDER_TYPES[order.order_type];
    const body = document.createElement("div");
    body.innerHTML = Receipt.htmlFor(order, items, this.settings);
    const canCancel = order.status !== "cancelled" && Auth.isAdmin();
    const overlay = Modal.open({
      title: `${info.icon} ${order.order_number}`, body, size: "sm",
      footer: `
        <div class="receipt-actions">
          <button type="button" class="btn btn--ghost" id="d-print">🖨️ Cetak Ulang</button>
          <button type="button" class="btn btn--ghost" id="d-pdf">📄 PDF</button>
          ${canCancel ? `<button type="button" class="btn btn--danger btn--block" id="d-cancel">Batalkan Transaksi</button>` : ""}
        </div>`
    });
    $("#d-print", overlay).addEventListener("click", () => Receipt.print(order, items, this.settings));
    $("#d-pdf", overlay).addEventListener("click", () => Receipt.savePdf(order, items, this.settings));
    $("#d-cancel", overlay)?.addEventListener("click", async () => {
      const ok = await Modal.confirm({ title: "Batalkan Transaksi", message: `Batalkan transaksi ${order.order_number}? Tindakan ini memerlukan verifikasi admin.`, danger: true, okText: "Batalkan" });
      if (!ok) return;
      const admin = await Modal.promptAdminPin(App.adapter);
      if (!admin) return;
      try {
        await App.adapter.cancelOrder(order.id, `Dibatalkan oleh ${admin.name || admin.username}`);
        Toast.success("Transaksi dibatalkan.");
        Modal.close(overlay);
        this.reload();
      } catch (err) { Toast.error(friendlyError(err)); }
    });
  }
};

/* ---------- Laporan / Dashboard ---------- */
const LaporanPage = {
  async mount(root) {
    root.innerHTML = `<div class="page-loading">Menyusun laporan…</div>`;
    const { from, to } = dayRange(todayStr());
    const [allOrders, expenses] = await Promise.all([
      App.adapter.listOrders({ from, to, limit: 2000 }),
      App.adapter.listExpenses({ from, to })
    ]);
    const orders = allOrders.filter(o => o.status !== "cancelled");
    const allItems = orders.length ? await App.adapter.getOrderItemsBulk(orders.map(o => o.id)) : [];

    const totalSales = orders.reduce((a, o) => a + o.total, 0);
    const dineIn = orders.filter(o => o.order_type === "dine_in").length;
    const takeAway = orders.filter(o => o.order_type === "take_away").length;
    const productSold = allItems.reduce((a, it) => a + it.quantity, 0);
    const cashOrders = orders.filter(o => (o.payment_method || "tunai") === "tunai");
    const qrisOrders = orders.filter(o => o.payment_method === "qris");
    const expensesTotal = expenses.reduce((a, e) => a + e.amount, 0);
    const netAfterExpenses = totalSales - expensesTotal;

    const byName = {};
    for (const it of allItems) byName[it.product_name] = (byName[it.product_name] || 0) + it.quantity;
    const top = Object.entries(byName).sort((a, b) => b[1] - a[1]).slice(0, 5);
    const lastOrder = orders[0];

    const cards = [
      ["🧾", "Total Transaksi", orders.length],
      ["💵", "Total Penjualan", rp(totalSales)],
      ["🏠", "Dine In", dineIn],
      ["🛍️", "Take Away", takeAway],
      ["📦", "Produk Terjual", productSold]
    ];

    root.innerHTML = `
      <div class="page">
        <div class="page__head"><h1>📊 Laporan Hari Ini</h1><span class="page__sub">${fmtDate(new Date().toISOString())}</span></div>
        <div class="stat-grid">
          ${cards.map(([icon, label, val]) => `
            <div class="stat-card"><span class="stat-card__icon">${icon}</span>
              <span class="stat-card__label">${label}</span>
              <span class="stat-card__value">${val}</span></div>`).join("")}
        </div>
        <div class="report-cols">
          <section class="report-block">
            <h2>Rincian Pembayaran</h2>
            <div class="summary-row"><span>💵 Tunai (${cashOrders.length} transaksi)</span><span>${rp(cashOrders.reduce((a, o) => a + o.total, 0))}</span></div>
            <div class="summary-row"><span>🔳 QRIS (${qrisOrders.length} transaksi)</span><span>${rp(qrisOrders.reduce((a, o) => a + o.total, 0))}</span></div>
            <div class="summary-row"><span>Pengeluaran (${expenses.length})</span><span>-${rp(expensesTotal)}</span></div>
            <div class="summary-row summary-row--total"><span>Selisih Bersih</span><span>${rp(netAfterExpenses)}</span></div>
          </section>
          <section class="report-block">
            <h2>Menu Paling Banyak Terjual</h2>
            ${top.length ? `<ol class="rank-list">${top.map(([n, q]) => `<li><span>${esc(n)}</span><span>${q}</span></li>`).join("")}</ol>` : `<p class="menu-section__note">Belum ada data.</p>`}
          </section>
          <section class="report-block">
            <h2>Transaksi Terakhir</h2>
            ${lastOrder ? `<div class="order-list">${PesananPage.rowHtml(lastOrder)}</div>` : `<p class="menu-section__note">Belum ada transaksi.</p>`}
          </section>
        </div>
      </div>`;
    root.addEventListener("click", async e => {
      const btn = e.target.closest("[data-view-order]");
      if (!btn) return;
      const order = orders.find(o => o.id === btn.dataset.viewOrder);
      const items = await App.adapter.getOrderItems(order.id);
      const settings = await App.adapter.getSettings();
      ReceiptModal.open(order, items, settings);
    });
  }
};

  /* ---------- Tab: Koneksi Printer (Bluetooth) ---------- */

        <p class="menu-section__note">Menghubungkan printer thermal Bluetooth (BLE) langsung dari browser. Hanya berjalan di Chrome (Android/Desktop) — tidak didukung Safari/iOS. Bila printer memakai Bluetooth klasik (SPP), koneksi ini tidak akan berhasil; gunakan tombol cetak biasa (dialog cetak) sebagai jalan alternatif.</p>

  /* ---------- Tab: Tutup Kasir ---------- */
  async renderTutup() {
    const wrap = $("#pengaturan-content", this.root);
    wrap.innerHTML = `<div class="page-loading">Memuat…</div>`;
    try { await this.loadTutupData(); }
    catch (e) { wrap.innerHTML = `<p class="menu-section__note">Gagal memuat data: ${esc(friendlyError(e))}</p>`; return; }
    this.renderTutupBody();
  },

  async loadTutupData() {
    const [lastClosing, closings] = await Promise.all([
      App.adapter.getLastClosing(),
      App.adapter.listCashClosings({ limit: 10 })
    ]);
    const from = lastClosing ? lastClosing.created_at : dayRange(todayStr()).from;
    const [orders, expenses] = await Promise.all([
      App.adapter.listOrders({ from, limit: 2000 }),
      App.adapter.listExpenses({ from })
    ]);
    const activeOrders = orders.filter(o => o.status !== "cancelled");
    this._tk = {
      lastClosing, closings, from,
      cashSales: activeOrders.filter(o => (o.payment_method || "tunai") === "tunai").reduce((a, o) => a + o.total, 0),
      qrisSales: activeOrders.filter(o => o.payment_method === "qris").reduce((a, o) => a + o.total, 0),
      expenses, expensesTotal: expenses.reduce((a, e) => a + e.amount, 0)
    };
  },

  renderTutupBody() {
    const wrap = $("#pengaturan-content", this.root);
    const tk = this._tk;
    const netCash = tk.cashSales - tk.expensesTotal;
    const grandTotal = netCash + tk.qrisSales;
    const openingFloat = toInt(this.openingFloatDraft) || 0;
    const cashInDrawer = openingFloat + netCash;

    wrap.innerHTML = `
      <section class="settings-block">
        <h2>🧮 Tutup Kasir</h2>
        <p class="menu-section__note">Periode berjalan sejak ${tk.lastClosing ? esc(fmtDateTime(tk.lastClosing.created_at)) : "awal hari ini"}${tk.lastClosing ? "" : " (belum pernah tutup kasir)"}.</p>

        <label class="field"><span>Modal Awal</span>
          <div class="input-prefix"><span>Rp</span><input type="text" inputmode="numeric" class="input" id="tk-modal" placeholder="0" value="${esc(fmtDigits(this.openingFloatDraft))}"></div>
        </label>

        <div class="summary-row"><span>Pemasukan Tunai</span><span>${rp(tk.cashSales)}</span></div>

        <div class="closing-expenses">
          <div class="closing-expenses__head">Pengeluaran</div>
          ${tk.expenses.length ? tk.expenses.map(e => `
            <div class="expense-row">
              <div class="expense-row__info"><span class="expense-row__amount">${rp(e.amount)}</span><span class="tag tag--soft">${esc(e.category || "Lainnya")}</span>${e.note ? `<span class="expense-row__note">${esc(e.note)}</span>` : ""}</div>
              <button type="button" class="btn btn--sm btn--danger-text" data-del-expense="${e.id}">Hapus</button>
            </div>`).join("") : `<p class="menu-section__note">Belum ada pengeluaran di periode ini.</p>`}
          <div class="expense-add-row">
            <div class="input-prefix"><span>Rp</span><input type="text" inputmode="numeric" class="input" id="tk-exp-amount" placeholder="Nominal"></div>
            <select class="input" id="tk-exp-category">${EXPENSE_CATEGORIES.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("")}</select>
            <input type="text" class="input" id="tk-exp-note" placeholder="Catatan (opsional)">
            <button type="button" class="btn btn--ghost" id="tk-exp-add">+ Tambah</button>
          </div>
        </div>

        <div class="summary-row"><span>Total Pengeluaran</span><span>-${rp(tk.expensesTotal)}</span></div>
        <div class="summary-row summary-row--total"><span>Penjualan Tunai Bersih</span><span>${rp(netCash)}</span></div>
        <div class="summary-row"><span>Pemasukan QRIS</span><span>${rp(tk.qrisSales)}</span></div>
        <div class="summary-row summary-row--total"><span>Subtotal Akhir Seluruh Penjualan</span><span>${rp(grandTotal)}</span></div>
        <div class="summary-row summary-row--change"><span>Perkiraan Kas Tunai di Laci</span><span id="tk-cash-drawer">${rp(cashInDrawer)}</span></div>

        <button type="button" class="btn btn--primary btn--block btn--lg" id="tk-close" data-loading-text="Menyimpan…">✅ Tutup Kasir &amp; Simpan</button>
      </section>

      ${tk.closings.length ? `
      <section class="settings-block">
        <h2>Riwayat Tutup Kasir</h2>
        ${tk.closings.map(c => `
          <div class="closing-row">
            <div class="closing-row__info">
              <span class="closing-row__date">${esc(fmtDateTime(c.created_at))}</span>
              <span class="closing-row__cashier">${esc(c.cashier || "-")}</span>
            </div>
            <span class="closing-row__total">${rp(c.grand_total)}</span>
            <button type="button" class="btn btn--sm btn--ghost" data-print-closing="${c.id}">🖨️</button>
          </div>`).join("")}
      </section>` : ""}`;

    $$('input[inputmode="numeric"]', wrap).forEach(inp => inp.addEventListener("input", () => { inp.value = digitsOnly(inp.value); }));

    $("#tk-modal", wrap).addEventListener("input", e => {
      this.openingFloatDraft = digitsOnly(e.target.value);
      e.target.value = fmtDigits(this.openingFloatDraft);
      const nc = tk.cashSales - tk.expensesTotal;
      $("#tk-cash-drawer", wrap).textContent = rp((toInt(this.openingFloatDraft) || 0) + nc);
    });

    $("#tk-exp-add", wrap).addEventListener("click", async () => {
      const amount = toInt($("#tk-exp-amount", wrap).value);
      const category = $("#tk-exp-category", wrap).value;
      const note = $("#tk-exp-note", wrap).value.trim();
      if (!amount || amount <= 0) { Toast.error("Masukkan nominal pengeluaran yang valid."); return; }
      try {
        await App.adapter.addExpense({ amount, category, note, cashier: Auth.name() });
        await this.loadTutupData();
        this.renderTutupBody();
        Toast.success("Pengeluaran ditambahkan.");
      } catch (e) { Toast.error(friendlyError(e)); }
    });

    $$("[data-del-expense]", wrap).forEach(b => b.addEventListener("click", async () => {
      const ok = await Modal.confirm({ title: "Hapus Pengeluaran", message: "Hapus catatan pengeluaran ini?", danger: true, okText: "Hapus" });
      if (!ok) return;
      try { await App.adapter.deleteExpense(b.dataset.delExpense); await this.loadTutupData(); this.renderTutupBody(); Toast.success("Pengeluaran dihapus."); }
      catch (err) { Toast.error(friendlyError(err)); }
    }));

    $$("[data-print-closing]", wrap).forEach(b => b.addEventListener("click", () => {
      const c = tk.closings.find(x => x.id === b.dataset.printClosing);
      if (c) this.printClosingReport(c);
    }));

    $("#tk-close", wrap).addEventListener("click", async e => {
      const ok = await Modal.confirm({ title: "Tutup Kasir", message: `Simpan tutup kasir dengan subtotal akhir ${rp(grandTotal)}? Periode berjalan akan direset setelah ini.`, okText: "Tutup Kasir" });
      if (!ok) return;
      await withLoading(e.currentTarget, async () => {
        try {
          await App.adapter.saveCashClosing({
            period_from: tk.from, opening_float: openingFloat, cash_sales: tk.cashSales,
            expenses_total: tk.expensesTotal, net_cash_sales: netCash, qris_sales: tk.qrisSales,
            grand_total: grandTotal, cash_in_drawer: cashInDrawer, cashier: Auth.name()
          });
          Toast.success("Kasir ditutup & tersimpan.");
          this.openingFloatDraft = "";
          await this.loadTutupData();
          this.renderTutupBody();
        } catch (err) { Toast.error(friendlyError(err)); }
      });
    });
  },

  closingReportText(c) {
    const width = Device.width;
    const line = ch => ch.repeat(width);
    const center = s => { s = String(s).slice(0, width); const pad = Math.max(0, Math.floor((width - s.length) / 2)); return " ".repeat(pad) + s; };
    const rowLR = (l, r) => { l = String(l); r = String(r); return l + " ".repeat(Math.max(1, width - l.length - r.length)) + r; };
    const out = [];
    out.push(center(this.settings.restaurant_name || "Restoran"));
    out.push(center("REKAP TUTUP KASIR"));
    out.push(line("="));
    out.push(rowLR("Tanggal", fmtDateTime(c.created_at)));
    out.push(rowLR("Kasir", c.cashier || "-"));
    out.push(line("-"));
    out.push(rowLR("Modal Awal", rp(c.opening_float)));
    out.push(rowLR("Pemasukan Tunai", rp(c.cash_sales)));
    out.push(rowLR("Pengeluaran", "-" + rp(c.expenses_total)));
    out.push(rowLR("Penjualan Tunai Bersih", rp(c.net_cash_sales)));
    out.push(rowLR("Pemasukan QRIS", rp(c.qris_sales)));
    out.push(line("-"));
    out.push(rowLR("SUBTOTAL AKHIR", rp(c.grand_total)));
    out.push(rowLR("Kas di Laci", rp(c.cash_in_drawer)));
    out.push(line("="));
    return out.join("\n");
  },
  async printClosingReport(c) {
    const text = this.closingReportText(c);
    if (Device.get("use_bt_printer") && BtPrinter.isConnected()) {
      try { await BtPrinter.printText(text); Toast.success("Rekap dikirim ke printer Bluetooth."); return; }
      catch (e) { Toast.error("Gagal cetak Bluetooth: " + friendlyError(e)); return; }
    }
    const w = window.open("", "_blank", "width=420,height=640");
    if (!w) { Toast.error("Popup diblokir. Izinkan popup untuk mencetak."); return; }
    w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Rekap Tutup Kasir</title>
      <style>body{font-family:'Courier New',monospace;font-size:12px;white-space:pre;padding:8px;width:${Device.width === 42 ? "80mm" : "58mm"};}</style>
      </head><body>${text.split("\n").map(esc).join("<br>")}
      <script>window.onload=()=>{window.print(); setTimeout(()=>window.close(), 300);}<\/script>
      </body></html>`);
    w.document.close();
  }
};

/* ==========================================================================

const AdminPage = {
  tab: "menu",
  async mount(root, subTab) {
    this.root = root;
    if (subTab) this.tab = subTab;
    if (!Auth.isAdmin()) {
      const admin = await Modal.promptAdminPin(App.adapter);
      if (!admin) { App.navigate("kasir"); return; }
      Toast.success(`Masuk sebagai ${admin.name || admin.username}.`);
    }
    await this.reload();
  },
  async reload() {
    [this.categories, this.products, this.users] = await Promise.all([
      App.adapter.listCategories(), App.adapter.listProducts(), App.adapter.listUsers()
    ]);
    this.categories.sort((a, b) => a.sort_order - b.sort_order);
    this.render();
  },
  render() {
    this.root.innerHTML = `
      <div class="page">
        <div class="page__head"><h1>🔐 Panel Admin</h1></div>
        <div class="tab-bar">
          <button type="button" class="tab-btn ${this.tab === "menu" ? "is-active" : ""}" data-tab="menu">Menu &amp; Kategori</button>
          <button type="button" class="tab-btn ${this.tab === "users" ? "is-active" : ""}" data-tab="users">Pengguna</button>
        </div>
        <div id="admin-content"></div>
      </div>`;
    $$("[data-tab]", this.root).forEach(b => b.addEventListener("click", () => { this.tab = b.dataset.tab; this.render(); }));
    if (this.tab === "menu") this.renderMenuTab(); else this.renderUsersTab();
  },

  /* ---------- Tab Menu & Kategori ---------- */
  renderMenuTab() {
    const wrap = $("#admin-content", this.root);
    wrap.innerHTML = `
      <div class="admin-toolbar">
        <button type="button" class="btn btn--primary" id="add-cat-btn">+ Kategori</button>
        <button type="button" class="btn btn--ghost" id="reseed-btn">⬆️ Import Menu dari Data</button>
      </div>
      <div class="admin-cats">
        ${this.categories.map(c => this.catBlock(c)).join("")}
      </div>`;
    $("#add-cat-btn", wrap).addEventListener("click", () => this.openCategoryForm());
    $("#reseed-btn", wrap).addEventListener("click", async e => {
      await withLoading(e.currentTarget, async () => {
        try {
          const report = await seedMenu(App.adapter);
          await this.reload();
          await Modal.alert({ title: "Import Menu Selesai", message: formatSeedReport(report) });
        } catch (err) { Toast.error(friendlyError(err)); }
      });
    });
    wrap.addEventListener("click", e => {
      const editCat = e.target.closest("[data-edit-cat]"); if (editCat) return this.openCategoryForm(this.categories.find(c => c.id === editCat.dataset.editCat));
      const delCat = e.target.closest("[data-del-cat]"); if (delCat) return this.deleteCategory(delCat.dataset.delCat);
      const addProd = e.target.closest("[data-add-prod]"); if (addProd) return this.openProductForm(null, addProd.dataset.addProd);
      const editProd = e.target.closest("[data-edit-prod]"); if (editProd) return this.openProductForm(this.products.find(p => p.id === editProd.dataset.editProd));
      const delProd = e.target.closest("[data-del-prod]"); if (delProd) return this.deleteProduct(delProd.dataset.delProd);
      const toggleProd = e.target.closest("[data-toggle-prod]"); if (toggleProd) return this.toggleProductActive(toggleProd.dataset.toggleProd);
    });
  },

  catBlock(c) {
    const items = this.products.filter(p => p.category_id === c.id).sort((a, b) => a.sort_order - b.sort_order);
    return `<section class="admin-cat">
      <header class="admin-cat__head">
        <span class="admin-cat__title">${esc(c.icon || "🍽️")} ${esc(c.name)} ${c.active === false ? `<span class="tag tag--muted">Nonaktif</span>` : ""} ${c.custom_mode !== "none" ? `<span class="tag tag--soft">${esc(CUSTOM_MODES[c.custom_mode])}</span>` : ""}</span>
        <div class="admin-cat__actions">
          ${c.custom_mode === "none" ? `<button type="button" class="btn btn--sm btn--ghost" data-add-prod="${c.id}">+ Menu</button>` : ""}
          <button type="button" class="btn btn--sm btn--ghost" data-edit-cat="${c.id}">Edit</button>
          <button type="button" class="btn btn--sm btn--ghost btn--danger-text" data-del-cat="${c.id}">Hapus</button>
        </div>
      </header>
      ${c.custom_mode !== "none" ? `<p class="menu-section__note">Kategori custom: kasir memasukkan nama${c.custom_mode === "name_price_qty" ? ", harga, dan jumlah" : " dan harga"} sendiri.</p>` :

          ${items.map(p => `<div class="admin-prod-row ${p.active === false ? "is-inactive" : ""}">

              </span>
            </div>
            <div class="admin-prod-row__actions">
              <button type="button" class="btn btn--sm btn--ghost" data-toggle-prod="${p.id}">${p.active === false ? "Aktifkan" : "Nonaktifkan"}</button>
              <button type="button" class="btn btn--sm btn--ghost" data-edit-prod="${p.id}">Edit</button>

            </div>

  openCategoryForm(cat) {
    const isNew = !cat;
    const state = cat ? { ...cat } : { name: "", icon: "🍽️", custom_mode: "none", active: true };
    const body = document.createElement("div");
    body.innerHTML = `
      <label class="field"><span>Ikon (emoji)</span><input type="text" class="input" id="c-icon" maxlength="4" value="${esc(state.icon || "")}"></label>
      <label class="field"><span>Nama Kategori</span><input type="text" class="input" id="c-name" maxlength="60" value="${esc(state.name)}"></label>
      <label class="field"><span>Tipe Kategori</span>
        <select class="input" id="c-mode">
          ${Object.entries(CUSTOM_MODES).map(([k, v]) => `<option value="${k}" ${state.custom_mode === k ? "selected" : ""}>${esc(v)}</option>`).join("")}
        </select>
      </label>
      <label class="toggle-row"><span>Aktif</span><input type="checkbox" id="c-active" ${state.active !== false ? "checked" : ""}></label>`;
    const overlay = Modal.open({
      title: isNew ? "Tambah Kategori" : "Edit Kategori", body, size: "sm",
      footer: `<button type="button" class="btn btn--ghost" data-act="cancel">Batal</button><button type="button" class="btn btn--primary" id="c-save">Simpan</button>`
    });
    $('[data-act="cancel"]', overlay).addEventListener("click", () => Modal.close(overlay));
    $("#c-save", overlay).addEventListener("click", async () => {
      const name = $("#c-name", overlay).value.trim();
      if (!name) { Toast.error("Nama kategori wajib diisi."); return; }
      await withLoading($("#c-save", overlay), async () => {
        try {
          await App.adapter.saveCategory({
            id: cat?.id, name, icon: $("#c-icon", overlay).value.trim() || "🍽️",
            custom_mode: $("#c-mode", overlay).value, active: $("#c-active", overlay).checked,
            sort_order: cat?.sort_order ?? (this.categories.length + 1)
          });
          Toast.success("Kategori disimpan.");
          Modal.close(overlay); await this.reload();
        } catch (e) { Toast.error(friendlyError(e)); }
      });
    });
  },

  async deleteCategory(id) {
    const ok = await Modal.confirm({ title: "Hapus Kategori", message: "Kategori ini akan dihapus permanen. Lanjutkan?", danger: true, okText: "Hapus" });
    if (!ok) return;
    try { await App.adapter.deleteCategory(id); Toast.success("Kategori dihapus."); await this.reload(); }
    catch (e) { Toast.error(friendlyError(e)); }
  },

  openProductForm(product, presetCategoryId) {
    const isNew = !product;
    const state = product ? { ...product } : {
      category_id: presetCategoryId || this.categories[0]?.id, name: "", description: "", price: "",
      requires_condiment: false, condiment_options: null, allow_ice_option: false, allow_taste_option: false, active: true
    };
    const catOptions = this.categories.filter(c => c.custom_mode === "none");
    const body = document.createElement("div");
    const renderBody = () => {
      body.innerHTML = `
        <label class="field"><span>Kategori</span>
          <select class="input" id="p-cat">${catOptions.map(c => `<option value="${c.id}" ${state.category_id === c.id ? "selected" : ""}>${esc(c.icon)} ${esc(c.name)}</option>`).join("")}</select>
        </label>
        <label class="field"><span>Nama Menu</span><input type="text" class="input" id="p-name" maxlength="80" value="${esc(state.name)}"></label>
        <label class="field"><span>Deskripsi (opsional)</span><input type="text" class="input" id="p-desc" maxlength="140" value="${esc(state.description || "")}"></label>
        <label class="field"><span>Harga</span><div class="input-prefix"><span>Rp</span><input type="text" inputmode="numeric" class="input" id="p-price" value="${fmtDigits(state.price)}"></div></label>
        <label class="toggle-row"><span>Butuh Pilihan Kondimen</span><input type="checkbox" id="p-condiment" ${state.requires_condiment ? "checked" : ""}></label>
        <label class="toggle-row"><span>Punya Pilihan Es/Hangat</span><input type="checkbox" id="p-ice" ${state.allow_ice_option ? "checked" : ""}></label>
        <label class="toggle-row"><span>Punya Pilihan Asin/Manis</span><input type="checkbox" id="p-taste" ${state.allow_taste_option ? "checked" : ""}></label>
        <label class="toggle-row"><span>Aktif</span><input type="checkbox" id="p-active" ${state.active !== false ? "checked" : ""}></label>`;
      bindRupiahInput($("#p-price", body));
    };
    renderBody();
    const overlay = Modal.open({
      title: isNew ? "Tambah Menu" : "Edit Menu", body, size: "sm",
      footer: `<button type="button" class="btn btn--ghost" data-act="cancel">Batal</button><button type="button" class="btn btn--primary" id="p-save">Simpan</button>`
    });
    $('[data-act="cancel"]', overlay).addEventListener("click", () => Modal.close(overlay));
    $("#p-save", overlay).addEventListener("click", async () => {
      const name = $("#p-name", overlay).value.trim();
      const price = toInt($("#p-price", overlay).value);
      if (!name) { Toast.error("Nama menu wajib diisi."); return; }
      if (!price || price <= 0) { Toast.error("Harga harus lebih dari 0."); return; }
      await withLoading($("#p-save", overlay), async () => {
        try {
          await App.adapter.saveProduct({
            id: product?.id, category_id: $("#p-cat", overlay).value, name,
            description: $("#p-desc", overlay).value.trim(), price,
            requires_condiment: $("#p-condiment", overlay).checked,
            allow_ice_option: $("#p-ice", overlay).checked,
            allow_taste_option: $("#p-taste", overlay).checked,
            active: $("#p-active", overlay).checked,
            sort_order: product?.sort_order ?? (this.products.filter(x => x.category_id === $("#p-cat", overlay).value).length + 1)
          });
          Toast.success("Menu disimpan.");
          Modal.close(overlay); await this.reload();
        } catch (e) { Toast.error(friendlyError(e)); }
      });
    });
  },

  async deleteProduct(id) {
    const ok = await Modal.confirm({ title: "Hapus Menu", message: "Menu ini akan dihapus permanen. Lanjutkan?", danger: true, okText: "Hapus" });
    if (!ok) return;
    try { await App.adapter.deleteProduct(id); Toast.success("Menu dihapus."); await this.reload(); }
    catch (e) { Toast.error(friendlyError(e)); }
  },
  async toggleProductActive(id) {
    const p = this.products.find(x => x.id === id);
    try { await App.adapter.saveProduct({ id, active: p.active === false }); await this.reload(); }
    catch (e) { Toast.error(friendlyError(e)); }
  },

  /* ---------- Tab Pengguna ---------- */
  renderUsersTab() {
    const wrap = $("#admin-content", this.root);
    wrap.innerHTML = `
      <div class="admin-toolbar"><button type="button" class="btn btn--primary" id="add-user-btn">+ Pengguna</button></div>
      <div class="admin-prod-list">
        ${this.users.map(u => `
          <div class="admin-prod-row">
            <div class="admin-prod-row__info">
              <span class="admin-prod-row__name">${esc(u.name)} <span class="tag tag--soft">${u.role === "admin" ? "Admin" : "Kasir"}</span> ${u.active === false ? `<span class="tag tag--muted">Nonaktif</span>` : ""}</span>
              <span class="admin-prod-row__price">@${esc(u.username)} ${u.pin_hash ? "· PIN diatur" : "· Tanpa PIN"}</span>
            </div>
            <div class="admin-prod-row__actions">
              <button type="button" class="btn btn--sm btn--ghost" data-edit-user="${u.id}">Edit</button>
            </div>
          </div>`).join("")}
      </div>`;
    $("#add-user-btn", wrap).addEventListener("click", () => this.openUserForm());
    wrap.addEventListener("click", e => {
      const edit = e.target.closest("[data-edit-user]");
      if (edit) this.openUserForm(this.users.find(u => u.id === edit.dataset.editUser));
    });
  },
  openUserForm(user) {
    const isNew = !user;
    const state = user ? { ...user } : { username: "", name: "", role: "cashier", active: true };
    const body = document.createElement("div");
    body.innerHTML = `
      <label class="field"><span>Nama</span><input type="text" class="input" id="u-name" value="${esc(state.name)}"></label>
      <label class="field"><span>Username</span><input type="text" class="input" id="u-username" value="${esc(state.username)}" ${isNew ? "" : "readonly"}></label>
      <label class="field"><span>Peran</span>
        <select class="input" id="u-role"><option value="cashier" ${state.role === "cashier" ? "selected" : ""}>Kasir</option><option value="admin" ${state.role === "admin" ? "selected" : ""}>Admin</option></select>
      </label>
      <label class="field"><span>PIN Baru (kosongkan bila tidak diubah)</span><input type="password" inputmode="numeric" class="input" id="u-pin" maxlength="8" placeholder="••••"></label>
      <label class="toggle-row"><span>Aktif</span><input type="checkbox" id="u-active" ${state.active !== false ? "checked" : ""}></label>`;
    const overlay = Modal.open({
      title: isNew ? "Tambah Pengguna" : "Edit Pengguna", body, size: "sm",
      footer: `<button type="button" class="btn btn--ghost" data-act="cancel">Batal</button><button type="button" class="btn btn--primary" id="u-save">Simpan</button>`
    });
    $('[data-act="cancel"]', overlay).addEventListener("click", () => Modal.close(overlay));
    $("#u-save", overlay).addEventListener("click", async () => {
      const name = $("#u-name", overlay).value.trim(), username = $("#u-username", overlay).value.trim();
      if (!name || !username) { Toast.error("Nama dan username wajib diisi."); return; }
      await withLoading($("#u-save", overlay), async () => {
        try {
          const pin = $("#u-pin", overlay).value.trim();
          const saved = await App.adapter.saveUser({
            id: user?.id, name, username, role: $("#u-role", overlay).value, active: $("#u-active", overlay).checked,
            ...(user ? {} : { pin_hash: null })
          });
          if (pin) await Auth.setPin(App.adapter, saved.id, pin);
          Toast.success("Pengguna disimpan.");
          Modal.close(overlay); await this.reload();
        } catch (e) { Toast.error(friendlyError(e)); }
      });
    });
  }
};


"use strict";
/* ==========================================================================
   9. APP — login, navigasi, layout, boot
   ========================================================================== */

const NAV_ITEMS = [
  { key: "kasir", icon: "🧾", label: "Kasir", page: KasirPage },
  { key: "pesanan", icon: "📋", label: "Pesanan", page: PesananPage },
  { key: "menu", icon: "🍜", label: "Menu", page: MenuPage },
  { key: "transaksi", icon: "💰", label: "Transaksi", page: TransaksiPage },
  { key: "laporan", icon: "📊", label: "Laporan", page: LaporanPage },
  { key: "pengaturan", icon: "⚙️", label: "Pengaturan", page: PengaturanPage },
  { key: "admin", icon: "🔐", label: "Admin", page: AdminPage, adminOnly: true }
];

const App = {
  adapter: null, mode: "connecting", connError: "", current: "kasir",

  async boot() {
    Device.load();
    Auth.load();
    Toast.init();
    document.documentElement.style.setProperty("--paper-cols", Device.width);

    const boot = await createAdapter();
    this.adapter = boot.adapter; this.mode = boot.mode; this.connError = boot.error || "";

    if (this.mode === "error") {
      return this.renderConnectionError();
    }

    // Tidak ada seed otomatis. Menu awal hanya dimasukkan lewat tombol "Import Menu dari Data".
    try { await repairMenu(this.adapter); } catch (e) { console.error(e); }
    try { await Auth.ensureDefaultPin(this.adapter); } catch (e) { console.error(e); }

    if (!Auth.isLoggedIn()) return this.renderLogin();
    this.renderShell();
    this.navigate(this.current);
  },

  renderConnectionError() {
    const root = $("#app-root");
    root.innerHTML = `
      <div class="login-screen">
        <div class="login-card">
          <div class="login-card__brand">🔴 Database Supabase Tidak Terhubung</div>
          <p class="field-err" style="position:static;display:block;">Database Supabase tidak dapat dihubungi. Data belum dapat digunakan.${this.connError ? `<br><small>${esc(this.connError)}</small>` : ""}</p>
          <p class="menu-section__note">Aplikasi ini hanya menggunakan Supabase sebagai database — tidak ada mode lokal atau data cadangan di perangkat. Periksa koneksi internet dan pengaturan URL/Anon Key, lalu coba lagi.</p>
          <button type="button" class="btn btn--primary btn--block btn--lg" id="retry-conn-btn">Coba Lagi</button>
        </div>
      </div>`;
    $("#retry-conn-btn").addEventListener("click", () => this.boot());
  },

  renderLogin() {
    const root = $("#app-root");
    root.innerHTML = `
      <div class="login-screen">
        <div class="login-card">
          <div class="login-card__brand">🍜 Kasir Baso &amp; Mie Ayam</div>
          <label class="field"><span>PIN</span><input type="password" inputmode="numeric" maxlength="8" class="input input--lg" id="login-pin" autocomplete="current-password" autofocus></label>
          <p class="field-err" id="login-err" hidden></p>
          <button type="button" class="btn btn--primary btn--block btn--lg" id="login-btn" data-loading-text="Masuk…">Masuk</button>
        </div>
      </div>`;
    const submit = async () => {
      const pin = $("#login-pin").value.trim();
      const err = $("#login-err");
      if (!pin) { err.textContent = "Masukkan PIN."; err.hidden = false; return; }
      await withLoading($("#login-btn"), async () => {
        try {
          await Auth.loginByPin(this.adapter, pin);
          err.hidden = true;
          this.renderShell();
          this.navigate("kasir");
        } catch (e) { err.textContent = friendlyError(e); err.hidden = false; }
      });
    };
    $("#login-btn").addEventListener("click", submit);
    $("#login-pin").addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  },

  renderShell() {
    const items = NAV_ITEMS.filter(i => !i.adminOnly || true); // admin item selalu tampil; akses diverifikasi PIN saat dibuka
    const root = $("#app-root");
    root.innerHTML = `
      <div class="shell">
        <header class="topbar">
          <button type="button" class="topbar__menu" id="hamburger-btn" aria-label="Menu">☰</button>
          <span class="topbar__brand">🍜 Kasir Baso &amp; Mie Ayam</span>
          <span class="topbar__mode ${this.mode === "connected" ? "topbar__mode--cloud" : ""}">${this.mode === "connected" ? "🟢 Database Terhubung" : "🔴 Database Terputus"}</span>
          <span class="topbar__user">${esc(Auth.name())}</span>
          <button type="button" class="topbar__logout" id="logout-btn">Keluar</button>
        </header>
        <nav class="sidenav" id="sidenav">
          ${items.map(i => `<button type="button" class="sidenav__item" data-nav="${i.key}"><span class="sidenav__icon">${i.icon}</span><span>${i.label}</span></button>`).join("")}
        </nav>
        <div class="sidenav-scrim" id="sidenav-scrim"></div>
        <main class="content" id="page-root"></main>
        <nav class="bottomnav" id="bottomnav">
          ${items.filter(i => ["kasir", "pesanan", "menu", "transaksi", "pengaturan"].includes(i.key)).map(i => `
            <button type="button" class="bottomnav__item" data-nav="${i.key}"><span>${i.icon}</span><small>${i.label}</small></button>`).join("")}
          <button type="button" class="bottomnav__item" data-nav="more"><span>⋯</span><small>Lainnya</small></button>
        </nav>
      </div>`;
    $$("[data-nav]", root).forEach(b => b.addEventListener("click", () => {
      if (b.dataset.nav === "more") return this.openMoreSheet();
      this.navigate(b.dataset.nav);
    }));
    $("#hamburger-btn", root).addEventListener("click", () => { $("#sidenav", root).classList.toggle("is-open"); $("#sidenav-scrim", root).classList.toggle("is-show"); });
    $("#sidenav-scrim", root).addEventListener("click", () => { $("#sidenav", root).classList.remove("is-open"); $("#sidenav-scrim", root).classList.remove("is-show"); });
    $("#logout-btn", root).addEventListener("click", async () => {
      const ok = await Modal.confirm({ title: "Keluar", message: "Keluar dari sesi ini?" });
      if (ok) { Auth.logout(); this.renderLogin(); }
    });
  },

  openMoreSheet() {
    const body = document.createElement("div");
    body.className = "more-sheet";
    body.innerHTML = `
      <button type="button" class="more-sheet__item" data-nav="laporan">📊 Laporan</button>
      <button type="button" class="more-sheet__item" data-nav="admin">🔐 Admin</button>`;
    const overlay = Modal.open({ title: "Menu Lainnya", body, size: "sm" });
    $$("[data-nav]", overlay).forEach(b => b.addEventListener("click", () => { Modal.close(overlay); this.navigate(b.dataset.nav); }));
  },

  async navigate(key, subTab) {
    const item = NAV_ITEMS.find(i => i.key === key);
    if (!item) return;
    this.current = key;
    $$("[data-nav]", document).forEach(b => b.classList.toggle("is-active", b.dataset.nav === key));
    $("#sidenav")?.classList.remove("is-open"); $("#sidenav-scrim")?.classList.remove("is-show");
    Sheet.close();
    const root = $("#page-root");
    if (!root) return;
    root.innerHTML = `<div class="page-loading">Memuat…</div>`;
    try { await item.page.mount(root, subTab); }
    catch (e) { console.error(e); root.innerHTML = `<div class="empty-state">Gagal memuat halaman. ${esc(friendlyError(e))}</div>`; }
  }
};

document.addEventListener("DOMContentLoaded", () => App.boot());

</script>
</body>
